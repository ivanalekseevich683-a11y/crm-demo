    const t = PF_TYPES.find((x) => x.id === el.dataset.type);
    st.type = t;
    st.query = t.name;
    input.value = t.name;
    search();
  });

  async function search() {
    $$('.pf-chips .chip', host).forEach((c) => c.classList.toggle('active', c.dataset.type === st.type?.id));
    const q = st.query;
    if (!q && !st.type) { res.innerHTML = ''; return; }
    if (!st.type) {
      const found = pfDetectTypes(q);
      st.type = found.main;
      st.related = found.related;
    } else st.related = [];
    st.article = !st.type && pfLooksLikeArticle(q) ? q.trim() : null;
    res.innerHTML = `<div class="card pf-loading"><div class="pf-spinner"></div><div><b>Ищем у поставщиков…</b><div class="muted small">${esc(pfCarTitle(st.car) || 'автомобиль не указан')} · ${esc(st.type?.name || q)}</div></div></div>`;
    // Свой склад: ищем по первому слову детали и оставляем только то, что распознаётся как та же деталь.
    const stockQ = st.type ? pfNorm(st.type.name).split(' ')[0].slice(0, 6) : q;
    const [stock] = await Promise.all([
      api('/parts', { query: { q: stockQ, limit: 20 } }).catch(() => []),
      new Promise((r) => setTimeout(r, pfDemoCatalog() ? 550 : 150)),
    ]);
    st.stock = stock.filter((p) => p.qty > 0 && (!st.type || pfDetectTypes(p.name).main?.id === st.type.id)).slice(0, 5);
    st.parts = st.type && pfDemoCatalog() ? pfDemoParts(st.car, st.type) : [];
    draw();
  }

  function draw() {
    const carTitle = pfCarTitle(st.car);
    const label = st.type?.name || st.query;
    const linkText = [st.type?.name || st.query, st.car.make, st.car.model, st.car.year].filter(Boolean).join(' ');
    const links = pfLinks(linkText, st.article);
    const linksHtml = `<section class="card pf-links-card"><div class="card-head"><h2>Проверить цену на сайтах</h2><span class="muted small">откроется в новой вкладке</span></div>
      <div class="pf-links">${links.map(([n, u]) => `<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a>`).join('')}</div>
      <p class="hint" style="margin-bottom:0">Ищем «${esc(linkText)}»${st.article ? ` и артикул ${esc(st.article)}` : ''}.</p></section>`;
    const relatedHtml = st.related.length ? `<div class="pf-related"><span class="muted small">Возможно, вы ищете:</span>${st.related.map((t) => `<button type="button" class="chip" data-type="${t.id}">${esc(t.name)}</button>`).join('')}</div>` : '';
    const stockHtml = st.stock.length ? `<section class="card pf-stock"><div class="card-head"><h2>У вас на складе</h2><span class="badge green">можно ставить сегодня</span></div>
      ${st.stock.map((p, i) => `<div class="pf-offer"><div class="pf-sup"><div class="t">${esc(p.name)}</div><div class="s">${esc([p.brand, p.sku].filter(Boolean).join(' · '))}${p.location ? ` · место ${esc(p.location)}` : ''}</div></div>
        <div class="pf-meta"><span class="pf-days today">сегодня</span><span class="muted small">${fmtNum(p.qty)} ${esc(p.unit)}</span></div>
        <div class="pf-price"><div class="v">${money(p.price)}</div><div class="s">закупка ${money(p.buy_price)}</div></div>
        <button type="button" class="btn sm primary" data-stock="${i}">${inOrder ? 'В заказ' : 'Добавить'}</button></div>`).join('')}</section>` : '';

    if (!st.type && !st.article && !st.stock.length) {
      res.innerHTML = `<div class="card pf-empty"><h2>Не поняли, какая деталь нужна</h2>
        <p class="muted">Попробуйте написать по-другому или выберите из популярных выше. Можно ввести артикул детали.</p>${relatedHtml}</div>${linksHtml}`;
      return;
    }
    if (!st.parts.length) {
      res.innerHTML = `${relatedHtml}${stockHtml}
        <section class="card pf-connect"><h2>Цены поставщиков</h2>
          <p class="muted">Здесь будут предложения ваших поставщиков по «${esc(label)}»${carTitle ? ` для ${esc(carTitle)}` : ''}: цены, сроки и наличие, отсортированные от дешёвых к дорогим.
          Для этого подключаются API поставщиков, с которыми вы работаете (Армтек, Росско, Автопитер, магазины на платформе ABCP и другие).</p></section>${linksHtml}`;
      return;
    }

    const parts = st.parts
      .filter((p) => PF_STATE.kind === 'all' || (PF_STATE.kind === 'original' ? p.kind === 'original' : p.kind !== 'original'))
      .map((p) => {
        const offers = p.offers.filter((o) => !PF_STATE.fast || o.days <= 2)
          .sort((a, b) => (PF_STATE.sort === 'price' ? a.price - b.price || a.days - b.days : a.days - b.days || a.price - b.price));
        return { ...p, offers, min: offers.length ? Math.min(...offers.map((o) => o.price)) : Infinity, minDays: offers.length ? Math.min(...offers.map((o) => o.days)) : Infinity };
      })
      .filter((p) => p.offers.length)
      .sort((a, b) => (PF_STATE.sort === 'price' ? a.min - b.min : a.minDays - b.minDays || a.min - b.min));
    const all = parts.flatMap((p) => p.offers.map((o) => ({ p, o })));
    const cheapest = all.reduce((m, x) => (!m || x.o.price < m.o.price ? x : m), null);
    const fastest = all.reduce((m, x) => (!m || x.o.days < m.o.days || (x.o.days === m.o.days && x.o.price < m.o.price) ? x : m), null);
    const original = st.parts.find((p) => p.kind === 'original');
    const origMin = original ? Math.min(...original.offers.map((o) => o.price)) : null;
    const kindBadge = (k) => (k === 'original' ? '<span class="badge blue">Оригинал</span>' : k === 'restored' ? '<span class="badge orange">Восстановленная</span>' : '<span class="badge">Аналог</span>');
    const keyOf = (p, o) => `${p.article}|${o.supplier}`;
    const bestCard = (title, cls, x) => (x ? `<div class="pf-best ${cls}"><div class="lbl">${title}</div>
      <div class="val">${money(x.o.price)}</div><div class="small">${esc(x.p.brand)} · ${esc(x.o.supplier)} · ${pfDays(x.o.days)}</div>
      <button type="button" class="btn sm" data-offer="${esc(keyOf(x.p, x.o))}">${inOrder ? 'В заказ' : 'Добавить'}</button></div>` : '');

    res.innerHTML = `
      <section class="card pf-summary">
        <div class="pf-head"><div class="pf-group muted small">${esc(st.type.group)}</div><h2 class="pf-title">${esc(st.type.name)}</h2>
          <div class="muted">${esc(carTitle || 'Автомобиль не указан — цены для средней иномарки')}</div>
          <div class="muted small" style="margin-top:6px">${st.parts.length} ${pfPlural(st.parts.length, 'вариант', 'варианта', 'вариантов')} детали · ${st.parts.reduce((s, p) => s + p.offers.length, 0)} ${pfPlural(st.parts.reduce((s, p) => s + p.offers.length, 0), 'предложение', 'предложения', 'предложений')}${origMin && cheapest ? ` · аналог дешевле оригинала до ${Math.round((1 - cheapest.o.price / origMin) * 100)}%` : ''}</div></div>
        ${bestCard('Дешевле всего', 'cheap', cheapest)}
        ${bestCard('Быстрее всего', 'fast', fastest)}
      </section>
      ${relatedHtml}
      ${stockHtml}
      <div class="pf-toolbar">
        <div class="pf-seg" role="group" aria-label="Сортировка">
          <button type="button" class="${PF_STATE.sort === 'price' ? 'active' : ''}" data-sort="price">Дешевле</button>
          <button type="button" class="${PF_STATE.sort === 'days' ? 'active' : ''}" data-sort="days">Быстрее</button></div>
        <div class="pf-seg" role="group" aria-label="Тип детали">
          <button type="button" class="${PF_STATE.kind === 'all' ? 'active' : ''}" data-kind="all">Все</button>
          <button type="button" class="${PF_STATE.kind === 'original' ? 'active' : ''}" data-kind="original">Оригинал</button>
          <button type="button" class="${PF_STATE.kind === 'analog' ? 'active' : ''}" data-kind="analog">Аналоги</button></div>
        <label class="check"><input type="checkbox" data-fast ${PF_STATE.fast ? 'checked' : ''}> Привезут за 1–2 дня</label>
        <span class="muted small pf-markup">Цена клиенту — с наценкой ${fmtNum(pfMarkup())}%</span>
      </div>
      ${parts.length ? parts.map((p) => `<section class="card pf-part">
        <div class="pf-part-head">
          <div><div class="pf-part-title">${kindBadge(p.kind)} <span>${esc(p.brand)}</span> <span class="pf-article">${esc(p.article)}</span></div>
            <div class="muted small">${esc(p.name)} · подходит: ${esc(p.fit)}</div></div>
          <div class="pf-from"><div class="muted small">от</div><div class="v">${money(p.min)}</div></div>
        </div>
        ${p.offers.map((o) => `<div class="pf-offer ${cheapest && o === cheapest.o ? 'cheapest' : ''}">
          <div class="pf-sup"><div class="t">${esc(o.supplier)} <span class="pf-rating">★ ${o.rating.toFixed(1)}</span></div><div class="s">${esc(o.note)}</div></div>
          <div class="pf-meta"><span class="pf-days ${o.days <= 1 ? 'today' : ''}">${pfDays(o.days)}</span><span class="muted small">в наличии ${o.qty} шт</span></div>
          <div class="pf-price"><div class="v">${money(o.price)}</div><div class="s">клиенту ${money(pfRetail(o.price))}</div></div>
          <button type="button" class="btn sm ${cheapest && o === cheapest.o ? 'primary' : ''}" data-offer="${esc(keyOf(p, o))}">${inOrder ? 'В заказ' : 'Добавить'}</button>
        </div>`).join('')}
      </section>`).join('') : '<div class="card empty">Нет предложений с такими фильтрами</div>'}
      ${linksHtml}
      <p class="hint pf-demo-note">${icon('tag')} Демо-версия: артикулы, цены, сроки и поставщики примерные. В рабочей версии здесь будут цены поставщиков, с которыми работает сервис.</p>`;
    st.offerIndex = new Map(all.map((x) => [keyOf(x.p, x.o), x]));
  }

  on(host, 'click', '[data-sort]', (e, el) => { PF_STATE.sort = el.dataset.sort; draw(); });
  on(host, 'click', '[data-kind]', (e, el) => { PF_STATE.kind = el.dataset.kind; draw(); });
  on(host, 'change', '[data-fast]', (e, el) => { PF_STATE.fast = el.checked; draw(); });
  on(host, 'click', '[data-offer]', (e, el) => {
    const x = st.offerIndex.get(el.dataset.offer);
    if (!x) return;
    pfAddDialog({
      title: `${st.type.name} ${x.p.brand}${x.p.kind === 'restored' ? ' (восстановленная)' : ''}`,
      sku: x.p.article, buy: x.o.price, retail: pfRetail(x.o.price), partId: null,
      source: `${x.o.supplier} · ${pfDays(x.o.days)}`, type: st.type, st, onAdd, orderId,
    });
  });
  on(host, 'click', '[data-stock]', (e, el) => {
    const p = st.stock[+el.dataset.stock];
    pfAddDialog({
      title: p.name, sku: p.sku, buy: p.buy_price, retail: p.price, partId: p.id, unit: p.unit,
      source: 'Свой склад · сегодня', type: st.type, st, onAdd, orderId,
    });
  });

  if (st.query) search();
  else {
    // Курсор — в поле «Что нужно заменить?», если пользователь ещё никуда не ввёл текст
    // (в окне заказ-наряда фокус сначала встаёт на марку — переносим его).
    setTimeout(() => {
      const a = document.activeElement;
      if (!a || a === document.body || (onAdd && a.dataset.car === 'make')) input.focus();
    }, 60);
  }
}

/** Окно «Добавить в заказ-наряд»: количество, цена клиенту, работа по замене из прайса. */
async function pfAddDialog({ title, sku, buy, retail, partId, unit, source, type, st, onAdd, orderId }) {
  const services = type?.work ? await api('/services', { query: { q: type.work, limit: 3 } }).catch(() => []) : [];
  const service = services.find((s) => pfNorm(s.name).startsWith('замен')) || services[0] || null;
  let orders = [];
  if (!onAdd) {
    const r = await api('/orders', { query: { status: 'active' } });
    orders = r.items;
    if (st.carId) orders.sort((a, b) => (b.car_id === st.carId) - (a.car_id === st.carId));
  }
  const orderOpts = [
    ...orders.map((o) => [o.id, `№${o.id} · ${carLine(o) || '—'} · ${o.client_name}`]),
    ...(st.clientId ? [['new', `+ Новый заказ-наряд для ${st.client?.name || 'клиента'}`]] : []),
  ];
  if (!onAdd && !orderOpts.length) {
    toast('Нет открытых заказ-нарядов. Выберите машину клиента, чтобы создать новый.', 'error');
    return;
  }
  const preferred = orders.find((o) => o.car_id && o.car_id === st.carId)?.id ?? (st.clientId ? 'new' : orderOpts[0][0]);
  openModal({
    title: onAdd ? 'Добавить в заказ-наряд' : 'Добавить в заказ-наряд',
    submit: 'Добавить',
    body: `<div class="pf-add-head"><div class="t">${esc(title)}</div><div class="muted small">${esc(sku || '')}${sku ? ' · ' : ''}${esc(source)} · закупка ${money(buy)}</div></div>
      <div class="form-grid">
        ${onAdd ? '' : fSelect('Заказ-наряд', 'order', orderOpts, preferred, { cls: 'wide' })}
        ${fNum('Количество', 'qty', 1)}
        ${fNum('Цена клиенту, ₽', 'price', retail)}
        ${service ? `<div class="wide">${fCheck(`Добавить работу «${service.name}» — ${money(service.price)}`, 'with_work', true)}</div>` : ''}
      </div>`,
    onSubmit: async (d) => {
      const part = { part_id: partId, name: title, sku: sku || '', qty: toNum(d.qty) || 1, price: toNum(d.price), buy_price: buy, unit: unit || 'шт', avail: null };
      const work = d.with_work && service ? { service_id: service.id, name: service.name, qty: 1, price: service.price, employee_id: '' } : null;
      if (onAdd) {
        onAdd({ part, work });
        return;
      }
      let target = d.order;
      if (target === 'new') {
        const r = await api('/orders', { method: 'POST', body: { client_id: st.clientId, car_id: st.carId || undefined, complaint: `Замена: ${type?.name || title}` } });
        target = r.id;
      }
      const o = await api(`/orders/${target}`);
      await api(`/orders/${target}`, { method: 'PUT', body: {
        works: [...o.works.map((w) => ({ service_id: w.service_id, name: w.name, qty: w.qty, price: w.price, employee_id: w.employee_id })), ...(work ? [work] : [])],
        parts: [...o.parts.map((p) => ({ part_id: p.part_id, name: p.name, sku: p.sku, qty: p.qty, price: p.price, buy_price: p.buy_price })), part],
      } });
      toast(`Добавлено в заказ-наряд №${target}`);
      go(`#/orders/${target}`);
    },
  });
}

<script>
'use strict';

/* ======================= утилиты ======================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const NF = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const fmtNum = (n) => NF.format(+n || 0);
const money = (n) => NF.format(Math.round((+n || 0) * 100) / 100) + ' ₽';
const toNum = (v) => { const n = parseFloat(String(v ?? '').replace(/[\s ]/g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const round2 = (n) => Math.round(n * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const fmtDate = (s) => (s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : '');
const fmtDT = (s) => (s ? `${fmtDate(s)} ${s.slice(11, 16)}` : '');
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

const toMin = (hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fromMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const carName = (c) => [c?.make, c?.model].filter(Boolean).join(' ');
const carLine = (c) => [carName(c), c?.plate].filter(Boolean).join(' · ');
const phoneLink = (p) => (p ? `<a href="tel:${esc(String(p).replace(/[^\d+]/g, ''))}">${esc(p)}</a>` : '');
const greeting = () => { const h = new Date().getHours(); return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; };

const ORDER_STATUS = {

};

const ICONS = {

  clipboard: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/>',

  right: '<polyline points="9 18 15 12 9 6"/>',
  tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',

const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ======================= состояние и API ======================= */
let ME = null;
let COMPANY = '';
let SETTINGS = {};
let CACHE = {};
let LEAVE_GUARD = null;
let SAVE_HANDLER = null;
let CUR_HASH = null;
const isAdmin = () => ME?.role === 'admin';

async function api(path, { method = 'GET', body, query } = {}) {
  let url = '/api' + path;
  if (query) {
    const p = new URLSearchParams();
    for (const [k, v] of Object.entries(query)) if (v !== undefined && v !== null && v !== '' && v !== false) p.set(k, v);
    const s = p.toString();
    if (s) url += '?' + s;
  }
  const opts = { method, headers: { 'X-CRM': '1' } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try { res = await fetch(url, opts); } catch { throw new Error('Нет связи с сервером'); }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error(data?.error || `Ошибка ${res.status}`);
    err.status = res.status;
    err.data = data || {};
    if (res.status === 401 && !path.startsWith('/auth/')) { err.silent = true; ME = null; showLogin(); }
    throw err;
  }
  return data;
}

function cached(key, path) {
  if (!CACHE[key]) CACHE[key] = api(path).catch((e) => { delete CACHE[key]; throw e; });
  return CACHE[key];
}
const getEmployees = () => cached('employees', '/employees');
const getPosts = () => cached('posts', '/posts');

// В демо-версии внутри claude.ai адрес страницы менять нельзя, поэтому маршрут хранится в памяти.
const DEMO = window.CRM_DEMO || null;
const MEMORY_NAV = !!DEMO?.memoryRouter;
let MEM_HASH = '#/';
const getHash = () => (MEMORY_NAV ? MEM_HASH : location.hash);
function replaceHash(hash) {
  if (MEMORY_NAV) MEM_HASH = hash;
  else history.replaceState(null, '', hash);
  CUR_HASH = getHash();
}
function go(hash) {
  if (getHash() === hash) router();
  else if (MEMORY_NAV) { MEM_HASH = hash; router(); }
  else location.hash = hash;
}

/* ======================= интерфейс: общие элементы ======================= */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('hide'), type === 'error' ? 4500 : 2500);
  setTimeout(() => el.remove(), type === 'error' ? 5000 : 3000);
}

window.addEventListener('unhandledrejection', (e) => {
  const err = e.reason;
  if (err?.silent) return;
  toast(err?.message || 'Ошибка', 'error');
});

function on(root, type, selector, handler) {
  root.addEventListener(type, (e) => {
    const el = e.target.closest(selector);
    if (el && root.contains(el)) handler(e, el);
  });
}

const opts = (options, value) => options.map(([v, t]) => `<option value="${esc(v)}" ${String(v ?? '') === String(value ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('');
const fInput = (label, name, value = '', o = {}) => `<label class="field ${o.cls || ''}"><span>${esc(label)}${o.req ? ' *' : ''}</span><input name="${name}" type="${o.type || 'text'}" value="${esc(value ?? '')}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.req ? 'required' : ''} ${o.attrs || ''}></label>`;
const fNum = (label, name, value = '', o = {}) => fInput(label, name, value ?? '', { ...o, attrs: `inputmode="decimal" ${o.attrs || ''}` });
const fText = (label, name, value = '', o = {}) => `<label class="field ${o.cls ?? 'wide'}"><span>${esc(label)}</span><textarea name="${name}" rows="${o.rows || 3}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}>${esc(value ?? '')}</textarea></label>`;
const fSelect = (label, name, options, value, o = {}) => `<label class="field ${o.cls || ''}"><span>${esc(label)}</span><select name="${name}">${opts(options, value)}</select></label>`;
const fCheck = (label, name, checked) => `<label class="check"><input type="checkbox" name="${name}" ${checked ? 'checked' : ''}> ${esc(label)}</label>`;

function formToObj(form) {
  const out = {};
  for (const el of form.elements) {
    if (!el.name || el.disabled) continue;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'radio') { if (!el.checked) continue; v = el.value; } else v = el.value.trim();
    const path = el.name.split('.');
    let o = out;
    while (path.length > 1) { const k = path.shift(); o = o[k] = o[k] || {}; }
    o[path[0]] = v;
  }
  return out;
}

/** Окно подтверждения вместо confirm(): возвращает Promise<boolean>. */
function askConfirm(message, { ok = 'Да', title = 'Подтвердите действие' } = {}) {
  return new Promise((resolve) => {
    let answered = false;
    openModal({
      title,
      body: `<p style="margin:0;white-space:pre-line">${esc(message)}</p>`,
      submit: ok,
      onSubmit: () => { answered = true; resolve(true); },
      onClose: () => { if (!answered) resolve(false); },
    });
  });
}

function openModal({ title, body = '', submit = 'Сохранить', onSubmit, onClose, buttons = [], wide = false, size = '', cancel = 'Отмена' }) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<form class="modal ${size || (wide ? 'wide' : '')}" novalidate autocomplete="off">
    <div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close title="Закрыть">${icon('x')}</button></div>
    <div class="modal-body">${body}<div class="form-error" hidden></div></div>
    <div class="modal-foot"></div></form>`;
  const form = $('form', ov);
  const foot = $('.modal-foot', ov);
  const errBox = $('.form-error', ov);
  const m = {
    el: ov, form, body: $('.modal-body', ov), close,
    error(msg) { errBox.textContent = msg || ''; errBox.hidden = !msg; },
  };
  async function run(fn) {
    m.error('');
    const btns = $$('button', foot);
    btns.forEach((b) => { b.disabled = true; });
    try {
      const r = await fn();
      if (r !== false) close();
    } catch (e) {
      if (!e.silent) m.error(e.message);
    } finally {
      btns.forEach((b) => { b.disabled = false; });
    }
  }
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `btn ${b.cls || ''}`;
    btn.innerHTML = b.label;
    btn.onclick = () => run(() => b.onClick(m));
    foot.append(btn);
  }
  if (buttons.length) foot.insertAdjacentHTML('beforeend', '<span class="spacer"></span>');
  if (cancel) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = cancel;
    btn.onclick = close;
    foot.append(btn);
  }
  if (onSubmit) foot.insertAdjacentHTML('beforeend', `<button type="submit" class="btn primary">${esc(submit)}</button>`);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!onSubmit) return;
    const missing = $$('[required]', form).find((el) => !el.disabled && !el.value.trim());
    if (missing) { m.error('Заполните обязательные поля'); missing.focus(); return; }
    run(() => onSubmit(formToObj(form), m));
  });
  function onKey(e) {
    if (e.key === 'Escape' && $$('.modal-overlay').pop() === ov) close();
  }
  function close() {
    if (!ov.isConnected) return;
    ov.remove();
    document.removeEventListener('keydown', onKey);
    onClose?.();
  }
  document.addEventListener('keydown', onKey);
  $('[data-close]', ov).onclick = close;
  document.body.append(ov);
  setTimeout(() => ($('input:not([type=hidden]):not([disabled]), select, textarea', m.body) || $('button[type=submit]', foot))?.focus(), 30);
  return m;
}

/** Выпадающие подсказки под полем ввода. source(q) -> Promise<items>. */
function autocomplete(input, { source, render, onPick, footer, minLen = 1, blockEnter = false }) {
  const wrap = input.parentElement;
  if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';
  const box = document.createElement('div');
  box.className = 'ac-box';
  box.hidden = true;
  wrap.append(box);
  let all = [];
  let idx = -1;
  let seq = 0;
  const hide = () => { box.hidden = true; box.innerHTML = ''; all = []; idx = -1; };
  const highlight = () => {
    $$('.ac-item', box).forEach((el, i) => el.classList.toggle('active', i === idx));
    $('.ac-item.active', box)?.scrollIntoView({ block: 'nearest' });
  };
  const draw = (items, q) => {
    all = [...items];
    const f = footer?.(q);
    if (f) all.push({ __footer: true, label: f });
    idx = all.length ? 0 : -1;
    box.innerHTML = all.length
      ? all.map((it, i) => `<div class="ac-item ${it.__footer ? 'footer' : ''} ${i === idx ? 'active' : ''}" data-i="${i}">${it.__footer ? esc(it.label) : render(it)}</div>`).join('')
      : '<div class="ac-empty">Ничего не найдено</div>';
    box.hidden = false;
  };
  const load = debounce(async () => {
    const q = input.value.trim();
    if (q.length < minLen) { hide(); return; }
    const my = ++seq;
    let items;
    try { items = await source(q); } catch { return; }
    if (my !== seq || document.activeElement !== input) return;
    draw(items, q);
  }, 180);
  const pick = (i) => {
    const it = all[i];
    if (!it) return;
    const q = input.value.trim();
    hide();
    onPick(it.__footer ? null : it, q);
  };
  input.addEventListener('input', load);
  input.addEventListener('keydown', (e) => {
    if (box.hidden) {
      if (e.key === 'Enter' && blockEnter) e.preventDefault();
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, all.length - 1); highlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); highlight(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (idx >= 0) pick(idx); }
    else if (e.key === 'Escape') { e.stopPropagation(); hide(); }
  });
  box.addEventListener('mousedown', (e) => {
    const el = e.target.closest('.ac-item');
    if (el) { e.preventDefault(); pick(+el.dataset.i); }
  });
  input.addEventListener('blur', () => setTimeout(hide, 150));
  return { hide };
}

function showAuth(html) {
  $('#app').hidden = true;
  $('#print-root').hidden = true;
  document.body.classList.remove('printing');
  $$('.modal-overlay').forEach((m) => m.remove());
  const a = $('#auth');
  a.hidden = false;
  a.innerHTML = `<div class="card auth-card"><div class="brand"><span class="brand-logo">${icon('tool')}</span>${esc(COMPANY || 'МК Сервис')}</div>${html}</div>`;
  return a;
}

function authForm(a, path, check) {
  const form = $('form', a);
  const err = $('.form-error', form);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const d = formToObj(form);
    try {
      const problem = check?.(d);
      if (problem) throw new Error(problem);
      await api(path, { method: 'POST', body: d });
      boot();
    } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  };
  $('input', form).focus();
}

    <div class="form-error" hidden></div><button class="btn primary">Войти</button></form>

  ME = me.user;
  CACHE = {};
  SETTINGS = await api('/settings');
  $('#auth').hidden = true;
  $('#app').hidden = false;
  applyCompany();
  $('#user-name').textContent = ME.name;
  $('#user-role').textContent = isAdmin() ? 'Администратор' : 'Сотрудник';

    const bar = document.createElement('div');
    bar.className = 'demo-bar';

    $('button', bar).onclick = async () => {
      if (!await askConfirm('Вернуть демо-данные к исходному виду? Всё, что вы добавили, удалится.', { ok: 'Сбросить' })) return;
      DEMO.reset();
      LEAVE_GUARD = null;
      MEM_HASH = '#/';

    $('#main').before(bar);

}

/* ======================= маршрутизация ======================= */
const ROUTES = [
  [/^\/$/, viewDashboard],
  [/^\/orders$/, viewOrders],
  [/^\/orders\/(\d+)$/, viewOrder],
  [/^\/calendar$/, viewCalendar],
  [/^\/clients$/, viewClients],
  [/^\/clients\/(\d+)$/, viewClient],
  [/^\/parts$/, viewPartsFinder],
  [/^\/stock$/, viewStock],
  [/^\/services$/, viewServices],
  [/^\/reports$/, viewReports],
  [/^\/settings$/, viewSettings],
  [/^\/print\/order\/(\d+)$/, viewPrint],
];

async function router() {
  if (!ME) return;
  if (LEAVE_GUARD && getHash() !== CUR_HASH && LEAVE_GUARD()) {
    if (!await askConfirm('Есть несохранённые изменения. Уйти без сохранения?')) {
      replaceHash(CUR_HASH || '#/');
      return;
    }
  }
  LEAVE_GUARD = null;
  SAVE_HANDLER = null;
  CUR_HASH = getHash();
  const raw = getHash().slice(1) || '/';
  const [path, qs] = raw.split('?');
  const params = new URLSearchParams(qs || '');
  document.body.classList.remove('menu-open');
  const printing = path.startsWith('/print/');
  document.body.classList.toggle('printing', printing);
  $('#print-root').hidden = !printing;
  if (!printing) $('#print-root').replaceChildren();
  const host = printing ? $('#print-root') : $('#main');
  const view = document.createElement('div');
  host.replaceChildren(view);
  view.innerHTML = '<div class="loading">Загрузка…</div>';
  window.scrollTo(0, 0);
  $$('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.nav === '/' ? path === '/' : path.startsWith(a.dataset.nav)));
  for (const [rx, fn] of ROUTES) {
    const m = path.match(rx);
    if (!m) continue;
    try {
      await fn(view, params, ...m.slice(1).map(Number));
    } catch (e) {
      if (!e.silent) view.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
    return;
  }
  view.innerHTML = '<div class="empty">Страница не найдена</div>';
}

/** Поле выбора клиента: поиск существующего или ввод нового, плюс выбор автомобиля. */
function clientPicker(host, { clientId = null, carId = null } = {}) {
  const st = { mode: 'search', client: null, cars: [], carId: carId ? String(carId) : null, newName: '', newPhone: '' };

  function select(c, preferCar) {
    st.mode = 'picked';
    st.client = c;
    st.cars = c.cars || [];
    st.carId = preferCar ? String(preferCar) : (st.cars.length ? String(st.cars[0].id) : 'new');
    draw();
  }
  function newClient(q) {
    st.mode = 'new';
    const digits = (q || '').replace(/\D/g, '');
    st.newPhone = digits.length >= 5 ? q : '';
    st.newName = digits.length >= 5 ? '' : q || '';
    draw();
    $(st.newName ? 'input[name="client.phone"]' : 'input[name="client.name"]', host)?.focus();
  }
  function draw() {
    if (st.mode === 'search') {
      host.innerHTML = `<div class="picker"><label class="field"><span>Клиент *</span>
        <input class="pk-search" placeholder="Начните вводить телефон, имя или госномер…" autocomplete="off"></label>
        <div class="hint" style="margin-top:6px">Новый клиент? <button type="button" class="link-btn" data-new>Заполнить данные</button></div></div>`;
      const inp = $('.pk-search', host);
      autocomplete(inp, {
        source: async (q) => (await api('/search', { query: { q } })).clients,
        render: clientItem,
        onPick: (c, q) => (c ? select(c) : newClient(q)),
        footer: (q) => `+ Новый клиент «${q}»`,
        minLen: 2,
        blockEnter: true,
      });
      $('[data-new]', host).onclick = () => newClient(inp.value.trim());
      setTimeout(() => inp.focus(), 40);
    } else if (st.mode === 'new') {
      host.innerHTML = `<div class="picker"><div class="section-label" style="margin-top:0">Новый клиент</div>
        <div class="form-grid">${fInput('Имя или организация', 'client.name', st.newName, { req: true })}
        ${fInput('Телефон', 'client.phone', st.newPhone, { type: 'tel', ph: '+7 900 000-00-00' })}</div>
        <div class="section-label">Автомобиль</div>${carFields()}
        <div class="hint" style="margin-top:8px"><button type="button" class="link-btn" data-back>← Найти существующего клиента</button></div></div>`;
      $('[data-back]', host).onclick = () => { st.mode = 'search'; draw(); };
    } else {
      const c = st.client;
      const carOpts = [...st.cars.map((x) => [x.id, carLine(x) || `Автомобиль #${x.id}`]), ['new', '+ Добавить автомобиль'], ['', '— Без автомобиля —']];
      host.innerHTML = `<div class="picker">
        <div class="picked"><div><div class="t">${esc(c.name)}</div><div class="muted small">${esc(c.phone || 'телефон не указан')}</div></div>
        <button type="button" class="btn sm" data-change>Сменить</button></div>
        <input type="hidden" name="client_id" value="${c.id}">
        ${fSelect('Автомобиль', 'car_id', carOpts, st.carId)}
        <div class="pk-newcar" style="margin-top:12px">${carFields()}</div></div>`;
      const sel = $('select[name=car_id]', host);
      const sync = () => {
        st.carId = sel.value;
        const box = $('.pk-newcar', host);
        box.hidden = st.carId !== 'new';
        $$('input', box).forEach((i) => { i.disabled = box.hidden; });
      };
      sel.onchange = sync;
      sync();
      $('[data-change]', host).onclick = () => { st.mode = 'search'; draw(); };
    }
  }
  const ready = (async () => {
    if (clientId) {
      const c = await api(`/clients/${clientId}`);
      select(c, carId);
    } else draw();
  })();
  return { ready };
}

/** Приводит данные из clientPicker к формату API. */
function normPick(d) {
  // car_id нет — это новый клиент, машина приходит полями car.*; 'new' — новая машина у существующего.
  if (d.car_id === 'new' || d.car_id === undefined) {
    delete d.car_id;
    return d;
  }
  delete d.car;
  if (d.car_id === '') delete d.car_id;
  return d;
}

function nextSlot() {
  const now = new Date();
  let m = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 30) * 30;
  const start = toMin(SETTINGS.work_start || '09:00');
  const end = toMin(SETTINGS.work_end || '20:00');
  if (m < start || m >= end) m = start;
  return fromMin(m);
}

      ? { label: `Открыть заказ-наряд №${a.order_id}`, onClick: () => go(`#/orders/${a.order_id}`) }
      : { label: 'Клиент приехал → заказ-наряд', cls: 'primary', onClick: async () => { const r = await api(`/appointments/${a.id}/order`, { method: 'POST' }); toast('Заказ-наряд создан'); go(`#/orders/${r.id}`); } });
    buttons.push({ label: icon('trash'), cls: 'danger', onClick: async () => {
      if (!await askConfirm('Удалить запись?')) return false;
      await api(`/appointments/${a.id}`, { method: 'DELETE' });
      toast('Запись удалена');
      done();
    } });
  }
  const m = openModal({
    title: appt ? 'Запись на сервис' : 'Новая запись',
    wide: true,
    buttons,
    body: `<div class="pk"></div><div class="form-grid">
      ${fInput('Дата', 'date', start.slice(0, 10), { type: 'date', req: true })}
      ${fInput('Время', 'time', start.slice(11, 16), { type: 'time', req: true, attrs: 'step="900"' })}
      ${fSelect('Длительность', 'duration', durations, a.duration || 60)}
      ${fSelect('Пост', 'post_id', [['', '— без поста —'], ...posts.map((p) => [p.id, p.name])], a.post_id ?? postId ?? posts[0]?.id ?? '')}
      ${appt ? fSelect('Статус', 'status', Object.entries(APPT_STATUS), a.status) : ''}
      ${fText('Что нужно сделать', 'description', a.description, { rows: 2, ph: 'ТО, замена колодок, диагностика…' })}</div>`,
    onSubmit: async (d) => {
      const body = normPick({ ...d, start: `${d.date} ${d.time}` });
      delete body.date;
      delete body.time;
      const send = (force) => api(appt ? `/appointments/${a.id}` : '/appointments', { method: appt ? 'PUT' : 'POST', body: { ...body, force } });
      try {
        await send(false);
      } catch (e) {
        if (e.data?.code === 'overlap' && await askConfirm(`${e.message}.\n\nВсё равно записать на это время?`)) await send(true);
        else throw e;
      }
      toast('Запись сохранена');
      done();
    },
  });
  await clientPicker($('.pk', m.body), { clientId: a.client_id || clientId, carId: a.car_id || carId }).ready;
}

function clientDialog(c = null) {
  openModal({
    title: c ? 'Данные клиента' : 'Новый клиент',
    wide: !c,
    body: `<div class="form-grid">${fInput('Имя или организация', 'name', c?.name, { req: true })}
      ${fInput('Телефон', 'phone', c?.phone, { type: 'tel', ph: '+7 900 000-00-00' })}
      ${fInput('E-mail', 'email', c?.email, { type: 'email' })}
      ${fText('Заметки', 'notes', c?.notes, { rows: 2, ph: 'Предпочтения, скидки, как связаться' })}</div>
      ${c ? '' : `<div class="section-label">Автомобиль (можно добавить позже)</div>${carFields()}`}`,
    onSubmit: async (d) => {
      try {
        if (c) {
          await api(`/clients/${c.id}`, { method: 'PUT', body: d });
          toast('Сохранено');
          router();
        } else {
          const r = await api('/clients', { method: 'POST', body: d });
          toast('Клиент добавлен');
          go(`#/clients/${r.id}`);
        }
      } catch (e) {
        if (e.status === 409 && e.data.client_id && await askConfirm(`${e.message}.\n\nОткрыть карточку этого клиента?`)) {
          go(`#/clients/${e.data.client_id}`);
          return;
        }
        throw e;
      }
    },
  });
}

function carDialog(car, clientId, onSaved) {

    if (!await askConfirm('Удалить автомобиль?')) return false;

/** Подпись об оплате в списке: долг бывает только у выданной машины. */
function payState(o) {
  if (o.status === 'cancelled' || o.total <= 0) return '';
  if (o.debt <= 0.009) return '<span class="badge green">оплачен</span>';
  if (o.status === 'done') return `<span class="neg">долг ${money(o.debt)}</span>`;
  return o.paid > 0 ? `<span class="muted small">оплачено ${money(o.paid)}</span>` : '';
}

  const TABS = [['active', 'Активные'], ['new', 'Новые'], ['in_progress', 'В работе'], ['waiting_parts', 'Ждут запчасти'], ['ready', 'Готовы'], ['done', 'Выданы'], ['debt', 'Долги'], ['cancelled', 'Отменены'], ['all', 'Все']];
  v.innerHTML = `
    <div class="page-head"><h1>Заказ-наряды</h1><div class="actions"><button class="btn primary" data-act="new">${icon('plus')} Новый заказ-наряд</button></div></div>
    <div class="tabs"></div>
    <div class="toolbar">
      <input type="search" class="f-q" placeholder="№ заказа, клиент, телефон, госномер" value="${esc(f.q)}">
      <input type="date" class="f-from" value="${esc(f.from)}" title="Создан с">

  async function load() {
    const qs = new URLSearchParams(Object.entries(f).filter(([, x]) => x)).toString();
    replaceHash(`#/orders${qs ? '?' + qs : ''}`);
    const r = await api('/orders', { query: { ...f, status: f.status === 'all' ? '' : f.status } });
    const total = Object.entries(r.counts).filter(([k]) => ORDER_STATUS[k]).reduce((s, [, n]) => s + n, 0);
    $('.tabs', v).innerHTML = TABS.map(([k, t]) => `<button class="tab ${f.status === k ? 'active' : ''}" data-tab="${k}">${t}<span class="cnt">${k === 'all' ? total : r.counts[k] || 0}</span></button>`).join('');
    $('.res', v).innerHTML = r.items.length ? `<table class="tbl stack st-orders"><thead><tr><th>№</th><th>Дата</th><th>Клиент</th><th>Автомобиль</th><th>Статус</th><th>Мастер</th><th class="right">Сумма</th><th class="right">Оплата</th></tr></thead><tbody>
      ${r.items.map((o) => `<tr class="click" data-href="#/orders/${o.id}">
        <td class="nowrap a-num"><b>№${o.id}</b><span class="m-only muted"> · ${fmtDate(o.created_at)}</span></td><td class="nowrap m-hide">${fmtDate(o.created_at)}</td>
        <td class="a-client"><div class="title">${esc(o.client_name)}</div><div class="muted small">${esc(o.client_phone)}</div></td>
        <td class="a-car">${esc(carName(o))}<div class="muted small">${esc(o.plate)}</div></td>
        <td class="a-status">${badge(o.status)}</td><td class="m-hide">${esc(o.master_name || '')}</td>
        <td class="num-cell a-total"><b>${money(o.total)}</b></td>
        <td class="num-cell a-pay">${payState(o)}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Ничего не найдено</div>';
  }
  on(v, 'click', '[data-tab]', (e, el) => { f.status = el.dataset.tab; load(); });
  on(v, 'click', 'tr[data-href]', (e, el) => go(el.dataset.href));
  $('[data-act=new]', v).onclick = () => newOrderDialog();
  $('.f-q', v).addEventListener('input', debounce((e) => { f.q = e.target.value.trim(); load(); }, 300));
  $('.f-from', v).onchange = (e) => { f.from = e.target.value; load(); };
  $('.f-to', v).onchange = (e) => { f.to = e.target.value; load(); };
  await load();
}

function renderOrder(v, o, emps) {
  const root = document.createElement('div');
  v.replaceChildren(root);
  const st = {
    status: o.status,
    mileage: o.mileage ?? '',
    complaint: o.complaint,
    recommendations: o.recommendations,
    master_id: o.master_id ?? '',
    discount: o.discount || 0,
    car_id: o.car_id ?? '',
    car_next_service_date: o.car?.next_service_date || '',
    car_next_service_km: o.car?.next_service_km ?? '',
    works: o.works.map((w) => ({ service_id: w.service_id, name: w.name, qty: w.qty, price: w.price, employee_id: w.employee_id ?? '' })),
    parts: o.parts.map((p) => ({
      part_id: p.part_id, name: p.name, sku: p.sku, qty: p.qty, price: p.price, buy_price: p.buy_price, unit: p.unit,
      avail: p.part_id != null && p.stock != null ? p.stock + (o.status !== 'cancelled' ? p.qty : 0) : null,
    })),
    payments: o.payments,
  };
  let dirty = false;
  LEAVE_GUARD = () => dirty;
  const empOpts = (sel) => [['', '—'], ...emps.filter((e) => e.active || String(e.id) === String(sel)).map((e) => [e.id, e.name])];
  const car = o.car;

  root.innerHTML = `
    <div class="page-head">
      <div><a href="#/orders" class="back">← Заказ-наряды</a>
        <h1>Заказ-наряд №${o.id} <span class="muted" style="font-weight:500;font-size:15px">от ${fmtDate(o.created_at)}</span></h1></div>
      <div class="actions">
        <span class="dirty-flag" hidden>● не сохранено</span>
        <select class="status-select" data-status>${opts(Object.entries(ORDER_STATUS).map(([k, [t]]) => [k, t]), o.status)}</select>
        <button class="btn" data-act="print" title="Печать">${icon('printer')}<span class="hide-sm">Печать</span></button>
        ${isAdmin() ? `<button class="btn danger" data-act="delete" title="Удалить">${icon('trash')}</button>` : ''}
        <button class="btn primary" data-act="save">${icon('save')} Сохранить</button>
      </div>
    </div>
    <div class="order-grid">
      <div class="order-main">
        <section class="card">
          <div class="info-line">
            <div><div class="lbl">Клиент</div><div class="val"><a href="#/clients/${o.client_id}">${esc(o.client?.name)}</a></div><div class="small">${phoneLink(o.client?.phone)}</div></div>
            <div><div class="lbl">Автомобиль</div><div class="val">${esc(carName(car) || '—')} ${car?.year ? `<span class="muted">${car.year}</span>` : ''}</div>
              <div class="small muted">${esc(car?.plate || '')}${car?.vin ? ' · VIN ' + esc(car.vin) : ''}</div></div>
            ${o.closed_at ? `<div><div class="lbl">Выдан</div><div class="val">${fmtDT(o.closed_at)}</div></div>` : ''}
          </div>
          <div class="form-grid">
            ${o.client_cars.length > 1 ? `<label class="field"><span>Автомобиль клиента</span><select data-o="car_id">${opts([['', '—'], ...o.client_cars.map((x) => [x.id, carLine(x)])], st.car_id)}</select></label>` : ''}
            <label class="field"><span>Пробег, км</span><input data-o="mileage" inputmode="numeric" value="${esc(st.mileage)}"></label>
            <label class="field"><span>Мастер-приёмщик</span><select data-o="master_id">${opts(empOpts(st.master_id), st.master_id)}</select></label>
            <label class="field wide"><span>Причина обращения / жалоба</span><textarea data-o="complaint" rows="2">${esc(st.complaint)}</textarea></label>
          </div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Работы</h2><span class="sum works-sum"></span></div>
          <table class="lines"><thead><tr><th>Наименование</th><th>Исполнитель</th><th>Кол-во</th><th>Цена</th><th class="right">Сумма</th><th></th></tr></thead>
          <tbody class="works-body" data-line="works"></tbody></table>
          <div class="add-line"><input class="add-work" placeholder="+ Добавить работу — начните вводить название из прайса" autocomplete="off"></div>

        <section class="card">
          <div class="card-head"><h2>Запчасти и материалы</h2><div class="head-actions"><button type="button" class="btn sm" data-act="find-part">${icon('tag')} Подобрать</button><span class="sum parts-sum"></span></div></div>
          <table class="lines"><thead><tr><th>Наименование</th><th>Артикул</th><th>Кол-во</th><th>Цена</th><th class="right">Сумма</th><th></th></tr></thead>
          <tbody class="parts-body" data-line="parts"></tbody></table>
          <div class="add-line"><input class="add-part" placeholder="+ Добавить запчасть — поиск по складу: название или артикул" autocomplete="off"></div>
        </section>
        <section class="card">
          <h2 style="margin-bottom:12px">Рекомендации клиенту</h2>
          <div class="form-grid">
            <label class="field wide"><span>Рекомендации (попадут в печатный заказ-наряд)</span><textarea data-o="recommendations" rows="2" placeholder="Например: через 3 000 км заменить задние колодки">${esc(st.recommendations)}</textarea></label>
            ${car ? `<label class="field"><span>Следующее ТО — дата</span><input type="date" data-o="car_next_service_date" value="${esc(st.car_next_service_date)}"></label>
            <label class="field"><span>Следующее ТО — пробег, км</span><input data-o="car_next_service_km" inputmode="numeric" value="${esc(st.car_next_service_km)}"></label>` : ''}
          </div>
          ${car ? '<div class="hint" style="margin-top:8px">За 2 недели до даты ТО клиент появится на главной в списке «Напомнить о ТО».</div>' : ''}
        </section>
      </div>
      <aside class="order-side">
        <section class="card totals"></section>
        <section class="card payments"></section>
      </aside>
    </div>`;

  const worksBody = $('.works-body', root);
  const partsBody = $('.parts-body', root);
  const lineSum = (x) => toNum(x.qty) * toNum(x.price);
  const calc = () => {
    const works = st.works.reduce((s, x) => s + lineSum(x), 0);
    const parts = st.parts.reduce((s, x) => s + lineSum(x), 0);
    const disc = Math.min(Math.max(toNum(st.discount), 0), 100);
    const total = round2((works + parts) * (1 - disc / 100));
    const paid = round2(st.payments.reduce((s, p) => s + p.amount, 0));
    return { works, parts, disc, total, discSum: round2(works + parts - total), paid, debt: round2(total - paid) };
  };
  const stockHint = (p) => {
    if (p.avail == null) return p.part_id ? '' : '<div class="stock-hint">не со склада</div>';
    const warn = toNum(p.qty) > p.avail;
    return `<div class="stock-hint ${warn ? 'warn' : ''}">${warn ? 'на складе только' : 'на складе:'} ${fmtNum(p.avail)} ${esc(p.unit || '')}</div>`;
  };
  const workRow = (w, i) => `<tr data-i="${i}">
      <td class="c-name"><input data-f="name" value="${esc(w.name)}"></td>
      <td class="c-emp"><select data-f="employee_id">${opts(empOpts(w.employee_id), w.employee_id)}</select></td>
      <td class="c-qty"><input class="num" data-f="qty" inputmode="decimal" value="${esc(w.qty)}"></td>
      <td class="c-price"><input class="num" data-f="price" inputmode="decimal" value="${esc(w.price)}"></td>
      <td class="c-sum">${money(lineSum(w))}</td>
      <td class="c-del"><button type="button" class="icon-btn danger" data-del title="Убрать">${icon('x')}</button></td></tr>`;
  const partRow = (p, i) => `<tr data-i="${i}">
      <td class="c-name"><input data-f="name" value="${esc(p.name)}">${stockHint(p)}</td>
      <td class="c-sku"><input data-f="sku" value="${esc(p.sku)}"></td>
      <td class="c-qty"><input class="num" data-f="qty" inputmode="decimal" value="${esc(p.qty)}"></td>
      <td class="c-price"><input class="num" data-f="price" inputmode="decimal" value="${esc(p.price)}"></td>
      <td class="c-sum">${money(lineSum(p))}</td>
      <td class="c-del"><button type="button" class="icon-btn danger" data-del title="Убрать">${icon('x')}</button></td></tr>`;
  const emptyRow = (t) => `<tr><td colspan="6" class="empty-sm">${t}</td></tr>`;

  function drawLines() {
    worksBody.innerHTML = st.works.map(workRow).join('') || emptyRow('Работы ещё не добавлены');
    partsBody.innerHTML = st.parts.map(partRow).join('') || emptyRow('Запчасти не добавлены');
    drawTotals();
  }
  function drawTotals() {
    const t = calc();
    $('.works-sum', root).textContent = money(t.works);
    $('.parts-sum', root).textContent = money(t.parts);
    $('.totals', root).innerHTML = `
      <div class="row"><span>Работы</span><span>${money(t.works)}</span></div>
      <div class="row"><span>Запчасти</span><span>${money(t.parts)}</span></div>
      <div class="row"><span class="disc">Скидка <input data-o="discount" inputmode="decimal" value="${esc(st.discount)}"> %</span><span>${t.discSum ? '−' + money(t.discSum) : '—'}</span></div>
      <div class="row big"><span>Итого</span><span>${money(t.total)}</span></div>
      <div class="row"><span>Оплачено</span><span>${money(t.paid)}</span></div>
      ${t.debt > 0.009 ? `<div class="row debt"><span>К оплате</span><span>${money(t.debt)}</span></div>`
        : t.total > 0 ? `<div class="row paid-full"><span>Оплачено полностью</span><span>✓</span></div>` : ''}
      ${t.debt < -0.009 ? `<div class="row"><span class="muted">Переплата</span><span>${money(-t.debt)}</span></div>` : ''}`;
    $('.payments', root).innerHTML = `<div class="card-head"><h2>Оплаты</h2></div>
      ${st.payments.length ? st.payments.map((p) => `<div class="pay-item"><div><div><b>${money(p.amount)}</b> · ${esc(PAY[p.method] || p.method)}</div>
        <div class="muted small">${fmtDT(p.created_at)}${p.user_name ? ' · ' + esc(p.user_name) : ''}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
        ${isAdmin() ? `<button type="button" class="icon-btn danger" data-delpay="${p.id}" title="Удалить оплату">${icon('x')}</button>` : ''}</div>`).join('') : '<div class="empty-sm">Оплат пока нет</div>'}
      <button type="button" class="btn primary" data-act="pay" style="width:100%;margin-top:10px">Принять оплату</button>`;
  }
  function markDirty() { dirty = true; $('.dirty-flag', root).hidden = false; }

  async function save() {
    const body = { ...st };
    delete body.payments;
    const fresh = await api(`/orders/${o.id}`, { method: 'PUT', body });
    dirty = false;
    toast('Сохранено');
    const y = window.scrollY;
    renderOrder(v, fresh, emps);
    window.scrollTo(0, y);
  }
  SAVE_HANDLER = save;

  on(root, 'input', 'tbody[data-line] [data-f]', (e, el) => {
    const tr = el.closest('tr');
    const item = st[tr.parentElement.dataset.line][+tr.dataset.i];
    item[el.dataset.f] = el.value;
    if (el.dataset.f === 'name') { item.service_id = null; }
    $('.c-sum', tr).textContent = money(lineSum(item));
    if (el.dataset.f === 'qty' && tr.parentElement.dataset.line === 'parts') {
      const hint = $('.stock-hint', tr);
      if (hint) hint.outerHTML = stockHint(item);
    }
    drawTotals();
    markDirty();
  });
  on(root, 'click', '[data-del]', (e, el) => {
    const tr = el.closest('tr');
    st[tr.parentElement.dataset.line].splice(+tr.dataset.i, 1);
    drawLines();
    markDirty();
  });
  on(root, 'input', '[data-o]', (e, el) => {
    st[el.dataset.o] = el.value;
    if (el.dataset.o === 'discount') {
      const t = calc();
      $('.totals .disc', root).nextElementSibling.textContent = t.discSum ? '−' + money(t.discSum) : '—';
      $('.totals .row.big span:last-child', root).textContent = money(t.total);
    }
    markDirty();
  });
  on(root, 'change', '[data-o="discount"]', () => drawTotals());

  $('[data-status]', root).onchange = async (e) => {
    const next = e.target.value;
    if (next === 'done' && calc().debt > 0.009 && !await askConfirm(`Остаток к оплате ${money(calc().debt)}. Всё равно отметить как «Выдан»?`)) {
      e.target.value = st.status;
      return;
    }
    if (next === 'cancelled' && !await askConfirm('Отменить заказ-наряд? Запчасти вернутся на склад.')) { e.target.value = st.status; return; }
    st.status = next;
    await save();
  };
  $('[data-act=save]', root).onclick = () => save();
  $('[data-act=find-part]', root).onclick = () => {
    const m = openModal({ title: 'Подбор запчастей', size: 'xl', cancel: 'Закрыть', body: '<div class="pf-host"></div>' });
    partsFinder($('.pf-host', m.body), {
      car: o.car, clientId: o.client_id, carId: o.car_id, orderId: o.id,
      onAdd: ({ part, work }) => {
        st.parts.push(part);
        if (work) st.works.push(work);
        drawLines();
        markDirty();
        m.close();
        toast(work ? 'Запчасть и работа добавлены — сохраните заказ-наряд' : 'Запчасть добавлена — сохраните заказ-наряд');
      },
    });
  };
  $('[data-act=print]', root).onclick = async () => {
    if (dirty) await save();
    if (DEMO) go(`#/print/order/${o.id}`);
    else window.open(`#/print/order/${o.id}`, '_blank');
  };
  $('[data-act=delete]', root)?.addEventListener('click', async () => {
    if (!await askConfirm(`Удалить заказ-наряд №${o.id}? Запчасти вернутся на склад, оплаты будут удалены.`)) return;
    await api(`/orders/${o.id}`, { method: 'DELETE' });
    dirty = false;
    toast('Заказ-наряд удалён');
    go('#/orders');
  });
  on(root, 'click', '[data-act=pay]', () => {
    const debt = calc().debt;
    openModal({
      title: `Оплата по заказ-наряду №${o.id}`,
      submit: 'Принять оплату',
      body: `<div class="form-grid">${fNum('Сумма, ₽', 'amount', debt > 0 ? debt : '', { req: true })}
        ${fSelect('Способ оплаты', 'method', Object.entries(PAY), 'cash')}
        ${fInput('Комментарий', 'note', '', { cls: 'wide', ph: 'Необязательно' })}</div>`,
      onSubmit: async (d) => {
        const r = await api(`/orders/${o.id}/payments`, { method: 'POST', body: d });
        st.payments = r.payments;
        drawTotals();
        toast('Оплата принята');
        if (calc().debt <= 0.009 && st.status === 'ready' && await askConfirm('Заказ-наряд оплачен полностью. Отметить как «Выдан»?')) {
          st.status = 'done';
          setTimeout(save, 0);
        }
      },
    });
  });
  on(root, 'click', '[data-delpay]', async (e, el) => {
    if (!await askConfirm('Удалить эту оплату?')) return;
    const r = await api(`/payments/${el.dataset.delpay}`, { method: 'DELETE' });
    st.payments = r.payments;
    drawTotals();
  });

  autocomplete($('.add-work', root), {
    source: (q) => api('/services', { query: { q, limit: 15 } }),
    render: (s) => `<div class="t">${esc(s.name)}</div><div class="s">${esc(s.category || 'Без категории')} · ${fmtNum(s.hours)} н/ч · ${money(s.price)}</div>`,
    footer: (q) => `+ «${q}» — своя работа, не из прайса`,
    onPick: (s, q) => {
      st.works.push(s ? { service_id: s.id, name: s.name, qty: 1, price: s.price, employee_id: '' }
        : { service_id: null, name: q, qty: 1, price: toNum(SETTINGS.hour_price), employee_id: '' });
      $('.add-work', root).value = '';
      drawLines();
      markDirty();
      if (!s) $(`.works-body tr:last-child [data-f=price]`, root)?.select();
    },
  });
  autocomplete($('.add-part', root), {
    source: (q) => api('/parts', { query: { q, limit: 15 } }),
    render: (p) => `<div class="t">${esc(p.name)}</div><div class="s">${esc([p.brand, p.sku].filter(Boolean).join(' · '))} · <span style="${p.qty <= 0 ? 'color:var(--danger)' : ''}">остаток ${fmtNum(p.qty)} ${esc(p.unit)}</span> · ${money(p.price)}</div>`,
    footer: (q) => `+ «${q}» — без списания со склада`,
    onPick: (p, q) => {
      const same = p && st.parts.find((x) => x.part_id === p.id);
      if (same) same.qty = toNum(same.qty) + 1;
      else st.parts.push(p ? { part_id: p.id, name: p.name, sku: p.sku, qty: 1, price: p.price, buy_price: p.buy_price, unit: p.unit, avail: p.qty }
        : { part_id: null, name: q, sku: '', qty: 1, price: 0, buy_price: 0, avail: null });
      $('.add-part', root).value = '';
      drawLines();
      markDirty();
      if (!p) $(`.parts-body tr:last-child [data-f=price]`, root)?.select();
    },
  });

  drawLines();
}

/* ======================= запись (календарь) ======================= */
async function viewCalendar(v, params) {
  let day = params.get('date') || isoDate();
  const posts = await getPosts();
  const ROW = 30;
  const SLOT = 30;
  v.innerHTML = `
    <div class="page-head"><div><h1>Запись на сервис</h1><div class="day-title muted" style="font-weight:500"></div></div>
      <div class="actions">
        <div class="date-nav">
          <button class="btn" data-d="-1" title="Предыдущий день">${icon('left')}</button>
          <input type="date" class="f-date" value="${day}">
          <button class="btn" data-d="1" title="Следующий день">${icon('right')}</button>
          <button class="btn" data-d="0">Сегодня</button>
        </div>
        <button class="btn primary" data-act="new">${icon('plus')} Записать</button>
      </div></div>
    <div class="cal-host"><div class="loading">Загрузка…</div></div>
    <p class="hint">Нажмите на свободное время, чтобы записать клиента. Нажмите на запись, чтобы изменить её или открыть заказ-наряд.</p>`;
  let items = [];
  async function load() {
    replaceHash(`#/calendar?date=${day}`);
    $('.f-date', v).value = day;
    $('.day-title', v).textContent = longDate(day) + (day === isoDate() ? ' — сегодня' : '');
    items = await api('/appointments', { query: { from: day, to: addDays(day, 1) } });
    draw();
  }
  function draw() {
    let startMin = toMin(SETTINGS.work_start || '09:00');
    let endMin = toMin(SETTINGS.work_end || '20:00');
    if (endMin <= startMin) endMin = startMin + 600;
    for (const a of items) {
      const s = toMin(a.start.slice(11, 16));
      startMin = Math.min(startMin, Math.floor(s / 60) * 60);
      endMin = Math.max(endMin, Math.ceil((s + a.duration) / 60) * 60);
    }
    endMin = Math.min(endMin, 24 * 60);
    const known = new Set(posts.map((p) => p.id));
    const cols = posts.map((p) => ({ id: p.id, name: p.name }));
    if (!cols.length || items.some((a) => !known.has(a.post_id))) cols.push({ id: null, name: 'Без поста' });
    const times = [];
    for (let t = startMin; t < endMin; t += SLOT) times.push(t);
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    let html = `<div class="cal" style="--cols:${cols.length};--row:${ROW}px"><div class="cal-h"></div>${cols.map((c) => `<div class="cal-h">${esc(c.name)}</div>`).join('')}`;
    html += `<div class="cal-times">${times.map((t) => `<div class="cal-time">${t % 60 === 0 ? fromMin(t) : ''}</div>`).join('')}</div>`;
    for (const c of cols) {
      html += `<div class="cal-col" data-post="${c.id ?? ''}">${times.map((t) => `<div class="cal-slot ${(t + SLOT) % 60 === 0 ? 'hour' : ''}" data-time="${fromMin(t)}"></div>`).join('')}`;
      for (const a of items) {
        const col = known.has(a.post_id) ? a.post_id : null;
        if (col !== c.id) continue;
        const s = toMin(a.start.slice(11, 16));
        const top = ((s - startMin) / SLOT) * ROW;
        const h = Math.max((a.duration / SLOT) * ROW - 3, 24);
        html += `<div class="cal-appt ${a.status}" data-id="${a.id}" style="top:${top + 1}px;height:${h}px" title="${esc(`${a.client_name || ''}\n${carLine(a)}\n${a.description || ''}`)}">
          <div class="t">${a.start.slice(11, 16)}–${fromMin(s + a.duration)} ${esc(a.client_name || '')}</div>
          <div>${esc(carLine(a))}</div>
          ${a.description ? `<div class="muted">${esc(a.description)}</div>` : ''}
          ${a.order_id ? `<div style="margin-top:2px">${badge(a.order_status)} <span class="small">№${a.order_id}</span></div>` : ''}</div>`;
      }
      if (day === isoDate() && nowMin >= startMin && nowMin <= endMin) html += `<div class="cal-now" style="top:${((nowMin - startMin) / SLOT) * ROW}px"></div>`;
      html += '</div>';
    }
    $('.cal-host', v).innerHTML = `<div class="cal-wrap">${html}</div></div>`;
  }
  on(v, 'click', '.cal-slot', (e, el) => {
    const post = el.closest('.cal-col').dataset.post;
    apptDialog({ date: day, time: el.dataset.time, postId: post ? +post : '', onSaved: load });
  });
  on(v, 'click', '.cal-appt', (e, el) => apptDialog({ appt: items.find((a) => a.id === +el.dataset.id), onSaved: load }));
  on(v, 'click', '[data-d]', (e, el) => { const d = +el.dataset.d; day = d ? addDays(day, d) : isoDate(); load(); });
  $('.f-date', v).onchange = (e) => { if (e.target.value) { day = e.target.value; load(); } };
  $('[data-act=new]', v).onclick = () => apptDialog({ date: day, onSaved: load });
  await load();
}

/* ======================= склад ======================= */
function partDialog(p, onSaved) {
  const x = p || { unit: 'шт' };
  const buttons = p && isAdmin() ? [{ label: icon('trash'), cls: 'danger', onClick: async () => {
    if (!await askConfirm(`Удалить «${p.name}» со склада? В старых заказ-нарядах позиция останется.`)) return false;
    await api(`/parts/${p.id}`, { method: 'DELETE' });
    onSaved();
  } }] : [];
  openModal({
    title: p ? 'Позиция склада' : 'Новая позиция',

async function viewStock(v, params) {
  const f = { q: '', low: params.get('low') === '1' };
  v.innerHTML = `

          <td class="num-cell a-qty"><span class="${low || p.qty < 0 ? 'neg' : ''}">${fmtNum(p.qty)} ${esc(p.unit)}</span>${p.min_qty ? `<div class="muted small">мин. ${fmtNum(p.min_qty)}</div>` : ''}</td>
          <td class="num-cell m-hide">${money(p.buy_price)}</td><td class="num-cell a-price">${money(p.price)}</td>
          <td class="right nowrap a-act"><button class="btn sm" data-recv="${i}">+ Приход</button> <button class="icon-btn" data-edit="${i}" title="Изменить">${icon('edit')}</button></td></tr>`;
      }).join('')}</tbody></table>` : `<div class="empty">${f.q || f.low ? 'Ничего не найдено' : 'Склад пуст — добавьте первую позицию'}</div>`;

    $('.foot', v).textContent = list.length ? `Позиций: ${list.length}. Стоимость остатков по закупке: ${money(value)}` : '';

/* ======================= отчёты ======================= */
async function viewReports(v, params) {
  if (!isAdmin()) { v.innerHTML = '<div class="empty">Отчёты доступны администратору</div>'; return; }
  const today = isoDate();
  const monthStart = today.slice(0, 8) + '01';
  const prevMonthEnd = addDays(monthStart, -1);
  const f = { from: params.get('from') || monthStart, to: params.get('to') || today };
  const d0 = new Date();
  const weekStart = addDays(today, -((d0.getDay() + 6) % 7));
  const PRESETS = [['Сегодня', today, today], ['Эта неделя', weekStart, today], ['Этот месяц', monthStart, today],
    ['Прошлый месяц', prevMonthEnd.slice(0, 8) + '01', prevMonthEnd], ['Этот год', today.slice(0, 4) + '-01-01', today]];
  v.innerHTML = `
    <div class="page-head"><h1>Отчёты</h1></div>
    <div class="toolbar">
      ${PRESETS.map(([t, a, b], i) => `<button class="tab" data-p="${i}" data-from="${a}" data-to="${b}">${t}</button>`).join('')}
      <input type="date" class="f-from" value="${f.from}"> — <input type="date" class="f-to" value="${f.to}">
    </div>
    <div class="res"><div class="loading">Загрузка…</div></div>`;
  async function load() {
    replaceHash(`#/reports?from=${f.from}&to=${f.to}`);
    $('.f-from', v).value = f.from;
    $('.f-to', v).value = f.to;
    $$('[data-p]', v).forEach((b) => b.classList.toggle('active', b.dataset.from === f.from && b.dataset.to === f.to));
    const r = await api('/reports', { query: f });
    const kpi = (l, val, sub = '') => `<div class="kpi"><div class="label">${l}</div><div class="value">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
    const table = (head, rows, empty) => (rows.length ? `<div class="table-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty-sm">${empty}</div>`);
    $('.res', v).innerHTML = `
      <div class="kpis">
        ${kpi('Поступило денег', money(r.revenue), 'все оплаты за период')}
        ${kpi('Выдано машин', r.orders_closed, `средний чек ${money(r.avg_check)}`)}
        ${kpi('Работы', money(r.works_sum), 'по выданным заказ-нарядам')}
        ${kpi('Запчасти', money(r.parts_sum), `наценка ${money(r.parts_margin)}`)}
        ${kpi('Скидки', money(r.discount_sum))}
        ${kpi('Новых клиентов', r.new_clients)}
      </div>
      <div class="grid-2">
        <section class="card"><h2 style="margin-bottom:8px">Зарплата мастеров</h2>
          ${table('<th>Сотрудник</th><th class="right">Работ</th><th class="right">Сумма работ</th><th class="right">%</th><th class="right">Начислено</th>',
            r.mechanics.map((m) => `<tr><td class="title">${esc(m.name)}</td><td class="num-cell">${m.works_count}</td><td class="num-cell">${money(m.amount)}</td><td class="num-cell">${fmtNum(m.percent)}</td><td class="num-cell"><b>${money(m.salary)}</b></td></tr>`),
            'Нет выданных заказ-нарядов за период')}
          <p class="hint">Процент задаётся в карточке сотрудника. Считается от суммы работ без учёта скидки; если исполнитель не указан — по мастеру заказ-наряда.</p></section>
        <section class="card"><h2 style="margin-bottom:8px">Поступления по способам оплаты</h2>
          ${table('<th>Способ</th><th class="right">Платежей</th><th class="right">Сумма</th>',
            r.payments.map((p) => `<tr><td>${esc(PAY[p.method] || p.method)}</td><td class="num-cell">${p.cnt}</td><td class="num-cell">${money(p.amount)}</td></tr>`), 'Оплат не было')}</section>
        <section class="card"><h2 style="margin-bottom:8px">Популярные работы</h2>
          ${table('<th>Работа</th><th class="right">Раз</th><th class="right">Сумма</th>',
            r.top_services.map((s) => `<tr><td>${esc(s.name)}</td><td class="num-cell">${s.cnt}</td><td class="num-cell">${money(s.amount)}</td></tr>`), 'Нет данных')}</section>
        <section class="card"><h2 style="margin-bottom:8px">Поступления по дням</h2>
          ${table('<th>День</th><th class="right">Сумма</th>',
            r.daily.map((d) => `<tr><td>${fmtDate(d.day)}, ${WEEKDAYS[new Date(d.day + 'T00:00:00').getDay()]}</td><td class="num-cell">${money(d.amount)}</td></tr>`), 'Нет данных')}</section>
      </div>`;
  }
  on(v, 'click', '[data-p]', (e, el) => { f.from = el.dataset.from; f.to = el.dataset.to; load(); });
  $('.f-from', v).onchange = (e) => { if (e.target.value) { f.from = e.target.value; load(); } };
  $('.f-to', v).onchange = (e) => { if (e.target.value) { f.to = e.target.value; load(); } };
  await load();
}

      <p>Все данные CRM хранятся в одном файле базы. Скачивайте копию хотя бы раз в неделю и храните её вне этого компьютера — на флешке или в облаке.</p>
      ${DEMO ? '<p class="hint">В демо-версии скачивание отключено.</p>' : `<a class="btn primary" href="/api/backup">${icon('download')} Скачать резервную копию</a>`}
      <p class="hint" style="margin-top:14px">Восстановление: остановите сервер, замените файл <code>crm/data/crm.db</code> скачанной копией (переименуйте её в crm.db) и запустите сервер снова.</p></section>`;
  } else {
    res.innerHTML = `<section class="card" style="max-width:520px"><h2 style="margin-bottom:12px">Смена пароля</h2><form><div class="form-grid">
      ${fInput('Текущий пароль', 'old_password', '', { type: 'password', req: true, cls: 'wide', attrs: 'autocomplete="current-password"' })}
      ${fInput('Новый пароль', 'new_password', '', { type: 'password', req: true, attrs: 'autocomplete="new-password"' })}
      ${fInput('Новый пароль ещё раз', 'new_password2', '', { type: 'password', req: true, attrs: 'autocomplete="new-password"' })}</div>
      <div class="form-error" hidden></div><div style="margin-top:14px"><button class="btn primary">Сменить пароль</button></div></form></section>`;
    const form = $('form', res);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const d = formToObj(form);
      const err = $('.form-error', form);
      try {
        if (d.new_password !== d.new_password2) throw new Error('Новые пароли не совпадают');
        await api('/auth/password', { method: 'PUT', body: d });
        form.reset();
        err.hidden = true;
        toast('Пароль изменён');
      } catch (ex) { err.textContent = ex.message; err.hidden = false; }
    };
  }
}

/* ======================= печать заказ-наряда ======================= */
async function viewPrint(v, params, id) {
  const [o, s] = await Promise.all([api(`/orders/${id}`), api('/settings')]);
  const act = params.get('doc') === 'act';
  const docDate = act && o.closed_at ? o.closed_at : o.created_at;
  const lineRows = (list, withSku) => list.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.name)}</td>${withSku ? `<td>${esc(x.sku)}</td>` : ''}
    <td class="right">${fmtNum(x.qty)}</td><td class="right">${money(x.price)}</td><td class="right">${money(x.qty * x.price)}</td></tr>`).join('');
  const car = o.car || {};
  const discSum = round2(o.works_sum + o.parts_sum - o.total);
  v.innerHTML = `
    <div class="print-bar">
      ${DEMO?.framed ? '<span class="hint" style="align-self:center">Так документ выглядит на печати. В рабочей версии здесь кнопка «Печать».</span>'
        : `<button class="btn primary" data-act="print">${icon('printer')} Печать</button>`}
      <a class="btn" href="#/print/order/${o.id}${act ? '' : '?doc=act'}">${act ? 'Показать заказ-наряд' : 'Показать акт выполненных работ'}</a>
      <a class="btn ghost" href="#/orders/${o.id}">← К заказ-наряду</a>
    </div>
    <div class="doc">
      <div class="company">
        <div><div class="name">${esc(s.company_name)}</div><div>${esc(s.company_address)}</div><div>${esc(s.company_phone)}</div></div>
        <div class="right">${s.company_inn ? `ИНН ${esc(s.company_inn)}` : ''}<div style="white-space:pre-line">${esc(s.company_requisites)}</div></div>
      </div>
      <h1>${act ? 'Акт выполненных работ' : 'Заказ-наряд'} № ${o.id}</h1>
      <div class="center">от ${fmtDate(docDate)}${act ? ` (к заказ-наряду № ${o.id} от ${fmtDate(o.created_at)})` : ''}</div>
      <table class="info" style="margin-top:14px"><tbody>
        <tr><td>Заказчик</td><td><b>${esc(o.client?.name)}</b>${o.client?.phone ? `, тел. ${esc(o.client.phone)}` : ''}</td></tr>
        <tr><td>Автомобиль</td><td><b>${esc(carName(car) || '—')}</b>${car.year ? `, ${car.year} г.` : ''}${car.color ? `, ${esc(car.color)}` : ''}</td></tr>
        <tr><td>Госномер / VIN</td><td>${esc(car.plate || '—')} / ${esc(car.vin || '—')}</td></tr>
        <tr><td>Пробег</td><td>${o.mileage ? fmtNum(o.mileage) + ' км' : '—'}</td></tr>
        ${o.master_name ? `<tr><td>Мастер-приёмщик</td><td>${esc(o.master_name)}</td></tr>` : ''}
        ${o.complaint ? `<tr><td>Причина обращения</td><td>${esc(o.complaint)}</td></tr>` : ''}
      </tbody></table>
      ${o.works.length ? `<div class="block-title">Работы</div><table><thead><tr><th style="width:28px">№</th><th>Наименование</th><th class="right" style="width:60px">Кол-во</th><th class="right" style="width:95px">Цена</th><th class="right" style="width:105px">Сумма</th></tr></thead><tbody>${lineRows(o.works, false)}</tbody></table>` : ''}
      ${o.parts.length ? `<div class="block-title">Запчасти и материалы</div><table><thead><tr><th style="width:28px">№</th><th>Наименование</th><th style="width:110px">Артикул</th><th class="right" style="width:60px">Кол-во</th><th class="right" style="width:95px">Цена</th><th class="right" style="width:105px">Сумма</th></tr></thead><tbody>${lineRows(o.parts, true)}</tbody></table>` : ''}
      <table class="tot"><tbody>
        <tr><td>Работы:</td><td>${money(o.works_sum)}</td></tr>
        <tr><td>Запчасти и материалы:</td><td>${money(o.parts_sum)}</td></tr>
        ${discSum ? `<tr><td>Скидка ${fmtNum(o.discount)}%:</td><td>−${money(discSum)}</td></tr>` : ''}
        <tr class="grand"><td>Итого:</td><td>${money(o.total)}</td></tr>
        <tr><td>Оплачено:</td><td>${money(o.paid)}</td></tr>
        ${o.debt > 0.009 ? `<tr><td><b>К оплате:</b></td><td><b>${money(o.debt)}</b></td></tr>` : ''}
      </tbody></table>
      ${o.recommendations ? `<div class="block-title">Рекомендации</div><div style="white-space:pre-line">${esc(o.recommendations)}</div>` : ''}
      ${s.warranty_text ? `<p style="margin-top:16px;font-size:11px">${esc(s.warranty_text)}</p>` : ''}
      <div class="sign"><div>Исполнитель (подпись, ФИО)</div><div>Заказчик (подпись, ФИО)</div></div>
    </div>`;
  $('[data-act=print]', v)?.addEventListener('click', () => window.print());
}

/* ======================= запуск ======================= */
function initShell() {
  $$('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon); el.removeAttribute('data-icon'); });
  $('#logout').onclick = async () => {
    await api('/auth/logout', { method: 'POST' }).catch(() => {});
    ME = null;
    LEAVE_GUARD = null;
    showLogin();
  };
  $('#menu-btn').onclick = () => document.body.classList.toggle('menu-open');
  $('#shade').onclick = () => document.body.classList.remove('menu-open');
  $('#quick-order').onclick = () => newOrderDialog();
  $('#quick-appt').onclick = () => apptDialog({});
  const gs = $('#global-search');
  autocomplete(gs, {
    source: async (q) => {
      const r = await api('/search', { query: { q } });
      return [...(r.order ? [{ ...r.order, __order: true }] : []), ...r.clients];
    },
    render: (it) => (it.__order ? `<div class="t">Заказ-наряд №${it.id}</div><div class="s">${esc(it.client_name)} · ${esc(ORDER_STATUS[it.status]?.[0] || '')}</div>` : clientItem(it)),
    onPick: (it) => {
      if (!it) return;
      gs.value = '';
      gs.blur();
      go(it.__order ? `#/orders/${it.id}` : `#/clients/${it.id}`);
    },
    minLen: 1,
  });
  window.addEventListener('hashchange', router);
  if (MEMORY_NAV) {
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#/"]');
      if (!a || e.defaultPrevented) return;
      e.preventDefault();
      go(a.getAttribute('href'));
    });
  }
  window.addEventListener('beforeunload', (e) => {
    if (LEAVE_GUARD?.()) { e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && SAVE_HANDLER && !$('.modal-overlay')) {
      e.preventDefault();
      SAVE_HANDLER();
    }
    if (e.key === '/' && !e.target.closest('input, textarea, select') && !$('.modal-overlay')) {
      e.preventDefault();
      gs.focus();
    }
  });
}

initShell();
boot();

</script>
