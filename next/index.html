<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM МК Сервис</title>
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="МК Сервис β">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Демо-версия CRM для автосервиса: запись, заказ-наряды, клиенты, склад, отчёты.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%232563eb%22/%3E%3Cpath%20d%3D%22M19.6%209.4a1.3%201.3%200%200%200%200%201.8l1.2%201.2a1.3%201.3%200%200%200%201.8%200l3-3a7%207%200%200%201-9.3%209.3l-6%206a2.2%202.2%200%200%201-3.1-3.1l6-6a7%207%200%200%201%209.3-9.3z%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --border: #e2e7ef;
  --border-strong: #cfd7e3;
  --text: #182134;
  --muted: #687389;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #e9f0ff;
  --danger: #d92d20;
  --danger-soft: #fdeceb;
  --ok: #15803d;
  --ok-soft: #e6f6ec;
  --warn: #b45309;
  --warn-soft: #fdf2e1;
  --info: #0e7490;
  --info-soft: #e2f5f9;
  --gray-soft: #eef1f5;
  --side-bg: #111827;
  --side-text: #c4cbd8;
  --side-hover: #1d2638;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18);
  color-scheme: light;
}

/* Тёмная тема: по системной настройке и по явному выбору data-theme="dark". */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220;
    --surface: #131b2c;
    --surface-2: #182236;
    --border: #243049;
    --border-strong: #33415e;
    --text: #e5e9f2;
    --muted: #93a0b8;
    --accent: #4f8cff;
    --accent-hover: #6b9dff;
    --accent-soft: #1a2a4d;
    --danger: #f2655a;
    --danger-soft: #3a1d1f;
    --ok: #4ccb7f;
    --ok-soft: #15301f;
    --warn: #f0a24a;
    --warn-soft: #36270f;
    --info: #4cc3dc;
    --info-soft: #0f2d35;
    --gray-soft: #1f2a40;
    --side-bg: #0a0f1a;
    --side-hover: #172033;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220;
  --surface: #131b2c;
  --surface-2: #182236;
  --border: #243049;
  --border-strong: #33415e;
  --text: #e5e9f2;
  --muted: #93a0b8;
  --accent: #4f8cff;
  --accent-hover: #6b9dff;
  --accent-soft: #1a2a4d;
  --danger: #f2655a;
  --danger-soft: #3a1d1f;
  --ok: #4ccb7f;
  --ok-soft: #15301f;
  --warn: #f0a24a;
  --warn-soft: #36270f;
  --info: #4cc3dc;
  --info-soft: #0f2d35;
  --gray-soft: #1f2a40;
  --side-bg: #0a0f1a;
  --side-hover: #172033;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 15px; margin: 0; font-weight: 650; }
h3 { font-size: 16px; margin: 0; font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.num-cell { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

.ic { width: 18px; height: 18px; flex: none; vertical-align: middle; }

/* ---------- каркас ---------- */
#app { display: flex; min-height: 100vh; }
#sidebar {
  width: 232px; flex: none; background: var(--side-bg); color: var(--side-text);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; color: #fff; font-weight: 650; font-size: 15px; }
.brand-logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; }
#nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; flex: 1; overflow-y: auto; }
#nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--side-text); font-weight: 500; }
#nav a:hover { background: var(--side-hover); text-decoration: none; color: #fff; }
#nav a.active { background: var(--accent); color: #fff; }
.user-box { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.08); color: #fff; }
.user-box .icon-btn { color: var(--side-text); }
.user-box .icon-btn:hover { background: var(--side-hover); color: #fff; }
#content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
#menu-btn { display: none; }
.search-wrap { position: relative; flex: 1; max-width: 520px; }
.search-wrap input { padding-left: 36px; }
.search-ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }
.top-actions { display: flex; gap: 8px; margin-left: auto; }
#main { padding: 22px 24px 48px; max-width: 1440px; width: 100%; }
#shade { display: none; }

/* ---------- элементы ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 550; cursor: pointer;
  white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--gray-soft); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
  border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0;
}
.icon-btn:hover { background: var(--gray-soft); color: var(--text); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

input, select, textarea {
  width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--surface); color: var(--text); font: inherit; outline: none;
}
textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="checkbox"] { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 550; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 14px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-error { color: var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint.warn { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-head .sum { font-weight: 650; font-variant-numeric: tabular-nums; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.back { display: inline-block; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-2 > .card + .card { margin-top: 0; }
.loading, .empty { padding: 32px; text-align: center; color: var(--muted); }
.empty-sm { padding: 12px 0; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 550; }
.kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
.kpi.alert .value { color: var(--danger); }
a.kpi { color: inherit; display: block; }
a.kpi:hover { text-decoration: none; border-color: var(--accent); }

/* ---------- таблицы ---------- */
.table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl .title { font-weight: 600; }
.tbl .neg { color: var(--danger); font-weight: 600; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--gray-soft); color: var(--muted); }
.badge.blue { background: var(--accent-soft); color: var(--accent); }
.badge.orange { background: var(--warn-soft); color: var(--warn); }
.badge.green { background: var(--ok-soft); color: var(--ok); }
.badge.red { background: var(--danger-soft); color: var(--danger); }
.badge.teal { background: var(--info-soft); color: var(--info); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { border: 1px solid transparent; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; font: inherit; font-weight: 550; cursor: pointer; }
.tab:hover { background: var(--gray-soft); color: var(--text); }
.tab.active { background: var(--surface); border-color: var(--border-strong); color: var(--text); box-shadow: var(--shadow); }
.tab .cnt { color: var(--muted); font-weight: 500; margin-left: 4px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input[type="search"], .toolbar .grow { flex: 1; min-width: 200px; }
.toolbar input[type="date"] { width: 150px; }

.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.list-item .time { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 48px; }
.list-item .main { flex: 1; min-width: 0; }
.list-item .main .title { font-weight: 600; }
a.list-item { color: inherit; }
a.list-item:hover { text-decoration: none; background: var(--surface-2); }

/* ---------- заказ-наряд ---------- */
.order-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.order-side { position: sticky; top: 76px; }
.info-line { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-bottom: 14px; }
.info-line .lbl { font-size: 12px; color: var(--muted); }
.info-line .val { font-weight: 600; }
table.lines { width: 100%; border-collapse: collapse; }
.lines th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 6px 6px; white-space: nowrap; }
.lines td { padding: 4px 6px; vertical-align: top; }
.lines input, .lines select { height: 34px; }
.lines .c-qty { width: 82px; }
.lines .c-price { width: 112px; }
.lines .c-sum { width: 110px; text-align: right; padding-top: 11px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lines .c-emp { width: 170px; }
.lines .c-sku { width: 130px; }
.lines .c-del { width: 40px; }
.lines .stock-hint { font-size: 11.5px; color: var(--muted); padding: 2px 2px 0; }
.lines .stock-hint.warn { color: var(--warn); }
.lines input.num { text-align: right; }
.add-line { margin-top: 8px; position: relative; }
.add-line input { border-style: dashed; background: var(--surface-2); }
.totals .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-variant-numeric: tabular-nums; }
.totals .row.big { font-size: 20px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }
.totals .row.debt { color: var(--danger); font-weight: 650; }
.totals .row.paid-full { color: var(--ok); font-weight: 650; }
.totals .disc { display: flex; align-items: center; gap: 6px; }
.totals .disc input { width: 70px; height: 30px; text-align: right; }
.status-select { width: auto; font-weight: 600; }
.dirty-flag { color: var(--warn); font-weight: 600; font-size: 13px; }
.pay-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.pay-item:last-child { border-bottom: 0; }

/* ---------- автодополнение ---------- */
.ac-box {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60; background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-lg);
  max-height: 340px; overflow-y: auto; padding: 4px;
}
.ac-item { padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.ac-item.active { background: var(--accent-soft); }
.ac-item .t { font-weight: 600; }
.ac-item .s { font-size: 12.5px; color: var(--muted); }
.ac-item.footer { color: var(--accent); font-weight: 550; border-top: 1px solid var(--border); border-radius: 0 0 7px 7px; }
.ac-empty { padding: 10px; color: var(--muted); }

/* ---------- выбор клиента ---------- */
.picker { margin-bottom: 14px; }
.picked { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); margin-bottom: 12px; }
.picked .t { font-weight: 650; }
.section-label { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 8px; }
.link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 550; cursor: pointer; padding: 0; }
.link-btn:hover { text-decoration: underline; }

/* ---------- модальные окна ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(10, 15, 28, .5);
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto;
  animation: fade .12s ease-out;
}
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; display: flex; flex-direction: column; }
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; }
.modal-body { padding: 16px 20px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 14px 14px; }
.modal-foot .spacer { flex: 1; }
@keyframes fade { from { opacity: 0; } }

#toasts { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 9px; box-shadow: var(--shadow-lg); font-weight: 550; transition: opacity .3s, transform .3s; max-width: 360px; }
.toast.error { background: var(--danger); color: #fff; }
.toast.hide { opacity: 0; transform: translateY(6px); }

/* ---------- календарь ---------- */
.cal-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.cal { display: grid; grid-template-columns: 58px repeat(var(--cols), minmax(170px, 1fr)); min-width: min-content; }
.cal-h { position: sticky; top: 0; z-index: 2; background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 10px; font-weight: 650; text-align: center; border-left: 1px solid var(--border); }
.cal-h:first-child { border-left: 0; }
.cal-times { border-right: 1px solid var(--border); }
.cal-time { height: var(--row); font-size: 11.5px; color: var(--muted); text-align: right; padding: 0 8px; transform: translateY(-7px); font-variant-numeric: tabular-nums; }
.cal-time:first-child { transform: none; padding-top: 2px; }
.cal-col { position: relative; border-left: 1px solid var(--border); }
.cal-col:nth-child(2) { border-left: 0; }
.cal-slot { height: var(--row); border-bottom: 1px dashed var(--border); cursor: pointer; }
.cal-slot.hour { border-bottom-style: solid; }
.cal-slot:hover { background: var(--accent-soft); }
.cal-appt {
  position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 5px 8px; overflow: hidden; cursor: pointer;
  background: var(--accent-soft); border-left: 4px solid var(--accent); font-size: 12.5px; line-height: 1.35;
  box-shadow: var(--shadow);
}
.cal-appt:hover { filter: brightness(.97); z-index: 3; }
.cal-appt .t { font-weight: 650; }
.cal-appt.arrived { background: var(--ok-soft); border-left-color: var(--ok); }
.cal-appt.no_show, .cal-appt.cancelled { background: var(--gray-soft); border-left-color: var(--muted); opacity: .75; text-decoration: line-through; }
.cal-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 4; pointer-events: none; }
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav input { width: 160px; }
.day-title { font-weight: 650; font-size: 15px; }

/* ---------- авторизация ---------- */
#auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card .brand { color: var(--text); padding: 0 0 16px; font-size: 18px; }
.auth-card form { display: flex; flex-direction: column; gap: 12px; }

/* ---------- печать ---------- */
#print-root { background: #fff; color: #000; min-height: 100vh; }
.print-bar { display: flex; gap: 8px; padding: 12px 16px; background: #f3f5f9; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
.doc { max-width: 800px; margin: 0 auto; padding: 32px 36px; font-size: 12.5px; color: #000; }
.doc h1 { font-size: 18px; text-align: center; margin: 18px 0 4px; }
.doc .center { text-align: center; }
.doc .company { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
.doc .company .name { font-size: 16px; font-weight: 700; }
.doc table { width: 100%; border-collapse: collapse; margin: 10px 0; }
.doc th, .doc td { border: 1px solid #555; padding: 4px 6px; text-align: left; vertical-align: top; }
.doc th { background: #eee; font-weight: 600; }

<script>
/* Демо-режим CRM: копия серверного API (api.py), работающая прямо в браузере.
   Перехватывает fetch('/api/...'), данные вымышленные и хранятся в localStorage этого браузера. */
(function () {
  'use strict';

  const KEY = 'autocrm-demo-next';
  const MAX_AGE = 7 * 864e5; // через неделю демо-данные обновляются, чтобы запись «на сегодня» не устаревала
  const framed = (() => { try { return window.self !== window.top; } catch { return true; } })();

  class ApiError {
    constructor(status, message, extra) { this.status = status; this.message = message; this.extra = extra || {}; }
  }

  /* ---------- помощники ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const fmtD = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtDT = (d) => `${fmtD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const now = () => fmtDT(new Date());
  const today = () => fmtD(new Date());
  const addDays = (iso, n) => { const d = new Date(iso.slice(0, 10) + 'T00:00:00'); d.setDate(d.getDate() + n); return fmtD(d); };
  const round2 = (x) => Math.round(x * 100) / 100;
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
  const digits = (v) => String(v ?? '').replace(/\D/g, '');
  const LAT = 'ABCEHKMOPTXY';
  const CYR = 'АВСЕНКМОРТХУ';
  const normPlate = (v) => (v ? String(v).toUpperCase().replace(/[ABCEHKMOPTXY]/g, (ch) => CYR[LAT.indexOf(ch)]).replace(/[^0-9A-ZА-ЯЁ]/g, '') : '');
  const ru = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'ru');
  const str = (v) => (v === null || v === undefined ? '' : String(v).trim());
  const lower = (v) => String(v ?? '').toLowerCase();

  function toNumber(v, field) {
    if (v === null || v === undefined || (typeof v === 'string' && !v.trim())) return null;
    if (typeof v === 'boolean') return v ? 1 : 0;
    const n = Number(String(v).replace(',', '.').replace(/[\s ]/g, ''));
    if (!Number.isFinite(n)) throw new ApiError(400, `Поле «${field}»: нужно число`);
    return n;
  }
  function toDate(v, field) {
    v = str(v);
    if (!v) return null;
    if (!/^\d{4}-\d{2}-\d{2}/.test(v) || Number.isNaN(new Date(v.slice(0, 10)).getTime())) throw new ApiError(400, `Поле «${field}»: неверная дата`);
    return v.slice(0, 10);
  }
  function conv(d, spec) {
    const out = {};
    for (const [k, kind] of Object.entries(spec)) {
      if (!(k in d)) continue;
      const v = d[k];
      if (kind === 'str') out[k] = str(v);
      else if (kind === 'num') out[k] = toNumber(v, k) ?? 0;
      else if (kind === 'int') { const n = toNumber(v, k); out[k] = n === null ? null : Math.trunc(n); }
      else if (kind === 'bool') out[k] = [true, 1, '1', 'true', 'on'].includes(v) ? 1 : 0;
      else if (kind === 'date') out[k] = toDate(v, k);
    }
    return out;
  }
  const requireName = (data) => { if ('name' in data && !data.name) throw new ApiError(400, 'Заполните обязательные поля'); };

  /* ---------- хранилище ---------- */
  const TABLES = ['users', 'employees', 'posts', 'clients', 'cars', 'services', 'parts', 'orders', 'order_works', 'order_parts', 'payments', 'appointments'];
  const DEFAULT_SETTINGS = {
    company_name: 'МК Сервис', company_address: '', company_phone: '', company_inn: '', company_requisites: '',
    hour_price: '2000', parts_markup: '30', parts_demo_catalog: '1', work_start: '09:00', work_end: '20:00',
    warranty_text: 'Гарантия на выполненные работы — 30 дней или 1 000 км пробега, на установленные запчасти — по условиям производителя. С объёмом и стоимостью работ согласен, автомобиль получил, претензий к внешнему виду и комплектности не имею.',
  };
  const DEFAULTS = {
    users: () => ({ name: '', role: 'staff', active: 1, created_at: now() }),
    employees: () => ({ position: '', phone: '', percent: 0, active: 1 }),
    posts: () => ({ sort: 0 }),
    clients: () => ({ phone: '', email: '', notes: '', created_at: now() }),
    cars: () => ({ make: '', model: '', year: null, plate: '', vin: '', color: '', mileage: null, next_service_date: null, next_service_km: null, notes: '', created_at: now() }),
    services: () => ({ category: '', hours: 1, price: 0 }),
    parts: () => ({ sku: '', brand: '', unit: 'шт', qty: 0, min_qty: 0, buy_price: 0, price: 0, location: '' }),
    orders: () => ({ car_id: null, status: 'new', mileage: null, complaint: '', recommendations: '', master_id: null, discount: 0, created_at: now(), closed_at: null, created_by: null }),
    order_works: () => ({ service_id: null, qty: 1, price: 0, employee_id: null, sort: 0 }),
    order_parts: () => ({ part_id: null, sku: '', qty: 1, price: 0, buy_price: 0, sort: 0 }),
    payments: () => ({ method: 'cash', note: '', created_at: now(), user_id: null }),
    appointments: () => ({ duration: 60, post_id: null, client_id: null, car_id: null, description: '', status: 'planned', order_id: null, created_at: now() }),
  };
  let S = null;

  function ins(table, data) {
    S.seq[table] = (S.seq[table] || 0) + 1;
    const row = { ...DEFAULTS[table](), ...data, id: S.seq[table] };
    S[table].push(row);
    return row;
  }
  const find = (table, id) => (id === null || id === undefined ? null : S[table].find((r) => r.id === Number(id)) || null);
  function get(table, id, what = 'Запись') {
    const r = find(table, id);
    if (!r) throw new ApiError(404, `Не найдено: ${what.toLowerCase()}`);
    return r;
  }
  function remove(table, id) {
    S[table] = S[table].filter((r) => r.id !== id);
    const nullify = {
      services: [['order_works', 'service_id']], parts: [['order_parts', 'part_id']], posts: [['appointments', 'post_id']],
      cars: [['appointments', 'car_id']], orders: [['appointments', 'order_id']], employees: [['orders', 'master_id'], ['order_works', 'employee_id']],
    }[table] || [];
    for (const [t, col] of nullify) S[t].forEach((r) => { if (r[col] === id) r[col] = null; });
    if (table === 'clients') {
      S.cars = S.cars.filter((r) => r.client_id !== id);
      S.appointments = S.appointments.filter((r) => r.client_id !== id);
    }
    if (table === 'orders') for (const t of ['order_works', 'order_parts', 'payments']) S[t] = S[t].filter((r) => r.order_id !== id);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* приватный режим: работаем в памяти */ } }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (s.v === 1 && Date.now() - s.seededAt < MAX_AGE && TABLES.every((t) => Array.isArray(s[t]))) return s;
    } catch { /* повреждённые данные: создадим заново */ }
    return null;
  }

  /* ---------- маршруты ---------- */
  const ROUTES = [];
  const route = (method, pattern, role, fn) => ROUTES.push([method, new RegExp('^' + pattern + '$'), role, fn]);
  function dispatch(req) {
    for (const [method, rx, role, fn] of ROUTES) {
      if (method !== req.method) continue;
      const m = req.path.match(rx);
      if (!m) continue;
      if (role !== 'public') {
        if (!req.user) throw new ApiError(401, 'Требуется вход');
        if (role === 'admin' && req.user.role !== 'admin') throw new ApiError(403, 'Недостаточно прав');
      }
      return fn(req, ...m.slice(1).map(Number));
    }
    throw new ApiError(404, 'Метод не найден');
  }

  const ORDER_STATUSES = ['new', 'in_progress', 'waiting_parts', 'ready', 'done', 'cancelled'];
  const ACTIVE = ['new', 'in_progress', 'waiting_parts', 'ready'];
  const APPT_STATUSES = ['planned', 'arrived', 'no_show', 'cancelled'];
  const PAY_METHODS = ['cash', 'card', 'transfer', 'invoice'];
  const EMPLOYEE = { name: 'str', position: 'str', phone: 'str', percent: 'num', active: 'bool' };
  const POST = { name: 'str', sort: 'int' };
  const CLIENT = { name: 'str', phone: 'str', email: 'str', notes: 'str' };
  const CAR = { make: 'str', model: 'str', year: 'int', plate: 'str', vin: 'str', color: 'str', mileage: 'int', next_service_date: 'date', next_service_km: 'int', notes: 'str' };
  const SERVICE = { name: 'str', category: 'str', hours: 'num', price: 'num' };
  const PART = { name: 'str', sku: 'str', brand: 'str', unit: 'str', qty: 'num', min_qty: 'num', buy_price: 'num', price: 'num', location: 'str' };

  /* ----- вход ----- */
  const userPublic = (u) => (u ? { id: u.id, login: u.login, name: u.name, role: u.role } : null);
  function password(d, key = 'password') {
    const pw = String(d[key] ?? '');
    if (pw.length < 6) throw new ApiError(400, 'Пароль должен быть не короче 6 символов');
    return pw;
  }
  route('GET', '/auth/me', 'public', (req) => ({ user: userPublic(req.user), needs_setup: false, company_name: S.settings.company_name }));
  route('POST', '/auth/login', 'public', (req) => {
    const login = lower(str(req.body.login));
    const u = S.users.find((x) => x.active && lower(x.login) === login);
    if (!u || u.password !== String(req.body.password ?? '')) throw new ApiError(400, 'Неверный логин или пароль');
    S.session = u.id;
    return { ok: true };
  });
  route('POST', '/auth/logout', 'staff', () => { S.session = null; return { ok: true }; });
  route('PUT', '/auth/password', 'staff', (req) => {
    const u = get('users', req.user.id);
    if (u.password !== String(req.body.old_password ?? '')) throw new ApiError(400, 'Текущий пароль указан неверно');
    u.password = password(req.body, 'new_password');
    return { ok: true };
  });

  /* ----- пользователи и настройки ----- */
  route('GET', '/users', 'admin', () => [...S.users].sort((a, b) => b.active - a.active || ru(a.name, b.name))
    .map((u) => ({ id: u.id, login: u.login, name: u.name, role: u.role, active: u.active, created_at: u.created_at })));
  route('POST', '/users', 'admin', (req) => {
    const d = req.body;
    const login = str(d.login);
    if (!login) throw new ApiError(400, 'Укажите логин');
    if (S.users.some((u) => lower(u.login) === lower(login))) throw new ApiError(409, 'Такой логин уже занят');
    const role = ['admin', 'staff'].includes(d.role) ? d.role : 'staff';
    return { id: ins('users', { login, name: str(d.name) || login, role, password: password(d) }).id };
  });
  route('PUT', '/users/(\\d+)', 'admin', (req, id) => {
    const d = req.body;
    const u = get('users', id, 'Пользователь');
    const data = conv(d, { name: 'str', active: 'bool' });
    if (['admin', 'staff'].includes(d.role)) data.role = d.role;
    if (id === req.user.id && (data.active === 0 || data.role === 'staff')) throw new ApiError(400, 'Нельзя отключить себя или снять с себя права администратора');
    if (d.password) data.password = password(d);
    Object.assign(u, data);
    return { ok: true };
  });
  route('GET', '/settings', 'staff', () => ({ ...S.settings }));
  route('PUT', '/settings', 'admin', (req) => {
    for (const k of Object.keys(DEFAULT_SETTINGS)) if (k in req.body) S.settings[k] = str(req.body[k]);
    return { ...S.settings };
  });
  route('GET', '/backup', 'admin', () => { throw new ApiError(400, 'В демо-версии скачивание отключено'); });

  function crud(path, table, spec, writeRole, deleteRole, what) {
    route('POST', path, writeRole, (req) => {
      const data = conv(req.body, spec);
      if (!data.name) throw new ApiError(400, 'Укажите название');
      return ins(table, data);
    });
    route('PUT', path + '/(\\d+)', writeRole, (req, id) => {
      const row = get(table, id, what);
      const data = conv(req.body, spec);
      requireName(data);
      Object.assign(row, data);
      return row;
    });
    if (deleteRole) route('DELETE', path + '/(\\d+)', deleteRole, (req, id) => { get(table, id, what); remove(table, id); return { ok: true }; });
  }

  route('GET', '/employees', 'staff', () => [...S.employees].sort((a, b) => b.active - a.active || ru(a.name, b.name)));
  route('GET', '/posts', 'staff', () => [...S.posts].sort((a, b) => a.sort - b.sort || a.id - b.id));
  crud('/employees', 'employees', EMPLOYEE, 'admin', null, 'Сотрудник');
  crud('/posts', 'posts', POST, 'admin', 'admin', 'Пост');

  /* ----- прайс и склад ----- */
  route('GET', '/services', 'staff', (req) => {
    const q = lower(req.q('q').trim());
    return S.services.filter((s) => !q || lower(s.name).includes(q) || lower(s.category).includes(q))
      .sort((a, b) => ru(a.category, b.category) || ru(a.name, b.name)).slice(0, Number(req.q('limit')) || 1000);
  });
  crud('/services', 'services', SERVICE, 'staff', 'admin', 'Услуга');
  route('GET', '/parts', 'staff', (req) => {
    const q = lower(req.q('q').trim());
    const low = req.q('low') === '1';
    return S.parts.filter((p) => (!q || [p.name, p.sku, p.brand].some((x) => lower(x).includes(q))) && (!low || (p.min_qty > 0 && p.qty <= p.min_qty)))
      .sort((a, b) => ru(a.name, b.name)).slice(0, Number(req.q('limit')) || 1000);
  });
  crud('/parts', 'parts', PART, 'staff', 'admin', 'Позиция склада');
  route('POST', '/parts/(\\d+)/receive', 'staff', (req, id) => {
    const p = get('parts', id, 'Позиция склада');
    const qty = toNumber(req.body.qty, 'Количество');
    if (!qty) throw new ApiError(400, 'Укажите количество');
    p.qty += qty;
    for (const [k, v] of Object.entries(conv(req.body, { buy_price: 'num', price: 'num' }))) if (v) p[k] = v;
    return p;
  });

  /* ----- клиенты и автомобили ----- */
  function carData(d) {
    const data = conv(d, CAR);
    if ('plate' in data) data.plate = normPlate(data.plate);
    if ('vin' in data) data.vin = data.vin.replace(/\s/g, '').toUpperCase();
    return data;
  }
  function clientMatches(c, q) {
    if (!c) return false;
    q = q.trim();
    const low = lower(q);
    if (lower(c.name).includes(low) || lower(c.email).includes(low)) return true;
    let d = digits(q);
    if (d.length >= 3 && !/[^\d\s+()-]/.test(q)) {
      if (d.length === 11 && '78'.includes(d[0])) d = d.slice(1);
      if (digits(c.phone).includes(d)) return true;
    }
    const plate = normPlate(q);
    return S.cars.some((x) => x.client_id === c.id && (lower(`${x.make} ${x.model}`).includes(low)
      || String(x.vin).toUpperCase().includes(q.toUpperCase()) || (plate && normPlate(x.plate).includes(plate))));
  }
  function checkDupPhone(phone, excludeId = 0) {
    const d = digits(phone);
    if (d.length < 6) return;
    const tail = d.slice(-10);
    const dup = S.clients.find((c) => c.id !== excludeId && digits(c.phone).endsWith(tail));
    if (dup) throw new ApiError(409, `Клиент с таким телефоном уже есть: ${dup.name}`, { client_id: dup.id });
  }
  function ensureClientCar(d) {
    let clientId = Number(d.client_id) || null;
    if (clientId) get('clients', clientId, 'Клиент');
    else {
      const data = conv(d.client || {}, CLIENT);
      if (!data.name) throw new ApiError(400, 'Выберите клиента или укажите имя нового');
      checkDupPhone(data.phone);
      clientId = ins('clients', data).id;
    }
    let carId = Number(d.car_id) || null;
    if (carId) {
      const car = get('cars', carId, 'Автомобиль');
      if (car.client_id !== clientId) throw new ApiError(400, 'Автомобиль принадлежит другому клиенту');
    } else {
      const car = d.car || {};
      if (['make', 'model', 'plate', 'vin'].some((k) => str(car[k]))) carId = ins('cars', { ...carData(car), client_id: clientId }).id;
    }
    return [clientId, carId];
  }
  const carsOf = (clientId) => S.cars.filter((x) => x.client_id === clientId).sort((a, b) => a.id - b.id);

  route('GET', '/search', 'staff', (req) => {
    const q = req.q('q').trim();
    const result = { clients: [], order: null };
    if (!q) return result;
    const num = q.replace(/^[№#]+/, '').trim();
    if (/^\d{1,7}$/.test(num)) {
      const o = find('orders', Number(num));
      if (o) result.order = { id: o.id, status: o.status, client_name: find('clients', o.client_id)?.name };
    }
    if (q.length < 2) return result;
    result.clients = S.clients.filter((c) => clientMatches(c, q)).sort((a, b) => ru(a.name, b.name)).slice(0, 12)
      .map((c) => ({ id: c.id, name: c.name, phone: c.phone, cars: carsOf(c.id).map(({ id, make, model, year, plate, vin, mileage }) => ({ id, make, model, year, plate, vin, mileage })) }));
    return result;
  });
  route('GET', '/clients', 'staff', (req) => {
    const q = req.q('q').trim();
    return S.clients.filter((c) => !q || clientMatches(c, q)).sort((a, b) => b.id - a.id).slice(0, Number(req.q('limit')) || 300).map((c) => {
      const orders = S.orders.filter((o) => o.client_id === c.id);
      const ids = new Set(orders.map((o) => o.id));
      return {
        ...c,
        orders_count: orders.filter((o) => o.status !== 'cancelled').length,
        last_visit: orders.reduce((m, o) => (o.created_at > (m || '') ? o.created_at : m), null),
        paid_total: sum(S.payments.filter((p) => ids.has(p.order_id)), (p) => p.amount),
        cars_text: carsOf(c.id).map((x) => `${x.make} ${x.model} ${x.plate}`.trim()).join(', ') || null,
      };
    });
  });
  route('POST', '/clients', 'staff', (req) => {
    const [id, carId] = ensureClientCar({ client: req.body, car: req.body.car });
    return { id, car_id: carId };
  });
  route('GET', '/clients/(\\d+)', 'staff', (req, id) => {
    const c = { ...get('clients', id, 'Клиент') };
    c.cars = carsOf(id);
    c.orders = ordersQuery((o) => o.client_id === id, () => true, 1000);
    const t = today();
    c.appointments = S.appointments.filter((a) => a.client_id === id && a.start >= t && a.status === 'planned')
      .sort((a, b) => ru(a.start, b.start)).map((a) => {
        const car = find('cars', a.car_id);
        return { ...a, post_name: find('posts', a.post_id)?.name ?? null, make: car?.make ?? null, model: car?.model ?? null, plate: car?.plate ?? null };
      });
    const valid = c.orders.filter((o) => o.status !== 'cancelled');
    c.paid_total = round2(sum(valid, (o) => o.paid));
    c.debt = round2(sum(valid.filter((o) => o.status === 'done' && o.debt > 0), (o) => o.debt));
    return c;
  });
  route('PUT', '/clients/(\\d+)', 'staff', (req, id) => {
    const c = get('clients', id, 'Клиент');
    const data = conv(req.body, CLIENT);
    requireName(data);
    if (data.phone) checkDupPhone(data.phone, id);
    Object.assign(c, data);
    return c;
  });
  route('DELETE', '/clients/(\\d+)', 'admin', (req, id) => {
    get('clients', id, 'Клиент');
    if (S.orders.some((o) => o.client_id === id)) throw new ApiError(409, 'У клиента есть заказ-наряды, удалить нельзя');
    remove('clients', id);
    return { ok: true };
  });
  route('POST', '/cars', 'staff', (req) => {
    const clientId = Number(req.body.client_id) || 0;
    get('clients', clientId, 'Клиент');
    const data = carData(req.body);
    if (!['make', 'model', 'plate', 'vin'].some((k) => data[k])) throw new ApiError(400, 'Укажите марку, модель или госномер');
    return ins('cars', { ...data, client_id: clientId });
  });
  route('PUT', '/cars/(\\d+)', 'staff', (req, id) => Object.assign(get('cars', id, 'Автомобиль'), carData(req.body)));
  route('DELETE', '/cars/(\\d+)', 'admin', (req, id) => {
    get('cars', id, 'Автомобиль');
    if (S.orders.some((o) => o.car_id === id)) throw new ApiError(409, 'По автомобилю есть заказ-наряды, удалить нельзя');
    remove('cars', id);
    return { ok: true };
  });

  /* ----- заказ-наряды ----- */
  function orderRow(o) {
    const c = find('clients', o.client_id) || {};
    const car = find('cars', o.car_id);
    const works = sum(S.order_works.filter((w) => w.order_id === o.id), (w) => w.qty * w.price);
    const parts = sum(S.order_parts.filter((p) => p.order_id === o.id), (p) => p.qty * p.price);
    const paid = sum(S.payments.filter((p) => p.order_id === o.id), (p) => p.amount);
    const total = round2((works + parts) * (1 - o.discount / 100));
    return {
      ...o, client_name: c.name, client_phone: c.phone, make: car?.make ?? null, model: car?.model ?? null, plate: car?.plate ?? null,
      year: car?.year ?? null, vin: car?.vin ?? null, master_name: find('employees', o.master_id)?.name ?? null,
      works_sum: works, parts_sum: parts, paid, total, debt: round2(total - paid),
    };
  }
  const ordersQuery = (pred, outer = () => true, limit = 300) => S.orders.filter(pred).map(orderRow).filter(outer).sort((a, b) => b.id - a.id).slice(0, limit);
  const hasDebt = (r) => r.total - r.paid > 0.009;
  const bySort = (a, b) => a.sort - b.sort || a.id - b.id;

  function stockEffect(orderId, status) {
    const eff = {};
    if (status === 'cancelled') return eff;
    for (const p of S.order_parts) if (p.order_id === orderId && p.part_id) eff[p.part_id] = (eff[p.part_id] || 0) + p.qty;
    return eff;
  }
  function applyStock(before, after) {
    for (const id of new Set([...Object.keys(before), ...Object.keys(after)])) {
      const delta = (after[id] || 0) - (before[id] || 0);
      const part = find('parts', Number(id));
      if (delta && part) part.qty -= delta;
    }
  }
  function paymentsOf(orderId) {
    const payments = S.payments.filter((p) => p.order_id === orderId).sort((a, b) => a.id - b.id)
      .map((p) => ({ ...p, user_name: find('users', p.user_id)?.name ?? null }));
    return { payments, paid: round2(sum(payments, (p) => p.amount)) };
  }
  function orderFull(id) {
    const o = find('orders', id);
    if (!o) throw new ApiError(404, 'Заказ-наряд не найден');
    const r = orderRow(o);
    r.works = S.order_works.filter((w) => w.order_id === id).sort(bySort).map((w) => ({ ...w, employee_name: find('employees', w.employee_id)?.name ?? null }));
    r.parts = S.order_parts.filter((p) => p.order_id === id).sort(bySort).map((p) => {
      const part = find('parts', p.part_id);
      return { ...p, stock: part ? part.qty : null, unit: part ? part.unit : null };
    });
    r.payments = paymentsOf(id).payments;
    r.client = find('clients', o.client_id);
    r.car = find('cars', o.car_id);
    r.client_cars = carsOf(o.client_id).map(({ id: cid, make, model, plate, year }) => ({ id: cid, make, model, plate, year }));
    return r;
  }
  function raiseMileage(carId, mileage) {
    const car = find('cars', carId);
    if (car && mileage && (car.mileage === null || car.mileage < mileage)) car.mileage = mileage;
  }
  function saveOrder(id, d) {
    const old = get('orders', id, 'Заказ-наряд');
    const oldStatus = old.status;
    const data = conv(d, { mileage: 'int', complaint: 'str', recommendations: 'str', master_id: 'int', discount: 'num', car_id: 'int' });
    const status = d.status ?? oldStatus;
    if (!ORDER_STATUSES.includes(status)) throw new ApiError(400, 'Неизвестный статус');
    data.status = status;
    if (status === 'done' && oldStatus !== 'done') data.closed_at = now();
    else if (status !== 'done') data.closed_at = null;
    if ('discount' in data && !(data.discount >= 0 && data.discount <= 100)) throw new ApiError(400, 'Скидка должна быть от 0 до 100 %');
    if (data.car_id) {
      const car = get('cars', data.car_id, 'Автомобиль');
      if (car.client_id !== old.client_id) throw new ApiError(400, 'Автомобиль принадлежит другому клиенту');
    }
    if (data.master_id) get('employees', data.master_id, 'Сотрудник');
    const before = stockEffect(id, oldStatus);
    Object.assign(old, data);
    if (Array.isArray(d.works)) {
      S.order_works = S.order_works.filter((w) => w.order_id !== id);
      d.works.forEach((w, i) => {
        const line = conv(w, { name: 'str', qty: 'num', price: 'num', employee_id: 'int', service_id: 'int' });
        if (!line.name) return;
        if (line.service_id && !find('services', line.service_id)) line.service_id = null;
        if (line.employee_id) get('employees', line.employee_id, 'Сотрудник');
        ins('order_works', { ...line, order_id: id, sort: i });
      });
    }
    if (Array.isArray(d.parts)) {
      S.order_parts = S.order_parts.filter((p) => p.order_id !== id);
      d.parts.forEach((p, i) => {
        const line = conv(p, { name: 'str', sku: 'str', qty: 'num', price: 'num', buy_price: 'num', part_id: 'int' });
        if (!line.name) return;
        if (line.part_id) {
          const part = find('parts', line.part_id);
          if (!part) line.part_id = null;
          else if (!line.buy_price) line.buy_price = part.buy_price;
        }
        ins('order_parts', { ...line, order_id: id, sort: i });
      });
    }
    applyStock(before, stockEffect(id, status));
    const carId = data.car_id || old.car_id;
    if (carId) {
      const upd = conv(d, { car_next_service_date: 'date', car_next_service_km: 'int' });
      const car = find('cars', carId);
      for (const [k, v] of Object.entries(upd)) car[k.slice(4)] = v;
      raiseMileage(carId, data.mileage);
    }
  }

  route('GET', '/orders', 'staff', (req) => {
    const preds = [];
    let outer = () => true;
    const status = req.q('status');
    if (status === 'active') preds.push((o) => ACTIVE.includes(o.status));
    else if (status === 'debt') { preds.push((o) => o.status === 'done'); outer = hasDebt; }
    else if (ORDER_STATUSES.includes(status)) preds.push((o) => o.status === status);
    const q = req.q('q').trim();
    if (q) {
      const num = q.replace(/^[№#]+/, '').trim();
      const isNum = /^\d+$/.test(num);
      preds.push((o) => (isNum && o.id === Number(num)) || clientMatches(find('clients', o.client_id), q));
    }
    const from = toDate(req.q('from'), 'с');
    const to = toDate(req.q('to'), 'по');
    if (from) preds.push((o) => o.created_at >= from);
    if (to) preds.push((o) => o.created_at < addDays(to, 1));
    const items = ordersQuery((o) => preds.every((p) => p(o)), outer, Number(req.q('limit')) || 300);
    const counts = {};
    for (const o of S.orders) counts[o.status] = (counts[o.status] || 0) + 1;
    counts.active = sum(ACTIVE, (s) => counts[s] || 0);
    counts.debt = ordersQuery((o) => o.status === 'done', hasDebt, 1e9).length;
    return { items, counts };
  });
  route('POST', '/orders', 'staff', (req) => {
    const d = req.body;
    const [clientId, carId] = ensureClientCar(d);
    const extra = conv(d, { complaint: 'str', mileage: 'int', master_id: 'int' });
    if (extra.master_id) get('employees', extra.master_id, 'Сотрудник');
    const o = ins('orders', { client_id: clientId, car_id: carId, status: 'new', created_by: req.user.id, ...extra });
    if (carId) raiseMileage(carId, extra.mileage);
    const appt = find('appointments', d.appointment_id);
    if (appt) Object.assign(appt, { order_id: o.id, status: 'arrived' });
    return { id: o.id };
  });
  route('GET', '/orders/(\\d+)', 'staff', (req, id) => orderFull(id));
  route('PUT', '/orders/(\\d+)', 'staff', (req, id) => { saveOrder(id, req.body); return orderFull(id); });
  route('DELETE', '/orders/(\\d+)', 'admin', (req, id) => {
    const o = get('orders', id, 'Заказ-наряд');
    applyStock(stockEffect(id, o.status), {});
    remove('orders', id);
    return { ok: true };
  });
  route('POST', '/orders/(\\d+)/payments', 'staff', (req, id) => {
    get('orders', id, 'Заказ-наряд');
    const amount = toNumber(req.body.amount, 'Сумма');
    if (!amount) throw new ApiError(400, 'Укажите сумму');
    const method = PAY_METHODS.includes(req.body.method) ? req.body.method : 'cash';
    ins('payments', { order_id: id, amount: round2(amount), method, note: str(req.body.note), user_id: req.user.id });
    return paymentsOf(id);
  });
  route('DELETE', '/payments/(\\d+)', 'admin', (req, id) => {
    const p = get('payments', id, 'Оплата');
    remove('payments', id);
    return paymentsOf(p.order_id);
  });

  /* ----- запись ----- */
  const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  function parseStart(v) {
    v = str(v).replace('T', ' ').slice(0, 16);
    if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(v)) throw new ApiError(400, 'Укажите дату и время записи');
    return v;
  }
  function checkOverlap(start, duration, postId, excludeId = 0) {
    if (!postId) return;
    const s = toMin(start.slice(11));
    const e = s + duration;
    for (const a of S.appointments) {
      if (a.post_id !== postId || a.id === excludeId || a.start.slice(0, 10) !== start.slice(0, 10) || !['planned', 'arrived'].includes(a.status)) continue;
      const as = toMin(a.start.slice(11));
      if (as < e && s < as + a.duration) {
        throw new ApiError(409, `Пост занят: ${a.start.slice(11)} — ${find('clients', a.client_id)?.name || 'запись'}`, { code: 'overlap' });
      }
    }
  }
  function apptData(d) {
    const data = conv(d, { duration: 'int', post_id: 'int', description: 'str' });
    if ('status' in d) {
      if (!APPT_STATUSES.includes(d.status)) throw new ApiError(400, 'Неизвестный статус записи');
      data.status = d.status;
    }
    if (data.duration === null || data.duration === undefined) delete data.duration;
    else if (!(data.duration >= 5 && data.duration <= 1440)) throw new ApiError(400, 'Длительность от 5 минут до 24 часов');
    if (data.post_id) get('posts', data.post_id, 'Пост');
    return data;
  }
  route('GET', '/appointments', 'staff', (req) => {
    const from = toDate(req.q('from'), 'с') || today();
    const to = toDate(req.q('to'), 'по') || addDays(from, 1);
    return S.appointments.filter((a) => a.start >= from && a.start < to).sort((a, b) => ru(a.start, b.start)).map((a) => {
      const c = find('clients', a.client_id);
      const car = find('cars', a.car_id);
      return {
        ...a, client_name: c?.name ?? null, client_phone: c?.phone ?? null, make: car?.make ?? null, model: car?.model ?? null,
        plate: car?.plate ?? null, post_name: find('posts', a.post_id)?.name ?? null, order_status: find('orders', a.order_id)?.status ?? null,
      };
    });
  });
  route('POST', '/appointments', 'staff', (req) => {
    const d = req.body;
    const start = parseStart(d.start);
    const data = apptData(d);
    if (data.duration === undefined) data.duration = 60;
    if (!d.force) checkOverlap(start, data.duration, data.post_id);
    const [clientId, carId] = ensureClientCar(d);
    return { id: ins('appointments', { ...data, start, client_id: clientId, car_id: carId }).id };
  });
  route('PUT', '/appointments/(\\d+)', 'staff', (req, id) => {
    const d = req.body;
    const a = get('appointments', id, 'Запись');
    const data = apptData(d);
    data.start = parseStart(d.start || a.start);
    const status = data.status ?? a.status;
    if (!d.force && ['planned', 'arrived'].includes(status)) {
      checkOverlap(data.start, data.duration ?? a.duration, 'post_id' in data ? data.post_id : a.post_id, id);
    }
    if (d.client_id || d.client) [data.client_id, data.car_id] = ensureClientCar(d);
    Object.assign(a, data);
    return { ok: true };
  });
  route('DELETE', '/appointments/(\\d+)', 'staff', (req, id) => { get('appointments', id, 'Запись'); remove('appointments', id); return { ok: true }; });
  route('POST', '/appointments/(\\d+)/order', 'staff', (req, id) => {
    const a = get('appointments', id, 'Запись');
    if (a.order_id) return { id: a.order_id };
    if (!a.client_id) throw new ApiError(400, 'В записи не указан клиент');
    const o = ins('orders', { client_id: a.client_id, car_id: a.car_id, status: 'new', complaint: a.description, created_by: req.user.id });
    Object.assign(a, { order_id: o.id, status: 'arrived' });
    return { id: o.id };
  });

  /* ----- главная и отчёты ----- */
  route('GET', '/dashboard', 'staff', (req) => {
    const t = today();
    const tomorrow = addDays(t, 1);
    const active = ordersQuery((o) => ACTIVE.includes(o.status), () => true, 100);
    const debts = ordersQuery((o) => o.status === 'done', hasDebt, 1e9);
    const result = {
      active_orders: active,
      active_count: active.length,
      ready_count: active.filter((o) => o.status === 'ready').length,
      appointments: S.appointments.filter((a) => a.start >= t && a.start < tomorrow).sort((a, b) => ru(a.start, b.start)).map((a) => {
        const c = find('clients', a.client_id);
        const car = find('cars', a.car_id);
        return { ...a, client_name: c?.name ?? null, client_phone: c?.phone ?? null, make: car?.make ?? null, model: car?.model ?? null, plate: car?.plate ?? null, post_name: find('posts', a.post_id)?.name ?? null };
      }),
      reminders: S.cars.filter((x) => x.next_service_date && x.next_service_date <= addDays(t, 14)).sort((a, b) => ru(a.next_service_date, b.next_service_date)).slice(0, 30).map((x) => {
        const c = find('clients', x.client_id);
        return { car_id: x.id, make: x.make, model: x.model, plate: x.plate, next_service_date: x.next_service_date, next_service_km: x.next_service_km, mileage: x.mileage, client_id: c.id, client_name: c.name, phone: c.phone };
      }),
      low_stock: S.parts.filter((p) => p.min_qty > 0 && p.qty <= p.min_qty).sort((a, b) => (a.qty - a.min_qty) - (b.qty - b.min_qty)).slice(0, 15),
      debt_count: debts.length,
    };
    if (req.user.role === 'admin') {
      const paidSince = (since) => round2(sum(S.payments.filter((p) => p.created_at >= since), (p) => p.amount));
      result.revenue_today = paidSince(t);
      result.revenue_month = paidSince(t.slice(0, 8) + '01');
      result.debt_total = round2(sum(debts, (o) => o.debt));
    }
    return result;
  });
  route('GET', '/reports', 'admin', (req) => {
    const start = toDate(req.q('from'), 'с') || today().slice(0, 8) + '01';
    const endIncl = toDate(req.q('to'), 'по') || today();
    const end = addDays(endIncl, 1);
    const inRange = (s) => s && s >= start && s < end;
    const pays = S.payments.filter((p) => inRange(p.created_at));
    const byMethod = {};
    const byDay = {};
    for (const p of pays) {
      byMethod[p.method] = byMethod[p.method] || { method: p.method, cnt: 0, amount: 0 };
      byMethod[p.method].cnt += 1;
      byMethod[p.method].amount += p.amount;
      const day = p.created_at.slice(0, 10);
      byDay[day] = (byDay[day] || 0) + p.amount;
    }
    const closedPred = (o) => o.status === 'done' && inRange(o.closed_at);
    const closed = ordersQuery(closedPred, () => true, 1e9);
    const closedIds = new Set(closed.map((o) => o.id));
    const works = sum(closed, (o) => o.works_sum);
    const parts = sum(closed, (o) => o.parts_sum);
    const total = sum(closed, (o) => o.total);
    const partsCost = sum(S.order_parts.filter((p) => closedIds.has(p.order_id)), (p) => p.qty * p.buy_price);
    const mech = {};
    const top = {};
    for (const w of S.order_works) {
      if (!closedIds.has(w.order_id)) continue;
      const eid = w.employee_id ?? find('orders', w.order_id).master_id;
      const e = find('employees', eid);
      const key = eid ?? 'none';
      mech[key] = mech[key] || { employee_id: eid ?? null, name: e?.name ?? 'Не назначен', percent: e?.percent ?? 0, works_count: 0, amount: 0 };
      mech[key].works_count += 1;
      mech[key].amount += w.qty * w.price;
      top[w.name] = top[w.name] || { name: w.name, cnt: 0, amount: 0 };
      top[w.name].cnt += 1;
      top[w.name].amount += w.qty * w.price;
    }
    const mechanics = Object.values(mech).sort((a, b) => b.amount - a.amount).map((m) => ({ ...m, salary: round2(m.amount * m.percent / 100) }));
    return {
      from: start, to: endIncl,
      revenue: round2(sum(pays, (p) => p.amount)),
      payments: Object.values(byMethod).sort((a, b) => b.amount - a.amount),
      daily: Object.keys(byDay).sort().map((day) => ({ day, amount: byDay[day] })),
      orders_closed: closed.length,
      works_sum: round2(works), parts_sum: round2(parts), discount_sum: round2(works + parts - total), total: round2(total),
      avg_check: closed.length ? round2(total / closed.length) : 0,
      parts_cost: round2(partsCost), parts_margin: round2(parts - partsCost),
      mechanics, top_services: Object.values(top).sort((a, b) => b.amount - a.amount).slice(0, 15),
      new_clients: S.clients.filter((c) => inRange(c.created_at)).length,
    };
  });

  /* ---------- демо-данные (как demo.py, но с заведомо вымышленными телефонами) ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    const next = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    return {
      int,
      choice: (arr) => arr[int(0, arr.length - 1)],
      sample: (arr, k) => { const copy = [...arr]; const out = []; while (out.length < k && copy.length) out.push(copy.splice(int(0, copy.length - 1), 1)[0]); return out; },
    };
  }

    const employees = [['Иванов Пётр', 'Мастер-приёмщик', 5], ['Сидоров Николай', 'Автослесарь', 40], ['Григорьев Антон', 'Автоэлектрик', 40]]
      .map(([name, position, percent]) => ins('employees', { name, position, percent }).id);
    const services = [
      ['ТО', 'Замена масла в двигателе', 0.5, 900], ['ТО', 'Замена масляного фильтра', 0.2, 300], ['ТО', 'Замена воздушного фильтра', 0.2, 300],
      ['ТО', 'Замена салонного фильтра', 0.3, 450], ['ТО', 'Замена свечей зажигания (4 шт.)', 0.8, 1400],
      ['Тормоза', 'Замена передних тормозных колодок', 0.8, 1500], ['Тормоза', 'Замена задних тормозных колодок', 1.0, 1800],
      ['Тормоза', 'Замена тормозной жидкости', 0.7, 1200], ['Подвеска', 'Замена стойки стабилизатора', 0.5, 900],
      ['Подвеска', 'Замена амортизатора переднего', 1.2, 2200], ['Подвеска', 'Развал-схождение', 1.0, 2000],
      ['Рулевое', 'Замена рулевой рейки', 3.5, 7000], ['Рулевое', 'Замена наконечника рулевой тяги', 0.6, 1200],
      ['Диагностика', 'Компьютерная диагностика', 0.5, 1000], ['Диагностика', 'Диагностика ходовой части', 0.5, 800],
      ['Шиномонтаж', 'Шиномонтаж R15–R17 (4 колеса)', 1.0, 2400], ['Кондиционер', 'Заправка кондиционера', 0.7, 2500],
    ].map(([category, name, hours, price]) => ins('services', { category, name, hours, price }));
    const parts = [
      ['Масло моторное 5W-30, 4 л', 'SHL-5W30-4', 'Shell', 'шт', 12, 4, 2650, 3400, 'A1'], ['Фильтр масляный', 'W712/95', 'MANN', 'шт', 15, 5, 420, 650, 'A2'],
      ['Фильтр воздушный', 'C27009', 'MANN', 'шт', 8, 3, 680, 990, 'A2'], ['Фильтр салонный угольный', 'CUK2939', 'MANN', 'шт', 6, 3, 790, 1150, 'A3'],
      ['Свеча зажигания', 'BKR6E', 'NGK', 'шт', 24, 8, 290, 450, 'B1'], ['Колодки тормозные передние', 'GDB1550', 'TRW', 'компл', 4, 2, 2100, 3200, 'C1'],
      ['Колодки тормозные задние', 'GDB1551', 'TRW', 'компл', 1, 2, 1900, 2900, 'C1'], ['Тормозная жидкость DOT-4, 1 л', 'DOT4-1', 'ATE', 'шт', 10, 4, 520, 790, 'C2'],
      ['Стойка стабилизатора', 'JTS456', 'TRW', 'шт', 2, 2, 1100, 1700, 'D1'], ['Антифриз G12, 5 л', 'G12-5', 'Felix', 'шт', 5, 2, 980, 1450, 'A4'],
      ['Щётка стеклоочистителя 600 мм', '3397008', 'Bosch', 'шт', 7, 2, 650, 990, 'E1'], ['Лампа H7', '64210', 'Osram', 'шт', 0, 4, 280, 450, 'E2'],
    ].map(([name, sku, brand, unit, qty, min_qty, buy_price, price, location]) => ins('parts', { name, sku, brand, unit, qty: qty + 10, min_qty, buy_price, price, location }));
    const cars = [
      ['Смирнов Алексей', '+7 900 000-11-01', 'Toyota', 'Camry', 2018, 'А123ВС777', 'JTNB11HK0J3001234', 84500],
      ['Кузнецова Ольга', '+7 900 000-11-02', 'Kia', 'Rio', 2020, 'О456РК799', 'Z94C251BBLR123456', 41200],
      ['Попов Дмитрий', '+7 900 000-11-03', 'Volkswagen', 'Polo', 2016, 'Е789ТХ750', 'XW8ZZZ61ZGG012345', 132000],
      ['Васильев Игорь', '+7 900 000-11-04', 'Hyundai', 'Solaris', 2019, 'К321МН197', 'Z94K241CBKR654321', 67800],
      ['Новикова Елена', '+7 900 000-11-05', 'Skoda', 'Octavia', 2021, 'М654ОР777', 'XW8AN2NE5MH098765', 35600],
      ['Фёдоров Сергей', '+7 900 000-11-06', 'Lada', 'Vesta', 2022, 'Н987СТ750', 'XTAGFL110NY567890', 28900],
      ['Морозов Андрей', '+7 900 000-11-07', 'Renault', 'Duster', 2017, 'Р147УХ799', 'X7LHSRH8N58765432', 118300],
      ['ООО «Логистик Плюс»', '+7 900 000-11-08', 'Ford', 'Transit', 2019, 'Т258АВ777', 'Z6FXXXESGXKA11111', 156000],
    ].map(([name, phone, make, model, year, plate, vin, mileage], i) => {
      const created = fmtDT(new Date(Date.now() - (60 - i) * 864e5));
      const c = ins('clients', { name, phone, created_at: created });
      const car = ins('cars', { client_id: c.id, make, model, year, plate, vin, mileage, created_at: created });
      return [c.id, car.id, mileage];
    });

    const statuses = [...Array(9).fill('done'), 'ready', 'in_progress', 'in_progress', 'waiting_parts', 'new'];
    const complaints = ['Плановое ТО', 'Скрип при торможении', 'Стук в подвеске спереди', 'Горит Check Engine', 'Не холодит кондиционер', 'Замена резины на зимнюю'];
    statuses.forEach((status, n) => {
      const [clientId, carId, km] = cars[n % cars.length];

        o.closed_at = closed;

        ins('payments', { order_id: o.id, amount: n === 2 ? Math.round(total / 2) : total, method: rnd.choice(['cash', 'card', 'transfer']), created_at: closed, user_id: admin.id });

    for (const p of S.parts) if (['GDB1551', '64210'].includes(p.sku)) p.qty = 1;
    find('cars', cars[1][1]).next_service_date = addDays(today(), 5);
    find('cars', cars[4][1]).next_service_date = addDays(today(), -3);

    [[t, '09:30', 60, 0, 5, 'Плановое ТО-2'], [t, '11:00', 120, 1, 6, 'Замена передних амортизаторов'], [t, '14:00', 90, 0, 7, 'Диагностика, стук в подвеске'],

    ].forEach(([day, hhmm, duration, post, carN, description]) => {
      const [clientId, carId] = cars[carN];
      ins('appointments', { start: `${day} ${hhmm}`, duration, post_id: posts[post], client_id: clientId, car_id: carId, description });
    });
  }

  /* ---------- перехват fetch ---------- */
  S = load();
  if (S) S.settings = { ...DEFAULT_SETTINGS, ...S.settings }; // данные прошлой версии получают новые настройки
  else { seed(); save(); }

  const json = (status, data) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json; charset=utf-8' } });
  const realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (input, init = {}) {
    const url = typeof input === 'string' ? input : input && input.url;
    if (typeof url !== 'string' || !url.startsWith('/api/')) return realFetch(input, init);
    const u = new URL(url, 'http://demo.local');
    const method = String(init.method || 'GET').toUpperCase();
    let body = {};
    if (init.body) {
      try { body = JSON.parse(init.body); } catch { return Promise.resolve(json(400, { error: 'Некорректный JSON' })); }
    }
    if (!body || typeof body !== 'object' || Array.isArray(body)) body = {};
    const query = Object.fromEntries(u.searchParams);
    const req = {
      method, path: u.pathname.slice(4), body,
      q: (k) => (query[k] ?? ''),
      user: userPublic(S.users.find((x) => x.id === S.session && x.active)),
    };
    const snapshot = method === 'GET' ? null : JSON.stringify(S);
    let res;
    try {
      res = json(200, dispatch(req));
      if (snapshot) save();
    } catch (e) {
      if (snapshot) S = JSON.parse(snapshot); // как откат транзакции на сервере
      if (e instanceof ApiError) res = json(e.status, { error: e.message, ...e.extra });
      else { console.error(e); res = json(500, { error: 'Внутренняя ошибка' }); }
    }
    return new Promise((resolve) => setTimeout(() => resolve(res), 30));
  };

  window.CRM_DEMO = {
    channel: window.CRM_CHANNEL || 'stable',
    framed,
    memoryRouter: framed,
    reset() { seed(); save(); },
  };
}());

];

const PF_STATE = { sort: 'price', kind: 'all', fast: false };

function pfNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е'); }
function pfHash(str) {
  let h = 2166136261;
  for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function pfRand(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pfDigits(rnd, n) { let s = ''; for (let i = 0; i < n; i++) s += Math.floor(rnd() * 10); return s; }
function pfPlural(n, one, few, many) {
  const m10 = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const pfDays = (d) => (d === 0 ? 'сегодня' : d === 1 ? 'завтра' : `${d} дн.`);
const pfRound10 = (x) => Math.round(x / 10) * 10;
const pfCarTitle = (car) => [car.make, car.model, car.year].filter(Boolean).join(' ');
const pfLooksLikeArticle = (q) => /^[A-Za-z0-9][A-Za-z0-9\s.\-/]{3,}$/.test(q.trim()) && (q.match(/\d/g) || []).length >= 3;
const pfMarkup = () => Math.max(0, toNum(SETTINGS.parts_markup ?? 30));
const pfRetail = (price) => pfRound10(price * (1 + pfMarkup() / 100));
const pfDemoCatalog = () => String(SETTINGS.parts_demo_catalog) === '1';

/** Какие детали подходят под запрос: «стук спереди» → амортизатор, рычаг, стойка стабилизатора. */
function pfDetectTypes(query) {
  const q = ` ${pfNorm(query)} `;
  const scored = PF_TYPES.map((t) => {
    let score = 0;
    if (q.includes(pfNorm(t.name))) score += 10;
    for (const k of t.keys) if (q.includes(k)) score += k.length > 4 ? 2 : 1;
    // «перед» и «зад» только уточняют деталь, найденную по основному слову.
    if (score) for (const k of t.side || []) if (q.includes(k)) score += 1;
    return { t, score };
  }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
  if (!scored.length) return { main: null, related: [] };
  return { main: scored[0].t, related: scored.slice(1, 5).map((x) => x.t) };
}

/** Демонстрационный каталог: варианты детали и предложения поставщиков (детерминированно по машине и детали). */
function pfDemoParts(car, type) {
  const makeKey = car.make || 'Авто';
  const k = PF_CLASS[makeKey] ?? 1;
  const year = Number(car.year) || 2019;
  const ageK = Math.max(0.75, 1 - Math.max(0, 2024 - year) * 0.02);
  const seed = `${makeKey}|${car.model}|${year}|${type.id}`;
  const fit = `${[car.make, car.model].filter(Boolean).join(' ') || 'ваш автомобиль'} ${year - 3}–${year + 4}`;
  const brandList = [[car.make || 'Оригинал', 1, 'original'], ...type.brands];
  return brandList.map(([brand, share, kind = 'analog']) => {
    const rnd = pfRand(pfHash(`${seed}|${brand}`));
    const article = kind === 'original'
      ? `${pfDigits(rnd, 2)} ${pfDigits(rnd, 2)} ${pfDigits(rnd, 1)} ${pfDigits(rnd, 3)} ${pfDigits(rnd, 3)}`
      : `${brand.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase()}${pfDigits(rnd, 5)}`;
    const base = type.base * k * ageK * share;
    const count = 2 + Math.floor(rnd() * 3);
    const suppliers = [...PF_SUPPLIERS].sort(() => rnd() - 0.5).slice(0, count);
    const offers = suppliers.map((s) => {
      const days = s.days[0] + Math.floor(rnd() * (s.days[1] - s.days[0] + 1));
      return {
        supplier: s.name, rating: s.rating, note: s.note, days,
        qty: days === 0 ? 1 + Math.floor(rnd() * 4) : 2 + Math.floor(rnd() * 15),
        price: pfRound10(base * s.k * (0.94 + rnd() * 0.12)),
      };
    });
    return { brand, article, kind, fit, name: type.name, offers };
  });
}

function pfLinks(text, article) {
  const q = encodeURIComponent(text);
  const links = [];
  if (article) {
    const a = encodeURIComponent(article.replace(/\s+/g, ''));
    links.push(['Exist', `https://www.exist.ru/Price/?pcode=${a}`], ['ZZap', `https://www.zzap.ru/public/search.aspx#rawdata=${a}`]);
  }
  links.push(
    ['Авито', `https://www.avito.ru/rossiya/zapchasti_i_aksessuary?q=${q}`],
    ['Дром', `https://baza.drom.ru/sell_spare_parts/?query=${q}`],
    ['Яндекс Маркет', `https://market.yandex.ru/search?text=${q}`],
    ['Ozon', `https://www.ozon.ru/search/?text=${q}`],
  );
  return links;
}

/**
 * Подборщик. В заказ-наряде передаётся onAdd(lines) и машина заказа;
 * на отдельной странице выбранное добавляется в открытый заказ-наряд или создаёт новый.
 */
async function partsFinder(host, { car = null, clientId = null, carId = null, query = '', onAdd = null, orderId = null } = {}) {
  const st = {
    car: { make: car?.make || '', model: car?.model || '', year: car?.year || '', vin: car?.vin || '' },
    client: null, clientId, carId, query, type: null, related: [], parts: [], stock: [], loading: false,
  };
  if (clientId && !car) {
    try {
      const c = await api(`/clients/${clientId}`);
      st.client = { id: c.id, name: c.name, cars: c.cars };
      const chosen = c.cars.find((x) => x.id === carId) || c.cars[0];
      if (chosen) {
        Object.assign(st.car, { make: chosen.make, model: chosen.model, year: chosen.year || '', vin: chosen.vin });
        st.carId = chosen.id;
      }
    } catch { /* клиент не найден — подбор вручную */ }
  }
  const inOrder = !!onAdd;
  host.innerHTML = `<div class="pf">
    <div class="pf-top">
      <section class="card pf-car">
        <div class="card-head"><h2>Автомобиль</h2>${inOrder ? `<span class="muted small">из заказ-наряда №${orderId}</span>` : ''}</div>
        ${inOrder ? '' : `<div class="pf-client"></div>`}
        <div class="form-grid pf-car-grid">
          <label class="field"><span>Марка</span><input data-car="make" list="pf-makes" placeholder="BMW" autocomplete="off"></label>
          <label class="field"><span>Модель</span><input data-car="model" list="pf-models" placeholder="5 серии" autocomplete="off"></label>
          <label class="field"><span>Год</span><input data-car="year" inputmode="numeric" maxlength="4" placeholder="2019"></label>
          <label class="field"><span>VIN <span class="muted">(необязательно)</span></span><input data-car="vin" maxlength="17" style="text-transform:uppercase" autocomplete="off"></label>
        </div>
        <datalist id="pf-makes">${Object.keys(PF_MAKES).map((m) => `<option value="${esc(m)}">`).join('')}</datalist>
        <datalist id="pf-models"></datalist>
      </section>
      <section class="card pf-search">
        <h2 style="margin-bottom:10px">Что нужно заменить?</h2>
        <div class="pf-q"><input class="pf-input" enterkeyhint="search" autocomplete="off" placeholder="Например: рулевая рейка, стук спереди, ремень ГРМ или артикул">
          <button type="button" class="btn primary pf-go">${icon('search')}<span>Найти</span></button></div>
        <div class="pf-chips">${PF_POPULAR.map((id) => { const t = PF_TYPES.find((x) => x.id === id); return `<button type="button" class="chip" data-type="${t.id}">${esc(t.name)}</button>`; }).join('')}</div>
      </section>
    </div>
    <div class="pf-results"></div>
  </div>`;

  const res = $('.pf-results', host);
  const input = $('.pf-input', host);
  const carInputs = $$('[data-car]', host);
  const syncModels = () => { $('#pf-models', host).innerHTML = (PF_MAKES[st.car.make] || []).map((m) => `<option value="${esc(m)}">`).join(''); };
  const fillCar = () => { carInputs.forEach((i) => { i.value = st.car[i.dataset.car] ?? ''; }); syncModels(); };
  fillCar();
  input.value = st.query;

  // Машина клиента: поиск по телефону, имени или госномеру.
  function drawClient() {
    const box = $('.pf-client', host);
    if (!box) return;
    if (st.client) {
      const cars = st.client.cars || [];
      box.innerHTML = `<span class="pf-pill">${icon('users')} ${esc(st.client.name)}<button type="button" class="icon-btn" data-unpick title="Убрать клиента">${icon('x')}</button></span>
        ${cars.length > 1 ? cars.map((c) => `<button type="button" class="chip ${c.id === st.carId ? 'active' : ''}" data-pick-car="${c.id}">${esc(carLine(c))}</button>`).join('') : ''}`;
    } else {
      box.innerHTML = `<div class="search-wrap pf-client-search"><span class="search-ic">${icon('search')}</span>
        <input placeholder="Машина клиента: телефон, имя или госномер" autocomplete="off"></div>`;
      autocomplete($('input', box), {
        source: async (q) => (await api('/search', { query: { q } })).clients,
        render: clientItem,
        minLen: 2,
        onPick: (c) => {
          if (!c) return;
          st.client = { id: c.id, name: c.name, cars: c.cars };
          st.clientId = c.id;
          const first = c.cars?.[0];
          if (first) { st.carId = first.id; Object.assign(st.car, { make: first.make, model: first.model, year: first.year || '', vin: first.vin }); }
          fillCar();
          drawClient();
          if (st.type || st.query) search();
        },
      });
    }
  }
  drawClient();
  on(host, 'click', '[data-unpick]', () => {
    Object.assign(st, { client: null, clientId: null, carId: null, car: { make: '', model: '', year: '', vin: '' } });
    fillCar();
    drawClient();
  });
  on(host, 'click', '[data-pick-car]', (e, el) => {
    const c = st.client.cars.find((x) => x.id === +el.dataset.pickCar);
    st.carId = c.id;
    Object.assign(st.car, { make: c.make, model: c.model, year: c.year || '', vin: c.vin });
    fillCar();
    drawClient();
    if (st.type || st.query) search();
  });
  carInputs.forEach((i) => i.addEventListener('input', () => {
    st.car[i.dataset.car] = i.value.trim();
    if (i.dataset.car === 'make') syncModels();
    if (st.carId && i.dataset.car !== 'vin') {
      // Машину поменяли вручную — VIN прежней машины ей уже не подходит.
      st.car.vin = '';

  // Не <form>: подборщик живёт и внутри окна заказ-наряда, а вложенные формы браузер отбрасывает.
  const runSearch = () => { st.query = input.value.trim(); st.type = null; search(); };
