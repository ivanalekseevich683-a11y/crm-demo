      <div class="muted small">${esc(carLine(r))}${r.next_service_km ? ` · ТО на ${fmtNum(r.next_service_km)} км` : ''}</div></div>
      <div class="right small"><div class="${r.next_service_date < isoDate() ? 'neg' : ''}" style="${r.next_service_date < isoDate() ? 'color:var(--danger);font-weight:600' : ''}">${fmtDate(r.next_service_date)}</div>${phoneLink(r.phone)}</div></div>`).join('')}</div>`
    : '<div class="empty-sm">Никому не нужно напоминать в ближайшие 2 недели. Дату следующего ТО можно указать в заказ-наряде.</div>';
  const low = d.low_stock.length ? `<div class="list">${d.low_stock.map((p) => `
      <div class="list-item"><div class="main"><div class="title">${esc(p.name)}</div><div class="muted small">${esc([p.brand, p.sku].filter(Boolean).join(' · '))}</div></div>
      <div class="right"><b style="color:var(--danger)">${fmtNum(p.qty)} ${esc(p.unit)}</b><div class="muted small">мин. ${fmtNum(p.min_qty)}</div></div></div>`).join('')}</div>` : '<div class="empty-sm">Всё в наличии</div>';

  v.innerHTML = `
    <div class="page-head"><div><h1>${greeting()}, ${esc((ME.name || '').split(' ')[0])}</h1><div class="muted">${longDate(isoDate())}</div></div></div>
    <div class="kpis">
      ${kpi('В работе', d.active_count, 'заказ-нарядов', '#/orders?status=active', false, 'tool')}
      ${kpi('Готовы к выдаче', d.ready_count, 'можно звонить клиентам', '#/orders?status=ready', false, 'check')}
      ${kpi('Запись на сегодня', d.appointments.length, 'машин', '#/calendar', false, 'calendar')}
      ${can('finance.view') ? kpi('Выручка сегодня', money(d.revenue_today), `за месяц ${money(d.revenue_month)}`, '#/reports', false, 'chart') : ''}
      ${kpi('Долги клиентов', can('finance.view') ? money(d.debt_total) : d.debt_count, can('finance.view') ? `${d.debt_count} заказ-нарядов` : 'заказ-нарядов', '#/orders?status=debt', d.debt_count > 0, 'alert')}
      ${kpi('Ждём запчасти', d.purchases_open ?? 0, d.purchases_overdue ? `опаздывают: ${d.purchases_overdue}` : d.purchases_today ? `приедут сегодня: ${d.purchases_today}` : 'от поставщиков', '#/purchases', d.purchases_overdue > 0, 'truck')}
    </div>
    ${bays}
    <div class="grid-2">
      <section class="card"><div class="card-head"><h2>Запись на сегодня</h2><a href="#/calendar">Календарь →</a></div>${appts}</section>
      <section class="card"><div class="card-head"><h2>Заказ-наряды в работе</h2><a href="#/orders?status=active">Все →</a></div>${active}</section>
      <section class="card"><div class="card-head"><h2>Напомнить о ТО</h2></div>${reminders}</section>
      <section class="card"><div class="card-head"><h2>Заканчивается на складе</h2><a href="#/stock?low=1">Склад →</a></div>${low}</section>
    </div>`;
  on(v, 'click', '[data-appt]', (e, el) => { e.preventDefault(); apptDialog({ appt: d.appointments[+el.dataset.appt], onSaved: router }); });
  on(v, 'click', '[data-bay-post]', (e, el) => apptDialog({ date: isoDate(), postId: +el.dataset.bayPost, onSaved: router }));
  on(v, 'click', 'tr[data-href]', (e, el) => { if (!e.target.closest('a')) go(el.dataset.href); });
}

/** Подпись об оплате в списке: долг бывает только у выданной машины. */
function payState(o) {
  if (o.status === 'cancelled' || o.total <= 0) return '';
  if (o.debt <= 0.009) return '<span class="badge green">оплачен</span>';
  if (o.status === 'done') return `<span class="neg">долг ${money(o.debt)}</span>`;
  return o.paid > 0 ? `<span class="muted small">оплачено ${money(o.paid)}</span>` : '';
}

/* ======================= список заказ-нарядов ======================= */
async function viewOrders(v, params) {
  const f = { status: params.get('status') || 'active', q: params.get('q') || '', from: params.get('from') || '', to: params.get('to') || '' };
  const TABS = [['active', 'Активные'], ['new', 'Заявки'], ['diagnostics', 'Диагностика'], ['approval', 'Согласование'], ['in_progress', 'В работе'], ['waiting_parts', 'Ждут запчасти'], ['quality', 'ОТК'], ['ready', 'Готовы'], ['done', 'Выданы'], ['debt', 'Долги'], ['cancelled', 'Отменены'], ['all', 'Все']];
  v.innerHTML = `
    <div class="page-head"><h1>Заказ-наряды</h1><div class="actions"><button class="btn primary" data-act="new">${icon('plus')} Новый заказ-наряд</button></div></div>
    <div class="tabs"></div>
    <div class="toolbar">
      <input type="search" class="f-q" placeholder="№ заказа, клиент, телефон, госномер" value="${esc(f.q)}">
      <input type="date" class="f-from" value="${esc(f.from)}" title="Создан с">
      <input type="date" class="f-to" value="${esc(f.to)}" title="Создан по">
    </div>
    <section class="card"><div class="table-wrap res"><div class="loading">Загрузка…</div></div></section>`;
  async function load() {
    const qs = new URLSearchParams(Object.entries(f).filter(([, x]) => x)).toString();
    replaceHash(`#/orders${qs ? '?' + qs : ''}`);
    const r = await api('/orders', { query: { ...f, status: f.status === 'all' ? '' : f.status } });
    const total = Object.entries(r.counts).filter(([k]) => ORDER_STATUS[k]).reduce((s, [, n]) => s + n, 0);
    $('.tabs', v).innerHTML = TABS.map(([k, t]) => `<button class="tab ${f.status === k ? 'active' : ''}" data-tab="${k}">${t}<span class="cnt">${k === 'all' ? total : r.counts[k] || 0}</span></button>`).join('');
    $('.res', v).innerHTML = r.items.length ? `<table class="tbl stack st-orders"><thead><tr><th>№</th><th>Дата</th><th>Клиент</th><th>Автомобиль</th><th>Статус</th><th>Мастер</th><th class="right">Сумма</th><th class="right">Оплата</th></tr></thead><tbody>
      ${r.items.map((o) => `<tr class="click" data-href="#/orders/${o.id}">
        <td class="nowrap a-num"><b>№${o.id}</b><span class="m-only muted"> · ${fmtDate(o.created_at)}</span></td><td class="nowrap m-hide">${fmtDate(o.created_at)}</td>
        <td class="a-client"><div class="title">${esc(o.client_name)}</div><div class="muted small">${esc(o.client_phone)}</div></td>
        <td class="a-car"><div>${esc(carName(o))}</div>${plateHtml(o.plate)}</td>
        <td class="a-status">${badge(o.status)}</td><td class="m-hide">${esc(o.master_name || '')}</td>
        <td class="num-cell a-total"><b>${money(o.total)}</b></td>
        <td class="num-cell a-pay">${payState(o)}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Ничего не найдено</div>';
  }
  on(v, 'click', '[data-tab]', (e, el) => { f.status = el.dataset.tab; load(); });
  on(v, 'click', 'tr[data-href]', (e, el) => go(el.dataset.href));
  $('[data-act=new]', v).onclick = () => newOrderDialog();
  $('.f-q', v).addEventListener('input', debounce((e) => { f.q = e.target.value.trim(); load(); }, 300));
  $('.f-from', v).onchange = (e) => { f.from = e.target.value; load(); };
  $('.f-to', v).onchange = (e) => { f.to = e.target.value; load(); };
  await load();
}

/* ======================= заказ-наряд ======================= */
async function viewOrder(v, params, id) {
  const [o, emps, posts] = await Promise.all([api(`/orders/${id}`), getEmployees(), getPosts()]);
  ORDER_POSTS = posts;
  renderOrder(v, o, emps);
}

function renderOrder(v, o, emps) {
  const root = document.createElement('div');
  v.replaceChildren(root);
  const st = {
    status: o.status,
    mileage: o.mileage ?? '',
    complaint: o.complaint,
    recommendations: o.recommendations,
    master_id: o.master_id ?? '',
    discount: o.discount || 0,
    car_id: o.car_id ?? '',
    car_next_service_date: o.car?.next_service_date || '',
    car_next_service_km: o.car?.next_service_km ?? '',
    post_id: o.post_id ?? '',
    works: o.works.map((w) => ({ service_id: w.service_id, name: w.name, qty: w.qty, price: w.price, employee_id: w.employee_id ?? '',
      category: w.category, norm_hours: w.norm_hours, discount: w.discount || 0, custom_reason: w.custom_reason })),
    parts: o.parts.map((p) => ({
      part_id: p.part_id, name: p.name, sku: p.sku, qty: p.qty, price: p.price, buy_price: p.buy_price, unit: p.unit,
      avail: p.part_id != null && p.stock != null ? p.stock + (o.status !== 'cancelled' ? p.qty : 0) : null,
    })),
    payments: o.payments,
  };
  let dirty = false;
  LEAVE_GUARD = () => dirty;
  const empOpts = (sel) => [['', '—'], ...emps.filter((e) => e.active || String(e.id) === String(sel)).map((e) => [e.id, e.name])];
  const car = o.car;
  // Основной путь наряда (ТЗ 11.2); побочные статусы показываются на ближайшем шаге.
  const STEPS = [['new', 'Заявка'], ['accepted', 'Принят'], ['diagnostics', 'Диагностика'], ['approval', 'Согласование'],
    ['in_progress', 'В работе'], ['quality', 'ОТК'], ['ready', 'Готов'], ['done', 'Выдан']];
  const STEP_OF = { confirmed: 'new', approved: 'approval', waiting_parts: 'in_progress', paused: 'in_progress' };
  function stepper() {
    const nextBtns = (o.next_statuses || []).map((k) => `<button type="button" class="btn sm ${k === 'cancelled' ? 'danger' : ''}" data-step="${k}">${
      k === 'cancelled' ? 'Отменить' : (st.status === 'done' && k === 'ready') || (st.status === 'cancelled' && k === 'new') ? 'Вернуть: ' + ORDER_STATUS[k][0].toLowerCase() : '→ ' + esc(ORDER_STATUS[k][0])}</button>`).join('');
    if (st.status === 'cancelled') {
      return `<div class="stepper is-cancelled" data-current="cancelled"><span class="badge red">Заказ-наряд отменён</span>
        <span class="muted small">Запчасти со склада возвращены</span>${nextBtns}</div>`;
    }
    const cur = STEPS.findIndex(([k]) => k === (STEP_OF[st.status] || st.status));
    return `<div class="stepper" data-current="${st.status}" role="group" aria-label="Этап заказ-наряда">${STEPS.map(([k, label], i) => `
      <span class="step ${i < cur ? 'done' : i === cur ? 'current' : ''}" ${i === cur ? 'aria-current="step"' : ''}>
        <span class="step-dot">${i < cur ? icon('check') : i + 1}</span><span class="step-label">${label}</span></span>`).join('<span class="step-line" aria-hidden="true"></span>')}</div>
      <div class="status-row">${badge(st.status)} <span class="muted small">с ${fmtDT(o.status_changed_at)}</span><div class="status-next">${nextBtns}</div></div>`;
  }

  root.innerHTML = `
    <div class="page-head">
      <div><a href="#/orders" class="back">← Заказ-наряды</a>
        <h1>Заказ-наряд №${o.id} <span class="muted h-sub">от ${fmtDate(o.created_at)}</span></h1>
        <div class="order-car">${plateHtml(car?.plate, 'plate-lg')}<div><b>${esc(carName(car) || 'Автомобиль не указан')}</b>${car?.year ? ` <span class="muted">${car.year}</span>` : ''}<div class="muted small">${esc(o.client?.name || '')}</div></div></div></div>
      <div class="actions">
        <span class="dirty-flag" hidden>● не сохранено</span>
        <button class="btn" data-act="print" title="Печать">${icon('printer')}<span class="hide-sm">Печать</span></button>
        ${can('orders.delete') ? `<button class="btn danger" data-act="delete" title="Удалить">${icon('trash')}</button>` : ''}
        <button class="btn primary" data-act="save">${icon('save')} Сохранить</button>
      </div>
    </div>
    <section class="card stage-card">${stepper()}</section>
    <div class="order-grid">
      <div class="order-main">
        <section class="card">
          <div class="info-line">
            <div><div class="lbl">Клиент</div><div class="val"><a href="#/clients/${o.client_id}">${esc(o.client?.name)}</a></div><div class="small">${phoneLink(o.client?.phone)}</div></div>
            <div><div class="lbl">Автомобиль</div><div class="val">${esc(carName(car) || '—')} ${car?.year ? `<span class="muted">${car.year}</span>` : ''}</div>
              <div class="small muted">${car?.vin ? 'VIN ' + esc(car.vin) : ''}</div></div>
            ${o.closed_at ? `<div><div class="lbl">Выдан</div><div class="val">${fmtDT(o.closed_at)}</div></div>` : ''}
          </div>
          <div class="form-grid">
            ${o.client_cars.length > 1 ? `<label class="field"><span>Автомобиль клиента</span><select data-o="car_id">${opts([['', '—'], ...o.client_cars.map((x) => [x.id, carLine(x)])], st.car_id)}</select></label>` : ''}
            <label class="field"><span>Пробег, км</span><input data-o="mileage" inputmode="numeric" value="${esc(st.mileage)}"></label>
            <label class="field"><span>Мастер-приёмщик</span><select data-o="master_id">${opts(empOpts(st.master_id), st.master_id)}</select></label>
            <label class="field"><span>Пост</span><select data-o="post_id">${opts([['', '—'], ...ORDER_POSTS.map((p) => [p.id, p.name])], st.post_id)}</select></label>
            <label class="field wide"><span>Причина обращения / жалоба</span><textarea data-o="complaint" rows="2">${esc(st.complaint)}</textarea></label>
          </div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Работы</h2><span class="sum works-sum"></span></div>
          <table class="lines"><thead><tr><th>Наименование</th><th>Исполнитель</th><th>Н/ч</th><th>Кол-во</th><th>Цена</th><th>Скидка %</th><th class="right">Сумма</th><th></th></tr></thead>
          <tbody class="works-body" data-line="works"></tbody></table>
          <div class="add-line"><input class="add-work" placeholder="+ Добавить работу — начните вводить название из прайса" autocomplete="off"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Запчасти и материалы</h2><div class="head-actions"><button type="button" class="btn sm" data-act="find-part">${icon('tag')} Подобрать</button><span class="sum parts-sum"></span></div></div>
          <table class="lines"><thead><tr><th>Наименование</th><th>Артикул</th><th>Кол-во</th><th>Цена</th><th class="right">Сумма</th><th></th></tr></thead>
          <tbody class="parts-body" data-line="parts"></tbody></table>
          <div class="add-line"><input class="add-part" placeholder="+ Добавить запчасть — поиск по складу: название или артикул" autocomplete="off"></div>
          ${o.purchases?.length ? `<div class="pur-list"><div class="pur-title">${icon('truck')} Заказано у поставщиков</div>${o.purchases.map((p) => `
            <div class="pur-row"><div class="pur-main"><b>${esc(p.name)}</b><div class="muted small">${esc(p.supplier)} · ${fmtNum(p.qty)} шт · ${money(p.qty * p.price)}</div></div>
            <div class="pur-when ${arrivalClass(p)}">${esc(arrivalText(p))}</div>
            <div class="pur-act">${p.status === 'ordered' ? `<button type="button" class="btn sm primary" data-receive="${p.id}">Получено</button>` : purchaseBadge(p.status)}</div></div>`).join('')}</div>` : ''}
        </section>
        <section class="card"><h2 style="margin-bottom:8px">Фото</h2><div class="order-photos"></div></section>
        <section class="card recs-card"></section>
        <section class="card approvals-card"></section>
        <section class="card"><div class="card-head"><h2>Документы</h2>${o.status === 'done' && can('warranty.edit') ? `<a class="btn sm ghost" href="#/warranty?order=${o.id}">Гарантийное обращение</a>` : ''}</div><div class="order-docs"></div></section>
        <section class="card"><h2 style="margin-bottom:8px">Переписка по наряду</h2><div class="order-msgs"></div></section>
        <section class="card qc-card"></section>
        <section class="card">
          <h2 style="margin-bottom:12px">Рекомендации клиенту</h2>
          <div class="form-grid">
            <label class="field wide"><span>Рекомендации (попадут в печатный заказ-наряд)</span><textarea data-o="recommendations" rows="2" placeholder="Например: через 3 000 км заменить задние колодки">${esc(st.recommendations)}</textarea></label>
            ${car ? `<label class="field"><span>Следующее ТО — дата</span><input type="date" data-o="car_next_service_date" value="${esc(st.car_next_service_date)}"></label>
            <label class="field"><span>Следующее ТО — пробег, км</span><input data-o="car_next_service_km" inputmode="numeric" value="${esc(st.car_next_service_km)}"></label>` : ''}
          </div>
          ${car ? '<div class="hint" style="margin-top:8px">За 2 недели до даты ТО клиент появится на главной в списке «Напомнить о ТО».</div>' : ''}
        </section>
      </div>
      <aside class="order-side">
        <section class="card totals receipt"></section>
        <section class="card payments"></section>
        <section class="card"><h2 style="margin-bottom:8px">История статусов</h2><div class="status-log">${(o.status_log || []).map((l) => `
          <div class="log-item">${badge(l.to_status)}<div class="small muted">${fmtDT(l.at)}${l.user_name ? ' · ' + esc(l.user_name) : ''}</div>${l.reason ? `<div class="small">${esc(l.reason)}</div>` : ''}</div>`).join('') || '<div class="empty-sm">—</div>'}</div></section>
      </aside>
    </div>`;

  const worksBody = $('.works-body', root);
  const partsBody = $('.parts-body', root);
  const lineSum = (x) => round2(toNum(x.qty) * toNum(x.price) * (1 - Math.min(Math.max(toNum(x.discount), 0), 100) / 100));
  const calc = () => {
    const works = st.works.reduce((s, x) => s + lineSum(x), 0);
    const parts = st.parts.reduce((s, x) => s + lineSum(x), 0);
    const disc = Math.min(Math.max(toNum(st.discount), 0), 100);
    const total = round2((works + parts) * (1 - disc / 100));
    const paid = round2(st.payments.reduce((s, p) => s + p.amount, 0));
    return { works, parts, disc, total, discSum: round2(works + parts - total), paid, debt: round2(total - paid) };
  };
  const stockHint = (p) => {
    if (p.avail == null) return p.part_id ? '' : '<div class="stock-hint">не со склада</div>';
    const warn = toNum(p.qty) > p.avail;
    return `<div class="stock-hint ${warn ? 'warn' : ''}">${warn ? 'на складе только' : 'на складе:'} ${fmtNum(p.avail)} ${esc(p.unit || '')}</div>`;
  };
  const workRow = (w, i) => `<tr data-i="${i}">
      <td class="c-name"><input data-f="name" value="${esc(w.name)}">${w.service_id ? (w.category ? `<div class="stock-hint">${esc(w.category)}</div>` : '') : '<div class="stock-hint">не из прайса</div>'}</td>
      <td class="c-emp"><select data-f="employee_id">${opts(empOpts(w.employee_id), w.employee_id)}</select></td>
      <td class="c-qty muted">${w.norm_hours ? fmtNum(w.norm_hours) : ''}</td>
      <td class="c-qty"><input class="num" data-f="qty" inputmode="decimal" value="${esc(w.qty)}"></td>
      <td class="c-price"><input class="num" data-f="price" inputmode="decimal" value="${esc(w.price)}"></td>
      <td class="c-qty"><input class="num" data-f="discount" inputmode="decimal" value="${esc(w.discount || 0)}"></td>
      <td class="c-sum">${money(lineSum(w))}</td>
      <td class="c-del"><button type="button" class="icon-btn danger" data-del title="Убрать">${icon('x')}</button></td></tr>`;
  const partRow = (p, i) => `<tr data-i="${i}">
      <td class="c-name"><input data-f="name" value="${esc(p.name)}">${stockHint(p)}</td>
      <td class="c-sku"><input data-f="sku" value="${esc(p.sku)}"></td>
      <td class="c-qty"><input class="num" data-f="qty" inputmode="decimal" value="${esc(p.qty)}"></td>
      <td class="c-price"><input class="num" data-f="price" inputmode="decimal" value="${esc(p.price)}"></td>
      <td class="c-sum">${money(lineSum(p))}</td>
      <td class="c-del"><button type="button" class="icon-btn danger" data-del title="Убрать">${icon('x')}</button></td></tr>`;
  const emptyRow = (t, n = 6) => `<tr><td colspan="${n}" class="empty-sm">${t}</td></tr>`;

  function drawLines() {
    worksBody.innerHTML = st.works.map(workRow).join('') || emptyRow('Работы ещё не добавлены', 8);
    partsBody.innerHTML = st.parts.map(partRow).join('') || emptyRow('Запчасти не добавлены');
    drawTotals();
  }
  function drawTotals() {
    const t = calc();
    $('.works-sum', root).textContent = money(t.works);
    $('.parts-sum', root).textContent = money(t.parts);
    $('.totals', root).innerHTML = `
      <div class="receipt-head"><span>Итог</span><span>№${o.id}</span></div>
      <div class="row"><span>Работы</span><span>${money(t.works)}</span></div>
      <div class="row"><span>Запчасти</span><span>${money(t.parts)}</span></div>
      <div class="row"><span class="disc">Скидка <input data-o="discount" inputmode="decimal" value="${esc(st.discount)}"> %</span><span>${t.discSum ? '−' + money(t.discSum) : '—'}</span></div>
      <div class="row big"><span>Итого</span><span>${money(t.total)}</span></div>
      <div class="row"><span>Оплачено</span><span>${money(t.paid)}</span></div>
      ${t.debt > 0.009 ? `<div class="row debt"><span>К оплате</span><span>${money(t.debt)}</span></div>`
        : t.total > 0 ? `<div class="row paid-full"><span>Оплачено полностью</span><span>✓</span></div>` : ''}
      ${t.debt < -0.009 ? `<div class="row"><span class="muted">Переплата</span><span>${money(-t.debt)}</span></div>` : ''}`;
    $('.payments', root).innerHTML = `<div class="card-head"><h2>Оплаты</h2></div>
      ${st.payments.length ? st.payments.map((p) => `<div class="pay-item"><div><div><b>${money(p.amount)}</b> · ${esc(PAY[p.method] || p.method)}</div>
        <div class="muted small">${fmtDT(p.created_at)}${p.user_name ? ' · ' + esc(p.user_name) : ''}${p.note ? ' · ' + esc(p.note) : ''}</div></div>
        ${can('payments.delete') ? `<button type="button" class="icon-btn danger" data-delpay="${p.id}" title="Удалить оплату">${icon('x')}</button>` : ''}</div>`).join('') : '<div class="empty-sm">Оплат пока нет</div>'}
      <button type="button" class="btn primary" data-act="pay" style="width:100%;margin-top:10px">Принять оплату</button>
      ${can('payments.delete') && t.paid > 0 ? '<button type="button" class="btn ghost" data-act="refund" style="width:100%;margin-top:6px">Возврат клиенту</button>' : ''}`;
  }
  function markDirty() { dirty = true; $('.dirty-flag', root).hidden = false; }

  async function save(message = 'Сохранено') {
    const body = { ...st };
    delete body.payments;
    const fresh = await api(`/orders/${o.id}`, { method: 'PUT', body });
    dirty = false;
    toast(message);
    const y = window.scrollY;
    renderOrder(v, fresh, emps);
    window.scrollTo(0, y);
  }
  SAVE_HANDLER = save;

  on(root, 'input', 'tbody[data-line] [data-f]', (e, el) => {
    const tr = el.closest('tr');
    const item = st[tr.parentElement.dataset.line][+tr.dataset.i];
    item[el.dataset.f] = el.value;
    if (el.dataset.f === 'name') { item.service_id = null; }
    $('.c-sum', tr).textContent = money(lineSum(item));
    if (el.dataset.f === 'qty' && tr.parentElement.dataset.line === 'parts') {
      const hint = $('.stock-hint', tr);
      if (hint) hint.outerHTML = stockHint(item);
    }
    drawTotals();
    markDirty();
  });
  on(root, 'click', '[data-del]', (e, el) => {
    const tr = el.closest('tr');
    st[tr.parentElement.dataset.line].splice(+tr.dataset.i, 1);
    drawLines();
    markDirty();
  });
  on(root, 'input', '[data-o]', (e, el) => {
    st[el.dataset.o] = el.value;
    if (el.dataset.o === 'discount') {
      const t = calc();
      $('.totals .disc', root).nextElementSibling.textContent = t.discSum ? '−' + money(t.discSum) : '—';
      $('.totals .row.big span:last-child', root).textContent = money(t.total);
    }
    markDirty();
  });
  on(root, 'change', '[data-o="discount"]', () => drawTotals());

  async function setStatus(next) {
    if (next === st.status) return;
    if (next === 'done' && calc().debt > 0.009 && !await askConfirm(`Остаток к оплате ${money(calc().debt)}. Всё равно выдать автомобиль?`, { ok: 'Выдать' })) return;
    let reason = '';
    const needReason = ['cancelled', 'paused'].includes(next) || ['done', 'cancelled'].includes(st.status);
    if (needReason) {
      reason = await askReason(next === 'cancelled' ? 'Отмена заказ-наряда (запчасти вернутся на склад)' : `Перевод в «${ORDER_STATUS[next][0]}»`);
      if (reason === null) return;
    }
    if (dirty) {
      const body = { ...st };
      delete body.payments;
      await api(`/orders/${o.id}`, { method: 'PUT', body });
      dirty = false;
    }
    try {
      const fresh = await api(`/orders/${o.id}/status`, { method: 'POST', body: { status: next, reason } });
      toast(`Статус: ${ORDER_STATUS[next][0]}`);
      const y = window.scrollY;
      renderOrder(v, fresh, emps);
      window.scrollTo(0, y);
    } catch (e) {
      if (e.data?.code === 'qc_required') { toast(e.message); $('.qc-card', root).scrollIntoView({ behavior: 'smooth' }); return; }
      throw e;
    }
  }
  async function reload() {
    const fresh = await api(`/orders/${o.id}`);
    const y = window.scrollY;
    renderOrder(v, fresh, emps);
    window.scrollTo(0, y);
  }
  photoGallery($('.order-photos', root), { order_id: o.id, car_id: o.car_id }, { readOnly: !can('clients.edit') });
  approvalsBox($('.approvals-card', root), o.id, o.status);
  documentsBox($('.order-docs', root), 'order', o.id);
  messagesBox($('.order-msgs', root), { clientId: o.client_id, orderId: o.id, carId: o.car_id });
  // Рекомендации мастера (ТЗ 11.4)
  const recs = o.recommendation_items || [];
  $('.recs-card', root).innerHTML = `<div class="card-head"><h2>Рекомендации мастера</h2><button type="button" class="btn sm" data-act="rec-new">${icon('plus')} Добавить</button></div>
    ${recs.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Проблема</th><th>Приоритет</th><th>Работа</th><th class="right">Оценка</th><th>Статус</th><th></th></tr></thead><tbody>${recs.map((r) => `
      <tr><td>${esc(r.description)}${r.order_id !== o.id ? `<div class="hint">из наряда №${r.order_id || '—'} от ${fmtDate(r.created_at)}</div>` : `<div class="hint">${fmtDate(r.created_at)} · ${esc(r.author_name || '')}</div>`}</td>
      <td><span class="badge ${REC_PRIORITY[r.priority][1]}">${REC_PRIORITY[r.priority][0]}</span></td><td>${esc(r.work)}</td>
      <td class="num-cell">${r.estimate != null ? money(r.estimate) : ''}</td>
      <td><select data-rec-status="${r.id}">${opts(Object.entries(REC_STATUS), r.status)}</select></td>
      <td class="right"><button type="button" class="icon-btn" data-rec-edit="${r.id}">${icon('edit')}</button></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty-sm">Рекомендаций нет. Срочные и плановые работы, которые клиент не стал делать сейчас, сохранятся в истории автомобиля.</div>'}`;
  const recDialog = (r) => openModal({
    title: r ? 'Рекомендация' : 'Новая рекомендация',
    wide: true,
    buttons: r ? [{ label: icon('trash'), cls: 'danger', onClick: async () => { if (!await askConfirm('Удалить рекомендацию?')) return false; await api(`/recommendations/${r.id}`, { method: 'DELETE' }); reload(); } }] : [],
    body: `<div class="form-grid">${fText('Описание проблемы', 'description', r?.description, { rows: 2, ph: 'Износ передних колодок 80%' })}
      ${fSelect('Приоритет', 'priority', Object.entries(REC_PRIORITY).map(([k, [t]]) => [k, t]), r?.priority || 'recommended')}
      ${fInput('Предполагаемая работа', 'work', r?.work)}
      ${fNum('Ориентировочная стоимость, ₽', 'estimate', r?.estimate ?? '')}
      ${fInput('Сделать до', 'due_date', r?.due_date, { type: 'date' })}</div>`,
    onSubmit: async (d) => {
      await api(r ? `/recommendations/${r.id}` : '/recommendations', { method: r ? 'PUT' : 'POST', body: { ...d, order_id: o.id } });
      toast('Рекомендация сохранена');
      reload();
    },
  });
  $('[data-act=rec-new]', root).onclick = () => recDialog(null);
  on(root, 'click', '[data-rec-edit]', (e, el) => recDialog(recs.find((x) => x.id === +el.dataset.recEdit)));
  on(root, 'change', '[data-rec-status]', async (e, el) => {
    const r = recs.find((x) => x.id === +el.dataset.recStatus);
    await api(`/recommendations/${r.id}`, { method: 'PUT', body: { description: r.description, status: el.value } });
    toast('Статус рекомендации изменён');
  });
  // Контроль качества (ТЗ 11.5)
  const qc = o.qc;
  const qcOpen = ['in_progress', 'quality', 'waiting_parts', 'paused'].includes(st.status);
  $('.qc-card', root).innerHTML = `<div class="card-head"><h2>Контроль качества</h2>${qc ? `<span class="badge ${qc.passed ? 'green' : 'red'}">${qc.passed ? 'пройден' : 'не пройден'}</span>` : ''}</div>
    ${qc ? `<div class="small muted">${fmtDT(qc.at)} · ${esc(qc.user_name || '')}${qc.remarks ? ' · ' + esc(qc.remarks) : ''}</div>` : ''}
    ${qcOpen && can('qc.sign') ? `<form class="qc-form"><div class="qc-list">${Object.entries(QC_ITEMS).map(([k, t]) => `
      <div class="qc-row"><span>${t}</span><select name="${k}">${opts([['', '—'], ['ok', 'Проверено'], ['na', 'Не применимо'], ['fail', 'Есть замечание']], qc?.items?.[k] || '')}</select></div>`).join('')}</div>
      ${fText('Замечания', 'remarks', '', { rows: 2 })}<button class="btn primary" style="margin-top:8px">Подтвердить проверку</button></form>`
      : `<div class="hint">${st.status === 'quality' ? 'Нет права подписывать контроль качества.' : 'Чек-лист заполняется, когда работы выполнены (статус «Контроль качества»).'}</div>`}`;
  $('.qc-form', root)?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = formToObj(e.target);
    const remarks = d.remarks;
    delete d.remarks;
    const fresh = await api(`/orders/${o.id}/qc`, { method: 'POST', body: { items: d, remarks } });
    toast(fresh.qc.passed ? 'Контроль качества пройден' : 'Контроль не пройден: есть замечания');
    renderOrder(v, fresh, emps);
  });
  on(root, 'click', '[data-step]', (e, el) => setStatus(el.dataset.step));
  on(root, 'click', '[data-act=refund]', () => openModal({
    title: 'Возврат клиенту', submit: 'Оформить возврат',
    body: `<div class="form-grid">${fNum('Сумма, ₽', 'amount', '', { req: true })}${fSelect('Способ', 'method', Object.entries(PAY), 'cash')}${fText('Причина', 'reason', '', { rows: 2 })}</div>`,
    onSubmit: async (d) => { await api(`/orders/${o.id}/refunds`, { method: 'POST', body: d }); toast('Возврат оформлен'); reload(); },
  }));
  $('[data-act=save]', root).onclick = () => save();
  on(root, 'click', '[data-receive]', async (e, el) => {
    const p = o.purchases.find((x) => x.id === +el.dataset.receive);
    if (dirty) {
      const body = { ...st };
      delete body.payments;
      await api(`/orders/${o.id}`, { method: 'PUT', body });
      dirty = false;
    }
    await receivePurchase(p);
    const fresh = await api(`/orders/${o.id}`);
    const y = window.scrollY;
    renderOrder(v, fresh, emps);
    window.scrollTo(0, y);
  });
  $('[data-act=find-part]', root).onclick = () => {
    const m = openModal({ title: 'Подбор запчастей', size: 'xl', cancel: 'Закрыть', body: '<div class="pf-host"></div>' });
    partsFinder($('.pf-host', m.body), {
      car: o.car, clientId: o.client_id, carId: o.car_id, orderId: o.id,
      onAdd: async ({ part, work, waiting, ordered }) => {
        st.parts.push(part);
        if (work) st.works.push(work);
        if (waiting && ['approved', 'in_progress'].includes(st.status)) st.status = 'waiting_parts';
        m.close();
        await save(ordered ? 'Деталь заказана и добавлена в заказ-наряд' : 'Деталь добавлена в заказ-наряд');
      },
    });
  };
  $('[data-act=print]', root).onclick = async () => {
    if (dirty) await save();
    if (DEMO) go(`#/print/order/${o.id}`);
    else window.open(`#/print/order/${o.id}`, '_blank');
  };
  $('[data-act=delete]', root)?.addEventListener('click', async () => {
    if (!await askConfirm(`Удалить заказ-наряд №${o.id}? Запчасти вернутся на склад, оплаты будут удалены.`)) return;
    await api(`/orders/${o.id}`, { method: 'DELETE' });
    dirty = false;
    toast('Заказ-наряд удалён');
    go('#/orders');
  });
  on(root, 'click', '[data-act=pay]', () => {
    const debt = calc().debt;
    openModal({
      title: `Оплата по заказ-наряду №${o.id}`,
      submit: 'Принять оплату',
      body: `<div class="form-grid">${fNum('Сумма, ₽', 'amount', debt > 0 ? debt : '', { req: true })}
        ${fSelect('Способ оплаты', 'method', Object.entries(PAY), 'cash')}
        ${fInput('Комментарий', 'note', '', { cls: 'wide', ph: 'Необязательно' })}</div>`,
      onSubmit: async (d) => {
        // Сервер сверяет оплату с долгом, поэтому несохранённые работы и запчасти сохраняем сначала.
        if (dirty) {
          const body = { ...st };
          delete body.payments;
          await api(`/orders/${o.id}`, { method: 'PUT', body });
          dirty = false;
        }
        const r = await api(`/orders/${o.id}/payments`, { method: 'POST', body: d });
        st.payments = r.payments;
        drawTotals();
        toast('Оплата принята');
        if (calc().debt <= 0.009 && st.status === 'ready' && await askConfirm('Заказ-наряд оплачен полностью. Отметить как «Выдан»?')) {
          st.status = 'done';
          setTimeout(save, 0);
        }
      },
    });
  });
  on(root, 'click', '[data-delpay]', async (e, el) => {
    if (!await askConfirm('Удалить эту оплату?')) return;
    const r = await api(`/payments/${el.dataset.delpay}`, { method: 'DELETE' });
    st.payments = r.payments;
    drawTotals();
  });

  autocomplete($('.add-work', root), {
    source: (q) => api('/services', { query: { q, limit: 15 } }),
    render: (s) => `<div class="t">${esc(s.name)}</div><div class="s">${esc(s.category || 'Без категории')} · ${fmtNum(s.hours)} н/ч · ${money(s.price)}</div>`,
    footer: (q) => `+ «${q}» — своя работа, не из прайса`,
    onPick: (s, q) => {
      if (!s && !can('orders.custom_work')) { toast('Работы не из прайса может добавлять только сотрудник с правом на это'); return; }
      st.works.push(s ? { service_id: s.id, name: s.name, qty: 1, price: s.price, employee_id: '', category: s.category, norm_hours: s.hours, discount: 0 }
        : { service_id: null, name: q, qty: 1, price: toNum(SETTINGS.hour_price), employee_id: '', discount: 0 });
      $('.add-work', root).value = '';
      drawLines();
      markDirty();
      if (!s) $(`.works-body tr:last-child [data-f=price]`, root)?.select();
    },
  });
  autocomplete($('.add-part', root), {
    source: (q) => api('/parts', { query: { q, limit: 15 } }),
    render: (p) => `<div class="t">${esc(p.name)}</div><div class="s">${esc([p.brand, p.sku].filter(Boolean).join(' · '))} · <span style="${p.qty <= 0 ? 'color:var(--danger)' : ''}">остаток ${fmtNum(p.qty)} ${esc(p.unit)}</span> · ${money(p.price)}</div>`,
    footer: (q) => `+ «${q}» — без списания со склада`,
    onPick: (p, q) => {
      const same = p && st.parts.find((x) => x.part_id === p.id);
      if (same) same.qty = toNum(same.qty) + 1;
      else st.parts.push(p ? { part_id: p.id, name: p.name, sku: p.sku, qty: 1, price: p.price, buy_price: p.buy_price, unit: p.unit, avail: p.qty }
        : { part_id: null, name: q, sku: '', qty: 1, price: 0, buy_price: 0, avail: null });
      $('.add-part', root).value = '';
      drawLines();
      markDirty();
      if (!p) $(`.parts-body tr:last-child [data-f=price]`, root)?.select();
    },
  });

  drawLines();
}

/* ======================= запись (календарь) ======================= */
async function viewCalendar(v, params) {
  let day = params.get('date') || isoDate();
  const [allPosts, branches] = await Promise.all([getPosts(), cached('branches', '/branches')]);
  const active = branches.filter((b) => b.active);
  let branchId = ME.branch_id || +params.get('branch') || (active[0] || branches[0])?.id;
  const branch = () => branches.find((b) => b.id === branchId);
  let posts = [];
  const emps = await getEmployees();
  let mode = params.get('mode') === 'week' ? 'week' : 'day';
  const flt = { master_id: '', status: '', work_type: '' };
  let version = null;
  const ROW = 30;
  const SLOT = 30;
  v.innerHTML = `
    <div class="page-head"><div><h1>Запись на сервис</h1><div class="day-title muted" style="font-weight:500"></div></div>
      <div class="actions">
        <div class="date-nav">
          <button class="btn" data-d="-1" title="Предыдущий день">${icon('left')}</button>
          <input type="date" class="f-date" value="${day}">
          <button class="btn" data-d="1" title="Следующий день">${icon('right')}</button>
          <button class="btn" data-d="0">Сегодня</button>
        </div>
        <div class="seg"><button class="btn ${mode === 'day' ? 'primary' : ''}" data-mode="day">День</button><button class="btn ${mode === 'week' ? 'primary' : ''}" data-mode="week">Неделя</button></div>
        ${!ME.branch_id && active.length > 1 ? `<select class="f-branch">${opts(active.map((b) => [b.id, b.name]), branchId)}</select>` : ''}
        <button class="btn primary" data-act="new">${icon('plus')} Записать</button>
      </div></div>
    <div class="cal-filters">
      <select data-flt="master_id">${opts([['', 'Все мастера'], ...emps.filter((e) => e.active).map((e) => [e.id, e.name])], '')}</select>
      <select data-flt="status">${opts([['', 'Все статусы'], ...Object.entries(APPT_STATUS)], '')}</select>
      <input data-flt="work_type" placeholder="Вид работ" list="cal-work-types">
      <datalist id="cal-work-types">${['ТО', 'Диагностика', 'Ремонт ходовой', 'Шиномонтаж', 'Электрика'].map((x) => `<option value="${x}">`).join('')}</datalist>
    </div>
    <div class="cal-host"><div class="loading">Загрузка…</div></div>
    <p class="hint">Нажмите на свободное время, чтобы записать клиента. Нажмите на запись, чтобы изменить её или открыть заказ-наряд.</p>`;
  let items = [];
  async function load() {
    replaceHash(`#/calendar?date=${day}${mode === 'week' ? '&mode=week' : ''}${branchId && !ME.branch_id && active.length > 1 ? `&branch=${branchId}` : ''}`);
    $('.f-date', v).value = day;
    posts = branches.length > 1 ? allPosts.filter((p) => p.branch_id === branchId) : allPosts;
    const hours = branch()?.schedule?.[String(new Date(`${day}T12:00:00`).getDay() || 7)];
    $('.day-title', v).textContent = longDate(day) + (day === isoDate() ? ' — сегодня' : '') + (branch() && !hours ? ' · выходной' : '');
    const from = mode === 'week' ? addDays(day, -((new Date(`${day}T12:00:00`).getDay() + 6) % 7)) : day;
    items = await api('/appointments', { query: { from, to: addDays(from, mode === 'week' ? 7 : 1), branch_id: branches.length > 1 ? branchId : '', ...flt } });
    version = (await api('/appointments/version')).version;
    if (mode === 'week') drawWeek(from); else draw();
  }
  function cardText(a) {
    if (a.kind !== 'visit') return `<div class="t">${a.start.slice(11, 16)}–${fromMin(toMin(a.start.slice(11, 16)) + a.duration)} ${esc(APPT_KIND[a.kind])}</div>${a.description ? `<div class="muted">${esc(a.description)}</div>` : ''}`;
    return `<div class="t">${a.start.slice(11, 16)}–${fromMin(toMin(a.start.slice(11, 16)) + a.duration)} ${esc(a.client_name || '')}</div>
      <div class="cal-car">${carHtml(a)}</div>
      ${a.work_type || a.description ? `<div class="muted">${esc([a.work_type, a.description].filter(Boolean).join(' · '))}</div>` : ''}
      <div class="small">${esc(APPT_STATUS[a.status] || '')}${a.master_name ? ' · ' + esc(a.master_name) : ''}</div>
      ${a.order_id ? `<div style="margin-top:2px">${badge(a.order_status)} <span class="small">№${a.order_id}</span></div>` : ''}`;
  }
  function drawWeek(from) {
    const days = [...Array(7)].map((_, i) => addDays(from, i));
    $('.cal-host', v).innerHTML = `<div class="week">${days.map((d) => `<div class="week-day ${d === isoDate() ? 'today' : ''}"><h3>${esc(longDate(d))}</h3>
      ${items.filter((a) => a.start.slice(0, 10) === d).map((a) => `<div class="week-item cal-appt-w ${a.status}" data-id="${a.id}"><b>${a.start.slice(11, 16)}</b> ${esc(a.kind === 'visit' ? (a.client_name || '') : APPT_KIND[a.kind])}
        <div>${esc(carLine(a))}</div><div class="muted">${esc([a.post_name, a.work_type, a.master_name].filter(Boolean).join(' · '))}</div></div>`).join('') || '<div class="empty-sm">Свободно</div>'}</div>`).join('')}</div>`;
  }
  function draw() {
    const hours = branch()?.schedule?.[String(new Date(`${day}T12:00:00`).getDay() || 7)];
    let startMin = toMin(hours?.start || SETTINGS.work_start || '09:00');
    let endMin = toMin(hours?.end || SETTINGS.work_end || '20:00');
    if (endMin <= startMin) endMin = startMin + 600;
    for (const a of items) {
      const s = toMin(a.start.slice(11, 16));
      startMin = Math.min(startMin, Math.floor(s / 60) * 60);
      endMin = Math.max(endMin, Math.ceil((s + a.duration) / 60) * 60);
    }
    endMin = Math.min(endMin, 24 * 60);
    const known = new Set(posts.map((p) => p.id));
    const cols = posts.map((p) => ({ id: p.id, name: p.name }));
    if (!cols.length || items.some((a) => !known.has(a.post_id))) cols.push({ id: null, name: 'Без поста' });
    const times = [];
    for (let t = startMin; t < endMin; t += SLOT) times.push(t);
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    let html = `<div class="cal" style="--cols:${cols.length};--row:${ROW}px"><div class="cal-h"></div>${cols.map((c) => `<div class="cal-h">${esc(c.name)}</div>`).join('')}`;
    html += `<div class="cal-times">${times.map((t) => `<div class="cal-time">${t % 60 === 0 ? fromMin(t) : ''}</div>`).join('')}</div>`;
    for (const c of cols) {
      html += `<div class="cal-col" data-post="${c.id ?? ''}">${times.map((t) => `<div class="cal-slot ${(t + SLOT) % 60 === 0 ? 'hour' : ''}" data-time="${fromMin(t)}"></div>`).join('')}`;
      for (const a of items) {
        const col = known.has(a.post_id) ? a.post_id : null;
        if (col !== c.id) continue;
        const s = toMin(a.start.slice(11, 16));
        const top = ((s - startMin) / SLOT) * ROW;
        const h = Math.max((a.duration / SLOT) * ROW - 3, 24);
        const movable = can('appointments.edit') && ['planned', 'confirmed'].includes(a.status);
        html += `<div class="cal-appt ${a.status} kind-${a.kind}" data-id="${a.id}" ${movable ? 'draggable="true"' : ''} style="top:${top + 1}px;height:${h}px" title="${esc(`${a.client_name || APPT_KIND[a.kind]}\n${carLine(a)}\n${a.work_type || ''} ${a.description || ''}\n${a.duration} мин`)}">
          ${cardText(a)}</div>`;
      }
      if (day === isoDate() && nowMin >= startMin && nowMin <= endMin) html += `<div class="cal-now" style="top:${((nowMin - startMin) / SLOT) * ROW}px"></div>`;
      html += '</div>';
    }
    $('.cal-host', v).innerHTML = `<div class="cal-wrap">${html}</div></div>`;
  }
  on(v, 'click', '.cal-slot', (e, el) => {
    const post = el.closest('.cal-col').dataset.post;
    apptDialog({ date: day, time: el.dataset.time, postId: post ? +post : '', onSaved: load });
  });
  on(v, 'click', '.cal-appt, .cal-appt-w', (e, el) => apptDialog({ appt: items.find((a) => a.id === +el.dataset.id), onSaved: load }));
  // Перетаскивание записи на другое время или пост (ТЗ 10.2): проверки на сервере, перенос пишется в историю.
  let dragId = null;
  v.addEventListener('dragstart', (e) => { const el = e.target.closest?.('.cal-appt'); if (el) { dragId = +el.dataset.id; e.dataTransfer.effectAllowed = 'move'; } });
  v.addEventListener('dragover', (e) => { const slot = e.target.closest?.('.cal-slot'); if (slot && dragId) { e.preventDefault(); $$('.cal-slot.drop', v).forEach((x) => x.classList.remove('drop')); slot.classList.add('drop'); } });
  v.addEventListener('drop', async (e) => {
    const slot = e.target.closest?.('.cal-slot');
    if (!slot || !dragId) return;
    e.preventDefault();
    slot.classList.remove('drop');
    const a = items.find((x) => x.id === dragId);
    dragId = null;
    const post = slot.closest('.cal-col').dataset.post;
    const postName = posts.find((p) => String(p.id) === post)?.name || 'без поста';
    const time = slot.dataset.time;
    if (a.start.slice(11, 16) === time && String(a.post_id ?? '') === post) return;
    if (!await askConfirm(`Перенести «${a.client_name || APPT_KIND[a.kind]}» на ${time}, ${postName}?`, { ok: 'Перенести' })) return;
    const body = { start: `${day} ${time}`, post_id: post ? +post : null, duration: a.duration };
    try {
      await api(`/appointments/${a.id}`, { method: 'PUT', body });
    } catch (ex) {
      if (ex.data?.code === 'off_hours' && await askConfirm(`${ex.message}.\n\nВсё равно перенести?`)) await api(`/appointments/${a.id}`, { method: 'PUT', body: { ...body, force: true } });
      else { toast(ex.message); return; }
    }
    toast('Запись перенесена');
    load();
  });
  v.addEventListener('dragend', () => { dragId = null; $$('.cal-slot.drop', v).forEach((x) => x.classList.remove('drop')); });
  on(v, 'click', '[data-mode]', (e, el) => { mode = el.dataset.mode; $$('[data-mode]', v).forEach((b) => b.classList.toggle('primary', b === el)); load(); });
  on(v, 'change', '[data-flt]', (e, el) => { flt[el.dataset.flt] = el.value; load(); });
  // Обновление у всех сотрудников (ТЗ 10.4): сверка номера изменений каждые 10 секунд.
  const timer = setInterval(async () => {
    if (!document.body.contains(v.firstElementChild) || !location.hash.startsWith('#/calendar')) { clearInterval(timer); return; }
    if (document.querySelector('.modal-overlay') || document.hidden) return;
    try { const r = await api('/appointments/version'); if (version !== null && r.version !== version) load(); } catch { /* сеть вернётся */ }
  }, 10000);
  on(v, 'click', '[data-d]', (e, el) => { const d = +el.dataset.d; day = d ? addDays(day, d * (mode === 'week' ? 7 : 1)) : isoDate(); load(); });
  $('.f-date', v).onchange = (e) => { if (e.target.value) { day = e.target.value; load(); } };
  const fb = $('.f-branch', v);
  if (fb) fb.onchange = () => { branchId = +fb.value; load(); };
  $('[data-act=new]', v).onclick = () => apptDialog({ date: day, onSaved: load });
  await load();
}

  photoGallery($('.car-photos', v), { car_id: car.id }, { readOnly: !can('clients.edit') });
  documentsBox($('.car-docs', v), 'car', car.id);

    title: 'Сменить владельца',

    body: `<p class="hint" style="margin-top:0">История обслуживания останется у автомобиля. Прежний владелец сохранится в истории.</p>

    onSubmit: async () => {
      if (!picked) throw new Error('Выберите клиента из списка');
      await api(`/cars/${car.id}`, { method: 'PUT', body: { client_id: picked } });
      toast('Владелец изменён');
      onSaved();
    },
  });
  const res = $('[data-res]', m.body);
  let timer;
  $('[data-q]', m.body).oninput = (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    timer = setTimeout(async () => {
      const r = q.length >= 2 ? await api(`/search?q=${encodeURIComponent(q)}`) : { clients: [] };
      const list = r.clients.filter((x) => x.id !== car.client_id);
      res.innerHTML = list.map((x) => `<button type="button" class="list-item" data-id="${x.id}"><div class="main">${clientItem(x)}</div></button>`).join('')
        || (q.length >= 2 ? '<div class="empty-sm">Не найдено. Сначала создайте клиента.</div>' : '');
    }, 250);
  };
  on(res, 'click', '[data-id]', (e, el) => {
    picked = +el.dataset.id;
    $$('[data-id]', res).forEach((b) => b.classList.toggle('active', b === el));
  });
}

function serviceDialog(s, onSaved, categories) {
  const x = s || { hours: 1 };
  const buttons = s && can('catalog.delete') ? [{ label: icon('trash'), cls: 'danger', onClick: async () => {
    if (!await askConfirm(`Удалить «${s.name}» из прайса?`)) return false;
    await api(`/services/${s.id}`, { method: 'DELETE' });
    onSaved();
  } }] : [];
  openModal({
    title: s ? 'Услуга' : 'Новая услуга',
    buttons,
    body: `<div class="form-grid">
      ${fInput('Наименование', 'name', x.name, { req: true, cls: 'wide' })}
      ${fInput('Категория', 'category', x.category, { attrs: 'list="svc-cats"', ph: 'ТО, Тормоза, Подвеска…' })}
      ${fNum('Норма времени, н/ч', 'hours', x.hours)}
      ${fNum('Цена, ₽', 'price', x.price, { req: true })}</div>
      <datalist id="svc-cats">${categories.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
      <p class="hint">Стоимость нормо-часа в настройках: ${money(SETTINGS.hour_price)}. Норма × стоимость часа = ${money(toNum(x.hours) * toNum(SETTINGS.hour_price))}.</p>`,
    onSubmit: async (d) => {
      await api(s ? `/services/${s.id}` : '/services', { method: s ? 'PUT' : 'POST', body: d });
      toast('Сохранено');
      onSaved();
    },
  });
}

async function viewServices(v) {
  let q = '';
  v.innerHTML = `
    <div class="page-head"><h1>Услуги и цены</h1><div class="actions"><button class="btn primary" data-act="new">${icon('plus')} Новая услуга</button></div></div>
    <div class="toolbar"><input type="search" class="f-q" placeholder="Поиск по прайсу"></div>
    <section class="card"><div class="table-wrap res"><div class="loading">Загрузка…</div></div></section>`;
  let list = [];
  async function load() {
    list = await api('/services', { query: { q } });
    let cat = null;
    const body = list.map((s, i) => {
      let head = '';
      if (s.category !== cat) { cat = s.category; head = `<tr><td colspan="4" style="background:var(--surface-2);font-weight:650">${esc(cat || 'Без категории')}</td></tr>`; }
      return `${head}<tr class="click" data-i="${i}"><td>${esc(s.name)}</td><td class="num-cell">${fmtNum(s.hours)}</td><td class="num-cell">${money(s.price)}</td><td class="right"><span class="icon-btn">${icon('edit')}</span></td></tr>`;
    }).join('');
    $('.res', v).innerHTML = list.length ? `<table class="tbl"><thead><tr><th>Наименование</th><th class="right">Норма, н/ч</th><th class="right">Цена</th><th></th></tr></thead><tbody>${body}</tbody></table>`
      : `<div class="empty">${q ? 'Ничего не найдено' : 'Прайс пуст — добавьте услуги, чтобы быстро подставлять их в заказ-наряды'}</div>`;
  }
  const cats = () => [...new Set(list.map((s) => s.category).filter(Boolean))];
  on(v, 'click', 'tr[data-i]', (e, el) => serviceDialog(list[+el.dataset.i], load, cats()));
  $('[data-act=new]', v).onclick = () => serviceDialog(null, load, cats());
  $('.f-q', v).addEventListener('input', debounce((e) => { q = e.target.value.trim(); load(); }, 300));
  await load();
}

/* ======================= отчёты ======================= */
async function viewReports(v, params) {
  if (!can('reports.view')) { v.innerHTML = '<div class="empty">Отчёты недоступны для вашей роли</div>'; return; }
  const today = isoDate();
  const monthStart = today.slice(0, 8) + '01';
  const prevMonthEnd = addDays(monthStart, -1);
  const f = { from: params.get('from') || monthStart, to: params.get('to') || today };
  const d0 = new Date();
  const weekStart = addDays(today, -((d0.getDay() + 6) % 7));
  const PRESETS = [['Сегодня', today, today], ['Эта неделя', weekStart, today], ['Этот месяц', monthStart, today],
    ['Прошлый месяц', prevMonthEnd.slice(0, 8) + '01', prevMonthEnd], ['Этот год', today.slice(0, 4) + '-01-01', today]];
  v.innerHTML = `
    <div class="page-head"><h1>Отчёты</h1></div>
    <div class="toolbar">
      ${PRESETS.map(([t, a, b], i) => `<button class="tab" data-p="${i}" data-from="${a}" data-to="${b}">${t}</button>`).join('')}
      <input type="date" class="f-from" value="${f.from}"> — <input type="date" class="f-to" value="${f.to}">
    </div>
    <div class="res"><div class="loading">Загрузка…</div></div>`;
  async function load() {
    replaceHash(`#/reports?from=${f.from}&to=${f.to}`);
    $('.f-from', v).value = f.from;
    $('.f-to', v).value = f.to;
    $$('[data-p]', v).forEach((b) => b.classList.toggle('active', b.dataset.from === f.from && b.dataset.to === f.to));
    const r = await api('/reports', { query: f });
    const kpi = (l, val, sub = '') => `<div class="kpi"><div class="label">${l}</div><div class="value">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
    const table = (head, rows, empty) => (rows.length ? `<div class="table-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<div class="empty-sm">${empty}</div>`);
    $('.res', v).innerHTML = `
      <div class="kpis">
        ${kpi('Поступило денег', money(r.revenue), 'все оплаты за период')}
        ${kpi('Выдано машин', r.orders_closed, `средний чек ${money(r.avg_check)}`)}
        ${kpi('Работы', money(r.works_sum), 'по выданным заказ-нарядам')}
        ${kpi('Запчасти', money(r.parts_sum), `наценка ${money(r.parts_margin)}`)}
        ${kpi('Скидки', money(r.discount_sum))}
        ${kpi('Новых клиентов', r.new_clients)}
      </div>
      <div class="grid-2">
        <section class="card"><h2 style="margin-bottom:8px">Зарплата мастеров</h2>
          ${table('<th>Сотрудник</th><th class="right">Работ</th><th class="right">Сумма работ</th><th class="right">%</th><th class="right">Начислено</th>',
            r.mechanics.map((m) => `<tr><td class="title">${esc(m.name)}</td><td class="num-cell">${m.works_count}</td><td class="num-cell">${money(m.amount)}</td><td class="num-cell">${fmtNum(m.percent)}</td><td class="num-cell"><b>${money(m.salary)}</b></td></tr>`),
            'Нет выданных заказ-нарядов за период')}
          <p class="hint">Процент задаётся в карточке сотрудника. Считается от суммы работ без учёта скидки; если исполнитель не указан — по мастеру заказ-наряда.</p></section>
        <section class="card"><h2 style="margin-bottom:8px">Поступления по способам оплаты</h2>
          ${table('<th>Способ</th><th class="right">Платежей</th><th class="right">Сумма</th>',
            r.payments.map((p) => `<tr><td>${esc(PAY[p.method] || p.method)}</td><td class="num-cell">${p.cnt}</td><td class="num-cell">${money(p.amount)}</td></tr>`), 'Оплат не было')}</section>
        <section class="card"><h2 style="margin-bottom:8px">Популярные работы</h2>
          ${table('<th>Работа</th><th class="right">Раз</th><th class="right">Сумма</th>',
            r.top_services.map((s) => `<tr><td>${esc(s.name)}</td><td class="num-cell">${s.cnt}</td><td class="num-cell">${money(s.amount)}</td></tr>`), 'Нет данных')}</section>
        <section class="card"><h2 style="margin-bottom:8px">Поступления по дням</h2>
          ${table('<th>День</th><th class="right">Сумма</th>',
            r.daily.map((d) => `<tr><td>${fmtDate(d.day)}, ${WEEKDAYS[new Date(d.day + 'T00:00:00').getDay()]}</td><td class="num-cell">${money(d.amount)}</td></tr>`), 'Нет данных')}</section>
      </div>`;
  }
  on(v, 'click', '[data-p]', (e, el) => { f.from = el.dataset.from; f.to = el.dataset.to; load(); });
  $('.f-from', v).onchange = (e) => { if (e.target.value) { f.from = e.target.value; load(); } };
  $('.f-to', v).onchange = (e) => { if (e.target.value) { f.to = e.target.value; load(); } };
  await load();
}

      $('[data-sessions]', res).innerHTML = `<div class="table-wrap"><table class="tbl"><thead><tr><th>Устройство</th><th>IP</th><th>Вход</th><th>Активность</th><th></th></tr></thead><tbody>${list.map((x) => `

        <td class="nowrap">${fmtDT(x.created_at)}</td><td class="nowrap">${fmtDT(x.last_seen)}</td>

    };

      const box = $('[data-2fa]', res);
      const st = await api('/auth/2fa');
      if (st.enabled) {
        box.innerHTML = `<p>Включён: при входе нужен код из приложения.</p><form class="form-grid">${fInput('Пароль для отключения', 'password', '', { type: 'password', req: true, attrs: 'autocomplete="current-password"' })}
          <div><button class="btn">Отключить</button></div></form>`;

          e.preventDefault();
          await api('/auth/2fa/disable', { method: 'POST', body: formToObj(e.target) });
          toast('Двухфакторный вход отключён');
          draw2fa();
        };
        return;
      }
      box.innerHTML = `<p class="hint" style="margin-top:0">Кроме пароля при входе понадобится 6-значный код из приложения на телефоне (Яндекс Ключ, Google Authenticator и др.).</p>
        <button class="btn" data-act="2fa-setup">Включить</button>`;
      $('[data-act="2fa-setup"]', box).onclick = async () => {
        const r = await api('/auth/2fa/setup', { method: 'POST' });
        box.innerHTML = `<p>1. Добавьте ключ в приложение: на телефоне нажмите <a href="${esc(r.uri)}">открыть в приложении</a> или введите ключ вручную:</p>
          <p><code class="secret-key">${esc(r.secret.replace(/(.{4})/g, '$1 ').trim())}</code></p>
          <p>2. Введите код, который покажет приложение:</p>
          <form class="form-grid">${fInput('Код', 'code', '', { req: true, attrs: 'inputmode="numeric" autocomplete="one-time-code" maxlength="6"' })}
          <div><button class="btn primary">Подтвердить</button></div><div class="form-error wide" hidden></div></form>`;
        const f = $('form', box);
        f.onsubmit = async (e) => {
          e.preventDefault();
          try {
            await api('/auth/2fa/enable', { method: 'POST', body: formToObj(f) });
            toast('Двухфакторный вход включён');
            draw2fa();
          } catch (ex) { $('.form-error', f).textContent = ex.message; $('.form-error', f).hidden = false; }
        };
      };
    };
    await Promise.all([draw2fa(), drawSessions()]);
    on(res, 'click', '[data-end]', async (e, el) => {
      await api(`/auth/sessions/${el.dataset.end}`, { method: 'DELETE' });
      toast('Сеанс завершён');
      drawSessions();
    });
    const form = $('form', res);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const d = formToObj(form);
      const err = $('.form-error', form);
      try {
        if (d.new_password !== d.new_password2) throw new Error('Новые пароли не совпадают');
        await api('/auth/password', { method: 'PUT', body: d });
        form.reset();
        err.hidden = true;
        toast('Пароль изменён');
      } catch (ex) { err.textContent = ex.message; err.hidden = false; }
    };
  }
}

      <h1>${esc(tpl.title)} № ${o.id}</h1>
      <div class="center">от ${fmtDate(docDate)}${doc !== 'order' ? ` (к заказ-наряду № ${o.id} от ${fmtDate(o.created_at)})` : ''}</div>
      ${tpl.header ? `<p style="white-space:pre-line">${esc(tpl.header)}</p>` : ''}
      <table class="info" style="margin-top:14px"><tbody>
        <tr><td>Заказчик</td><td><b>${esc(o.client?.name)}</b>${o.client?.phone ? `, тел. ${esc(o.client.phone)}` : ''}</td></tr>
        <tr><td>Автомобиль</td><td><b>${esc(carName(car) || '—')}</b>${car.year ? `, ${car.year} г.` : ''}${car.color ? `, ${esc(car.color)}` : ''}</td></tr>
        <tr><td>Госномер / VIN</td><td>${esc(car.plate || '—')} / ${esc(car.vin || '—')}</td></tr>

        ${o.complaint ? `<tr><td>Причина обращения</td><td>${esc(o.complaint)}</td></tr>` : ''}

          : '<p>Замечаний нет.</p>'}
        ${doc === 'diagnostics' ? '<div class="block-title">Заключение мастера</div><div style="border-bottom:1px solid #999;height:24px"></div><div style="border-bottom:1px solid #999;height:24px"></div>' : ''}` : ''}
      ${doc === 'release' && o.qc ? `<div class="block-title">Контроль качества</div><p>${o.qc.passed ? 'Пройден' : 'Не пройден'} ${fmtDT(o.qc.at)}${o.qc.user_name ? ', ' + esc(o.qc.user_name) : ''}${o.qc.remarks ? '. Замечания: ' + esc(o.qc.remarks) : ''}</p>` : ''}
      ${['diagnostics', 'recommendations'].includes(doc) ? '' : `${o.works.length ? `<div class="block-title">Работы</div><table><thead><tr><th style="width:28px">№</th><th>Наименование</th><th class="right" style="width:60px">Кол-во</th><th class="right" style="width:95px">Цена</th><th class="right" style="width:105px">Сумма</th></tr></thead><tbody>${lineRows(o.works, false)}</tbody></table>` : ''}
      ${o.parts.length ? `<div class="block-title">Запчасти и материалы</div><table><thead><tr><th style="width:28px">№</th><th>Наименование</th><th style="width:110px">Артикул</th><th class="right" style="width:60px">Кол-во</th><th class="right" style="width:95px">Цена</th><th class="right" style="width:105px">Сумма</th></tr></thead><tbody>${lineRows(o.parts, true)}</tbody></table>` : ''}
      <table class="tot"><tbody>
        <tr><td>Работы:</td><td>${money(o.works_sum)}</td></tr>
        <tr><td>Запчасти и материалы:</td><td>${money(o.parts_sum)}</td></tr>
        ${discSum ? `<tr><td>Скидка ${fmtNum(o.discount)}%:</td><td>−${money(discSum)}</td></tr>` : ''}
        <tr class="grand"><td>Итого:</td><td>${money(o.total)}</td></tr>
        <tr><td>Оплачено:</td><td>${money(o.paid)}</td></tr>
        ${doc !== 'estimate' ? `<tr><td>Оплачено:</td><td>${money(o.paid)}</td></tr>
        ${o.debt > 0.009 ? `<tr><td><b>К оплате:</b></td><td><b>${money(o.debt)}</b></td></tr>` : ''}` : ''}
      </tbody></table>`}
      ${['order', 'act'].includes(doc) && o.recommendations ? `<div class="block-title">Рекомендации</div><div style="white-space:pre-line">${esc(o.recommendations)}</div>` : ''}
      ${doc === 'order' && s.warranty_text ? `<p style="margin-top:16px;font-size:11px">${esc(s.warranty_text)}</p>` : ''}
      ${tpl.footer ? `<p style="margin-top:16px;font-size:11px;white-space:pre-line">${esc(tpl.footer)}</p>` : ''}
      <div class="sign"><div>Исполнитель (подпись, ФИО)</div><div>Заказчик (подпись, ФИО)</div></div>
    </div>`;
  $('[data-act=print]', v)?.addEventListener('click', () => window.print());
  $('.doc-pick', v).onchange = (e) => go(`#/print/order/${o.id}?doc=${e.target.value}`);
}

/* ======================= запуск ======================= */
function initShell() {
  $$('[data-icon]').forEach((el) => { el.innerHTML = icon(el.dataset.icon); el.removeAttribute('data-icon'); });
  $('#logout').onclick = async () => {
    await api('/auth/logout', { method: 'POST' }).catch(() => {});
    ME = null;
    LEAVE_GUARD = null;
    showLogin();
  };
  $('#menu-btn').onclick = () => document.body.classList.toggle('menu-open');
  initPwa();
  $('#shade').onclick = () => document.body.classList.remove('menu-open');
  $('#quick-order').onclick = () => newOrderDialog();
  $('#quick-appt').onclick = () => apptDialog({});
  const gs = $('#global-search');
  autocomplete(gs, {
    source: async (q) => {
      const r = await api('/search', { query: { q } });
      return [...(r.order ? [{ ...r.order, __order: true }] : []), ...r.clients];
    },
    render: (it) => (it.__order ? `<div class="t">Заказ-наряд №${it.id}</div><div class="s">${esc(it.client_name)} · ${esc(ORDER_STATUS[it.status]?.[0] || '')}</div>` : clientItem(it)),
    onPick: (it) => {
      if (!it) return;
      gs.value = '';
      gs.blur();
      go(it.__order ? `#/orders/${it.id}` : `#/clients/${it.id}`);
    },
    minLen: 1,
  });
  window.addEventListener('hashchange', router);
  if (MEMORY_NAV) {
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#/"]');
      if (!a || e.defaultPrevented) return;
      e.preventDefault();
      go(a.getAttribute('href'));
    });
  }
  window.addEventListener('beforeunload', (e) => {
    if (LEAVE_GUARD?.()) { e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && SAVE_HANDLER && !$('.modal-overlay')) {
      e.preventDefault();
      SAVE_HANDLER();
    }
    if (e.key === '/' && !e.target.closest('input, textarea, select') && !$('.modal-overlay')) {
      e.preventDefault();
      gs.focus();
    }
  });
}

initShell();
boot();

</script>
</body>
</html>
