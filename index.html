<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МК Сервис — CRM (демо)</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Onest:wght@400;500;600;700&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff6b1a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Оформление «Мастерская»: графитовое меню, сигнальный оранжевый для главных действий,
   техничный Exo 2 для заголовков и цифр, Onest для текста, госномера как настоящие номерные знаки. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --border: #dde3e8;
  --border-strong: #c9d2d9;
  --text: #142029;
  --muted: #5c6a75;
  --accent: #ff6b1a;
  --accent-hover: #ff8338;
  --accent-ink: #1b1007;
  --accent-soft: #ffeadb;
  --accent-strong: #c2410c;
  --link: #b93d0c;
  --blue: #1d5fd1;
  --blue-soft: #e5eefc;
  --danger: #d92d20;
  --danger-soft: #fdeceb;
  --ok: #15803d;
  --ok-soft: #e3f5e9;
  --warn: #a15c07;
  --warn-soft: #fdf1dc;
  --info: #0e7490;
  --info-soft: #e0f4f8;
  --gray-soft: #eceff2;
  --side-bg: #121b22;
  --side-bg-2: #1a2730;
  --side-text: #a7b4bd;
  --side-hover: #1f2c36;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(18, 27, 34, .06), 0 2px 6px rgba(18, 27, 34, .05);
  --shadow-lg: 0 18px 40px rgba(18, 27, 34, .22);
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Exo 2", "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

/* Тёмная тема: по системной настройке и по явному выбору data-theme="dark". */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1116;
    --surface: #121b22;
    --surface-2: #17222b;
    --border: #23313c;
    --border-strong: #31424f;
    --text: #e7edf1;
    --muted: #93a3ae;
    --accent: #ff7a2e;
    --accent-hover: #ff9152;
    --accent-ink: #1b1007;
    --accent-soft: #3a2314;
    --accent-strong: #ff9a5c;
    --link: #ff9a5c;
    --blue: #6aa2ff;
    --blue-soft: #16264a;
    --danger: #f2655a;
    --danger-soft: #3a1d1f;
    --ok: #4ccb7f;
    --ok-soft: #12301f;
    --warn: #f0a24a;
    --warn-soft: #36270f;
    --info: #4cc3dc;
    --info-soft: #0f2d35;
    --gray-soft: #1c2832;
    --side-bg: #080d11;
    --side-bg-2: #101a21;
    --side-hover: #16222b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-lg: 0 18px 40px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1116;
  --surface: #121b22;
  --surface-2: #17222b;
  --border: #23313c;
  --border-strong: #31424f;
  --text: #e7edf1;
  --muted: #93a3ae;
  --accent: #ff7a2e;
  --accent-hover: #ff9152;
  --accent-ink: #1b1007;
  --accent-soft: #3a2314;
  --accent-strong: #ff9a5c;
  --link: #ff9a5c;
  --blue: #6aa2ff;
  --blue-soft: #16264a;
  --danger: #f2655a;
  --danger-soft: #3a1d1f;
  --ok: #4ccb7f;
  --ok-soft: #12301f;
  --warn: #f0a24a;
  --warn-soft: #36270f;
  --info: #4cc3dc;
  --info-soft: #0f2d35;
  --gray-soft: #1c2832;
  --side-bg: #080d11;
  --side-bg-2: #101a21;
  --side-hover: #16222b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-lg: 0 18px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 15px; margin: 0; font-weight: 650; }
h3 { font-size: 16px; margin: 0; font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.num-cell { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

.ic { width: 18px; height: 18px; flex: none; vertical-align: middle; }

/* ---------- каркас ---------- */
#app { display: flex; min-height: 100vh; }
#sidebar {
  width: 232px; flex: none; background: var(--side-bg); color: var(--side-text);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; color: #fff; font-weight: 650; font-size: 15px; }
.brand-logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; }
#nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; flex: 1; overflow-y: auto; }
#nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--side-text); font-weight: 500; }
#nav a:hover { background: var(--side-hover); text-decoration: none; color: #fff; }
#nav a.active { background: var(--accent); color: #fff; }
.user-box { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.08); color: #fff; }
.user-box .icon-btn { color: var(--side-text); }
.user-box .icon-btn:hover { background: var(--side-hover); color: #fff; }
#content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
#menu-btn { display: none; }
.search-wrap { position: relative; flex: 1; max-width: 520px; }
.search-wrap input { padding-left: 36px; }
.search-ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; pointer-events: none; }
.top-actions { display: flex; gap: 8px; margin-left: auto; }
#main { padding: 22px 24px 48px; max-width: 1440px; width: 100%; }
#shade { display: none; }

/* ---------- элементы ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 550; cursor: pointer;
  white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--gray-soft); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
  border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0;
}
.icon-btn:hover { background: var(--gray-soft); color: var(--text); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

input, select, textarea {
  width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--surface); color: var(--text); font: inherit; outline: none;
}
textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="checkbox"] { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 550; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 14px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-error { color: var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint.warn { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card + .card { margin-top: 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-head .sum { font-weight: 650; font-variant-numeric: tabular-nums; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.back { display: inline-block; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-2 > .card + .card { margin-top: 0; }
.loading, .empty { padding: 32px; text-align: center; color: var(--muted); }
.empty-sm { padding: 12px 0; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 550; }
.kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: 12.5px; color: var(--muted); }
.kpi.alert .value { color: var(--danger); }
a.kpi { color: inherit; display: block; }
a.kpi:hover { text-decoration: none; }

/* ---------- таблицы ---------- */
.table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl .title { font-weight: 600; }
.tbl .neg { color: var(--danger); font-weight: 600; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--gray-soft); color: var(--muted); }
.badge.blue { background: var(--accent-soft); color: var(--accent); }
.badge.orange { background: var(--warn-soft); color: var(--warn); }
.badge.green { background: var(--ok-soft); color: var(--ok); }
.badge.red { background: var(--danger-soft); color: var(--danger); }
.badge.teal { background: var(--info-soft); color: var(--info); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { border: 1px solid transparent; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; font: inherit; font-weight: 550; cursor: pointer; }
.tab:hover { background: var(--gray-soft); color: var(--text); }
.tab.active { background: var(--surface); border-color: var(--border-strong); color: var(--text); box-shadow: var(--shadow); }
.tab .cnt { color: var(--muted); font-weight: 500; margin-left: 4px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input[type="search"], .toolbar .grow { flex: 1; min-width: 200px; }
.toolbar input[type="date"] { width: 150px; }

.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.list-item .time { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 48px; }
.list-item .main { flex: 1; min-width: 0; }
.list-item .main .title { font-weight: 600; }
a.list-item { color: inherit; }
a.list-item:hover { text-decoration: none; background: var(--surface-2); }

/* ---------- заказ-наряд ---------- */
.order-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.order-side { position: sticky; top: 76px; }
.info-line { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-bottom: 14px; }
.info-line .lbl { font-size: 12px; color: var(--muted); }
.info-line .val { font-weight: 600; }
table.lines { width: 100%; border-collapse: collapse; }
.lines th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 6px 6px; white-space: nowrap; }
.lines td { padding: 4px 6px; vertical-align: top; }
.lines input, .lines select { height: 34px; }
.lines .c-qty { width: 82px; }
.lines .c-price { width: 112px; }
.lines .c-sum { width: 110px; text-align: right; padding-top: 11px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lines .c-emp { width: 170px; }
.lines .c-sku { width: 130px; }
.lines .c-del { width: 40px; }
.lines .stock-hint { font-size: 11.5px; color: var(--muted); padding: 2px 2px 0; }
.lines .stock-hint.warn { color: var(--warn); }
.lines input.num { text-align: right; }
.add-line { margin-top: 8px; position: relative; }
.add-line input { border-style: dashed; background: var(--surface-2); }
.totals .row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-variant-numeric: tabular-nums; }
.totals .row.big { font-size: 20px; font-weight: 700; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }
.totals .row.debt { color: var(--danger); font-weight: 650; }
.totals .row.paid-full { color: var(--ok); font-weight: 650; }
.totals .disc { display: flex; align-items: center; gap: 6px; }
.totals .disc input { width: 70px; height: 30px; text-align: right; }
.status-select { width: auto; font-weight: 600; }
.dirty-flag { color: var(--warn); font-weight: 600; font-size: 13px; }
.pay-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.pay-item:last-child { border-bottom: 0; }

/* ---------- автодополнение ---------- */
.ac-box {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60; background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-lg);
  max-height: 340px; overflow-y: auto; padding: 4px;
}
.ac-item { padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.ac-item.active { background: var(--accent-soft); }
.ac-item .t { font-weight: 600; }
.ac-item .s { font-size: 12.5px; color: var(--muted); }
.ac-item.footer { color: var(--accent-strong); font-weight: 550; border-top: 1px solid var(--border); border-radius: 0 0 7px 7px; }
.ac-empty { padding: 10px; color: var(--muted); }

/* ---------- выбор клиента ---------- */
.picker { margin-bottom: 14px; }
.picked { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); margin-bottom: 12px; }
.picked .t { font-weight: 650; }
.section-label { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 8px; }
.link-btn { border: 0; background: none; color: var(--link); font: inherit; font-weight: 550; cursor: pointer; padding: 0; }
.link-btn:hover { text-decoration: underline; }

/* ---------- модальные окна ---------- */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(10, 15, 28, .5);
  display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto;
  animation: fade .12s ease-out;
}
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; display: flex; flex-direction: column; }
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; }
.modal-body { padding: 16px 20px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 14px 14px; }
.modal-foot .spacer { flex: 1; }
@keyframes fade { from { opacity: 0; } }

#toasts { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 9px; box-shadow: var(--shadow-lg); font-weight: 550; transition: opacity .3s, transform .3s; max-width: 360px; }
.toast.error { background: var(--danger); color: #fff; }
.toast.hide { opacity: 0; transform: translateY(6px); }

/* ---------- календарь ---------- */
.cal-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.cal { display: grid; grid-template-columns: 58px repeat(var(--cols), minmax(170px, 1fr)); min-width: min-content; }
.cal-h { position: sticky; top: 0; z-index: 2; background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 10px; font-weight: 650; text-align: center; border-left: 1px solid var(--border); }
.cal-h:first-child { border-left: 0; }
.cal-times { border-right: 1px solid var(--border); }
.cal-time { height: var(--row); font-size: 11.5px; color: var(--muted); text-align: right; padding: 0 8px; transform: translateY(-7px); font-variant-numeric: tabular-nums; }
.cal-time:first-child { transform: none; padding-top: 2px; }
.cal-col { position: relative; border-left: 1px solid var(--border); }
.cal-col:nth-child(2) { border-left: 0; }
.cal-slot { height: var(--row); border-bottom: 1px dashed var(--border); cursor: pointer; }
.cal-slot.hour { border-bottom-style: solid; }
.cal-slot:hover { background: var(--accent-soft); }
.cal-appt {
  position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 5px 8px; overflow: hidden; cursor: pointer;
  background: var(--accent-soft); border-left: 4px solid var(--accent); font-size: 12.5px; line-height: 1.35;
  box-shadow: var(--shadow);
}
.cal-appt:hover { filter: brightness(.97); z-index: 3; }
.cal-appt .t { font-weight: 650; }
.cal-appt.arrived { background: var(--ok-soft); border-left-color: var(--ok); }
.cal-appt.no_show, .cal-appt.cancelled { background: var(--gray-soft); border-left-color: var(--muted); opacity: .75; text-decoration: line-through; }
.cal-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 4; pointer-events: none; }
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav input { width: 160px; }
.day-title { font-weight: 650; font-size: 15px; }

/* ---------- авторизация ---------- */
#auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card .brand { color: var(--text); padding: 0 0 16px; font-size: 18px; }
.auth-card form { display: flex; flex-direction: column; gap: 12px; }

/* ---------- печать ---------- */
#print-root { background: #fff; color: #000; min-height: 100vh; }
.print-bar { display: flex; gap: 8px; padding: 12px 16px; background: #f3f5f9; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
.doc { max-width: 800px; margin: 0 auto; padding: 32px 36px; font-size: 12.5px; color: #000; }
.doc h1 { font-size: 18px; text-align: center; margin: 18px 0 4px; }
.doc .center { text-align: center; }
.doc .company { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
.doc .company .name { font-size: 16px; font-weight: 700; }
.doc table { width: 100%; border-collapse: collapse; margin: 10px 0; }
.doc th, .doc td { border: 1px solid #555; padding: 4px 6px; text-align: left; vertical-align: top; }
.doc th { background: #eee; font-weight: 600; }
.doc .info td { border: 0; padding: 2px 6px 2px 0; }
.doc .info td:first-child { color: #444; width: 150px; }
.doc .tot { width: 300px; margin-left: auto; }
.doc .tot td { border: 0; padding: 2px 0; }
.doc .tot td:last-child { text-align: right; }
.doc .tot .grand td { font-size: 15px; font-weight: 700; border-top: 1px solid #000; padding-top: 4px; }
.doc .sign { display: flex; justify-content: space-between; gap: 40px; margin-top: 36px; }
.doc .sign div { flex: 1; border-top: 1px solid #000; padding-top: 4px; font-size: 11px; }
.doc .block-title { font-weight: 700; margin: 14px 0 2px; }
body.printing #app { display: none !important; }
body.printing #print-root { display: block !important; }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; }
  .print-bar, #toasts { display: none !important; }
  .doc { padding: 0; max-width: none; }
}

.m-only { display: none; }

/* ---------- подбор запчастей ---------- */
.modal.xl { max-width: 1120px; }
.head-actions { display: flex; align-items: center; gap: 12px; }
.pf { display: grid; gap: 16px; }
.pf .card + .card { margin-top: 0; }
.pf-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
.pf-car-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pf-client { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.pf-client-search { max-width: none; width: 100%; }
.pf-pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 2px 2px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pf-pill .icon-btn { width: 28px; height: 28px; color: var(--accent-strong); }
.pf-q { display: flex; gap: 8px; }
.pf-q input { height: 46px; font-size: 16px; }
.pf-q .btn { height: 46px; padding: 0 18px; }
.pf-chips, .pf-related { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pf-chips { margin-top: 12px; }
.chip { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent-strong); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pf-loading { display: flex; align-items: center; gap: 14px; }
.pf-spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: pf-spin .8s linear infinite; flex: none; }
@keyframes pf-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pf-spinner { animation-duration: 2.4s; } }
.pf-summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, auto) minmax(190px, auto); gap: 14px; align-items: stretch; }
.pf-title { font-size: 20px; margin-top: 2px; }
.pf-group { text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.pf-best { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; border-radius: 10px; padding: 12px 14px; background: var(--ok-soft); }
.pf-best.fast { background: var(--accent-soft); }
.pf-best .lbl { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ok); }
.pf-best.fast .lbl { color: var(--accent); }
.pf-best .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pf-best .btn { margin-top: 8px; }
.pf-toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.pf-seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--gray-soft); }
.pf-seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.pf-seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.pf-markup { margin-left: auto; }
.pf-part, .pf-stock { padding: 0; overflow: hidden; }
.pf-stock .card-head { padding: 14px 18px 0; margin-bottom: 4px; }
.pf-part-head { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.pf-part-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 650; font-size: 15px; }
.pf-article { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.pf-from { text-align: right; flex: none; }
.pf-from .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pf-offer { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto 104px; gap: 8px 16px; align-items: center; padding: 11px 18px; border-bottom: 1px solid var(--border); }
.pf-offer:last-child { border-bottom: 0; }
.pf-offer.cheapest { background: color-mix(in srgb, var(--ok-soft) 70%, transparent); }
.pf-offer .btn { width: 100%; }
.pf-sup .t { font-weight: 600; }
.pf-sup .s { font-size: 12.5px; color: var(--muted); }
.pf-rating { font-size: 12px; font-weight: 600; color: var(--warn); margin-left: 4px; }
.pf-meta { display: flex; flex-direction: column; }
.pf-days { font-weight: 600; }
.pf-days.today { color: var(--ok); }
.pf-price { text-align: right; font-variant-numeric: tabular-nums; }
.pf-price .v { font-weight: 700; font-size: 15px; }
.pf-price .s { font-size: 12px; color: var(--muted); }
.pf-links { display: flex; flex-wrap: wrap; gap: 8px; }
.pf-demo-note { display: flex; gap: 8px; align-items: flex-start; margin: 0; }
.pf-empty h2, .pf-connect h2 { margin-bottom: 6px; }
.pf-empty p, .pf-connect p { margin: 0 0 10px; max-width: 70ch; }
.pf-add-head { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 14px; }
.pf-add-head .t { font-weight: 650; }
@media (max-width: 900px) {
  .pf-top { grid-template-columns: 1fr; }
  .pf-summary { grid-template-columns: 1fr 1fr; }
  .pf-summary .pf-head { grid-column: 1 / -1; }
  .pf-markup { margin-left: 0; width: 100%; }
}
@media (max-width: 640px) {
  .pf-q .btn span { display: none; }
  .pf-summary { gap: 10px; }
  .pf-best { padding: 10px 12px; }
  .pf-best .val { font-size: 18px; }
  .pf-offer { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "sup price" "meta btn"; padding: 12px 14px; }
  .pf-offer .pf-sup { grid-area: sup; } .pf-offer .pf-price { grid-area: price; }
  .pf-offer .pf-meta { grid-area: meta; flex-direction: row; gap: 10px; align-items: baseline; }
  .pf-offer .btn { grid-area: btn; width: auto; }
  .pf-part-head { padding: 12px 14px; }
  .pf-stock .card-head { padding: 12px 14px 0; }
}

/* ---------- закупки ---------- */
.ok-text { color: var(--ok); font-weight: 600; }
.tbl .neg, span.neg { color: var(--danger); font-weight: 600; }
.pur-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 640px) {
  .pur-kpis { gap: 8px; }
  .pur-kpis .kpi { padding: 10px 12px; }
  .pur-kpis .kpi .label { font-size: 12px; }
  .pur-kpis .kpi .sub { display: none; }
}
.pur-list { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
.pur-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
.pur-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.pur-row:last-child { border-bottom: 0; }
.pur-when { font-size: 13px; white-space: nowrap; }
.pf-add-checks { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.pf-add-checks .check { align-items: flex-start; }
.pf-add-checks input[type="checkbox"] { margin-top: 2px; flex: none; }
.pf-add-checks input:disabled + * , .pf-add-checks .check:has(input:disabled) { color: var(--muted); }

/* ---------- демо-режим ---------- */
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 16px 24px 0; padding: 10px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--text); font-size: 13.5px; }
.demo-bar b { color: var(--warn); }

/* ---------- оформление «Мастерская» ---------- */
body { font-family: var(--font-body); font-size: 14.5px; }
a { color: var(--link); }
h1 { font-family: var(--font-display); font-size: 27px; font-weight: 800; letter-spacing: -.005em; line-height: 1.15; }
h2 { font-size: 15.5px; font-weight: 650; }
.h-sub { font-family: var(--font-body); font-weight: 500; font-size: 15px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

/* меню */
#sidebar {
  width: 244px;
  background:
    repeating-linear-gradient(135deg, rgba(255, 255, 255, .022) 0 2px, transparent 2px 9px) bottom / 100% 190px no-repeat,
    radial-gradient(130% 55% at 0% 0%, var(--side-bg-2), transparent 62%),
    var(--side-bg);
  border-right: 1px solid rgba(255, 255, 255, .04);
}
.brand { gap: 12px; padding: 20px 18px 16px; color: #fff; font-family: var(--font-display); font-size: 18px; font-weight: 800; letter-spacing: .01em; line-height: 1.1; }
.brand small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--side-text); margin-top: 3px; }
.brand-logo { width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font: 800 15px/1 var(--font-display); letter-spacing: -.02em; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); flex: none; }
.nav-label { padding: 14px 12px 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #64747f; }
.nav-label:first-child { padding-top: 4px; }
#nav { gap: 1px; padding: 4px 12px; }
#nav a { position: relative; padding: 9px 12px; border-radius: 10px; }
#nav a.active { background: var(--side-hover); color: #fff; }
#nav a.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
#nav a.active .ic { color: var(--accent); }
.user-box { justify-content: flex-start; gap: 10px; padding: 14px 16px; }
.user-box .who { flex: 1; min-width: 0; }
.user-box #user-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-box #user-role { color: var(--side-text); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #263540; color: var(--accent); font: 800 13px/1 var(--font-display); }

/* верхняя панель */
#topbar { background: color-mix(in srgb, var(--surface) 90%, transparent); }
.search-wrap input { height: 40px; border-radius: 12px; background: var(--surface-2); }

/* кнопки и поля */
.btn { height: 38px; border-radius: 10px; font-weight: 600; }
.btn.sm { height: 32px; border-radius: 9px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .14); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
input, select, textarea { border-radius: 10px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.chip.active { color: var(--accent-ink); }
.tab.active { background: var(--text); border-color: var(--text); color: var(--surface); box-shadow: none; }
.tab.active .cnt { color: inherit; opacity: .65; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.badge.blue { background: var(--blue-soft); color: var(--blue); }
.card { border-radius: var(--radius); }
.card-head h2 { display: flex; align-items: center; gap: 8px; }
.tbl th { font-size: 11px; letter-spacing: .07em; }
.tbl tr.click:hover td { background: color-mix(in srgb, var(--accent-soft) 40%, var(--surface)); }
.modal { border-radius: 16px; }
.modal-head h3 { font-family: var(--font-display); font-size: 19px; font-weight: 800; }
.pf-best.fast { background: var(--blue-soft); }
.pf-best.fast .lbl { color: var(--blue); }
.pf-title, .pf-best .val, .pf-from .v { font-family: var(--font-display); font-weight: 800; }
.pf-pill { color: var(--accent-strong); }

/* плитки с цифрами */
.kpi { position: relative; padding: 16px 18px; overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; }
a.kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(18, 27, 34, .1); border-color: var(--border-strong); }
.kpi-top { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.kpi-top .label { line-height: 1.3; }
.kpi-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent-strong); }
.kpi-ic .ic { width: 17px; height: 17px; }
.kpi .value { font-family: var(--font-display); font-size: 30px; font-weight: 800; margin-top: 10px; line-height: 1.05; }
.kpi.alert .kpi-ic { background: var(--danger-soft); color: var(--danger); }

/* номерной знак */
.plate {
  display: inline-flex; align-items: stretch; height: 22px; vertical-align: middle; flex: none;
  border: 1.5px solid #111; border-radius: 4px; background: #fff; color: #111; overflow: hidden;
  font: 700 12.5px/1 var(--font-body); letter-spacing: .03em; box-shadow: 0 1px 0 rgba(0, 0, 0, .12);
}
.plate-main { display: flex; align-items: center; padding: 0 5px; white-space: nowrap; }
.plate-main b { font-size: 14px; margin: 0 2px; font-weight: 800; }
.plate-reg { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 4px; border-left: 1.5px solid #111; font-size: 10px; font-weight: 800; }
.plate-reg i { display: flex; align-items: center; gap: 2px; font-style: normal; font-size: 5.5px; letter-spacing: .02em; margin-top: 1px; }
.plate-reg i::after { content: ""; width: 7px; height: 5px; background: linear-gradient(#fff 33%, #1c3fa8 33% 66%, #d52b1e 66%); outline: .5px solid #999; }
.plate-lg { height: 34px; border-width: 2px; border-radius: 6px; font-size: 18px; }
.plate-lg .plate-main { padding: 0 8px; }
.plate-lg .plate-main b { font-size: 22px; margin: 0 3px; }
.plate-lg .plate-reg { padding: 0 7px; border-left-width: 2px; font-size: 15px; }
.plate-lg .plate-reg i { font-size: 7.5px; }
.plate-lg .plate-reg i::after { width: 10px; height: 7px; }
.li-car, .bay-car, .cal-car { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* посты сейчас */
.bays { margin-bottom: 16px; }
.bays .card-head { margin-bottom: 10px; }
.bay-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.bay {
  position: relative; display: flex; flex-direction: column; gap: 8px; text-align: left; overflow: hidden;
  padding: 16px 16px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  box-shadow: var(--shadow); color: inherit; font: inherit; cursor: pointer; transition: transform .15s, border-color .15s;
}
.bay::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--ok); }
.bay.busy::before { background: var(--accent); }
.bay:hover { transform: translateY(-1px); border-color: var(--border-strong); }
.bay-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bay-name { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.bay-state { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; padding: 3px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
.bay.busy .bay-state { background: var(--accent-soft); color: var(--accent-strong); }
.bay-car { font-weight: 600; }
.bay-desc { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bay-bar { height: 6px; border-radius: 99px; background: var(--gray-soft); overflow: hidden; margin-top: auto; }
.bay-bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.bay-foot { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.bay-foot b { color: var(--text); }
.bay-free-text { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--ok); line-height: 1.1; }

/* заказ-наряд: машина и этапы */
.order-car { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.stage-card { padding: 12px; margin-bottom: 16px; }
.stage-card + .order-grid .card:first-child { margin-top: 0; }
.stepper { display: flex; align-items: center; gap: 6px; }
.step {
  flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px;
  border: 1px solid transparent; background: transparent; color: var(--muted); font: inherit; font-weight: 600; text-align: left; cursor: pointer;
}
.step:hover { background: var(--surface-2); color: var(--text); }
.step-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--gray-soft); color: var(--muted); font: 800 13px/1 var(--font-display); }
.step-dot .ic { width: 15px; height: 15px; stroke-width: 3; }
.step-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-line { flex: 0 0 18px; height: 2px; border-radius: 2px; background: var(--border-strong); }
.step.done { color: var(--text); }
.step.done .step-dot { background: var(--text); color: var(--surface); }
.step.current { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--text); }
.step.current .step-dot { background: var(--accent); color: var(--accent-ink); }
.step-cancel { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 8px 10px; border: 0; border-radius: 10px; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
.step-cancel:hover { background: var(--danger-soft); color: var(--danger); }
.stepper.is-cancelled { gap: 12px; flex-wrap: wrap; padding: 4px; }

/* итог как чек */
.receipt { position: relative; border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; padding-bottom: 20px; margin-bottom: 26px; }
.receipt::after {
  content: ""; position: absolute; left: -1px; right: -1px; bottom: -9px; height: 10px;
  background: radial-gradient(circle at 7px 0, var(--surface) 6.5px, transparent 7px) 0 0 / 14px 10px repeat-x;
}
.receipt-head { display: flex; justify-content: space-between; padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px dashed var(--border-strong); font: 700 11.5px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.totals .row.big { border-top: 1px dashed var(--border-strong); font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.order-side .receipt + .card { margin-top: 0; }

/* календарь */
.cal-h { font-family: var(--font-display); font-weight: 700; }
.cal-appt { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); }
.cal-appt.arrived { background: color-mix(in srgb, var(--ok-soft) 70%, var(--surface)); border-left-color: var(--ok); }
.cal-car .plate { height: 19px; font-size: 11px; }
.cal-car .plate-main b { font-size: 12.5px; }
.cal-car .plate-reg { font-size: 9px; }

/* вход */
#auth {
  background:
    repeating-linear-gradient(135deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 10px),
    radial-gradient(90% 70% at 15% 10%, var(--side-bg-2), transparent 60%),
    var(--side-bg);
}
.auth-card { padding: 28px; border: 0; box-shadow: var(--shadow-lg); }
.auth-card .brand { color: var(--text); padding: 0 0 18px; }

/* полоса демо-версии: «рабочая зона» */
.demo-bar {
  background: repeating-linear-gradient(-45deg, var(--warn-soft) 0 14px, color-mix(in srgb, var(--warn-soft) 55%, var(--surface)) 14px 28px);
  border: 1px solid color-mix(in srgb, var(--warn) 22%, transparent);
}

@media (prefers-reduced-motion: reduce) {
  .kpi, .bay { transition: none; }
  a.kpi:hover, .bay:hover { transform: none; }
}

/* ---------- адаптивность ---------- */
@media (max-width: 1100px) {
  .order-grid { grid-template-columns: 1fr; }
  .order-side { position: static; }
}
@media (max-width: 900px) {
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 90; transform: translateX(-100%); transition: transform .2s; }
  body.menu-open #sidebar { transform: none; }
  body.menu-open #shade { display: block; position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.4); }
  #menu-btn { display: inline-grid; }

// Демо без сервера: ответы API записаны с рабочей системы на демо-данных (demo/record.mjs).
(function () {
  const DATA = window.DEMO_API || {};
  const KEY = 'mk-demo-logged-out';
  const ME = DATA['/api/auth/me'];
  const realFetch = window.fetch.bind(window);
  const json = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
  const loggedOut = () => { try { return sessionStorage.getItem(KEY) === '1'; } catch { return false; } };
  const setOut = (v) => { try { v ? sessionStorage.setItem(KEY, '1') : sessionStorage.removeItem(KEY); } catch {} };
  const READONLY = 'Это демо-версия: изменения не сохраняются. В рабочей CRM действие выполнится.';
  window.fetch = async function (input, opts = {}) {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href);
    const i = url.pathname.indexOf('/api/');
    if (i < 0) return realFetch(input, opts);
    const p = url.pathname.slice(i);
    const method = (opts.method || 'GET').toUpperCase();
    await new Promise((r) => setTimeout(r, 60));
    if (p === '/api/auth/login') {
      let d = {}; try { d = JSON.parse(opts.body || '{}'); } catch {}
      if (d.login === 'admin' && d.password === 'admin123') { setOut(false); return json(200, { ok: true }); }
      return json(401, { error: 'В демо вход: admin / admin123' });
    }
    if (p === '/api/auth/logout') { setOut(true); return json(200, { ok: true }); }
    if (p === '/api/auth/me') return loggedOut() ? json(401, { error: 'Нужно войти' }) : json(200, ME);
    if (method !== 'GET') return json(409, { error: READONLY });
    const key = p + url.search;
    if (key in DATA) return json(200, DATA[key]);
    if (p in DATA) return json(200, DATA[p]);
    const near = Object.keys(DATA).find((k) => k.split('?')[0] === p);
    if (near) return json(200, DATA[near]);
    (window.__demoMiss = window.__demoMiss || []).push(key);
    return json(404, { error: 'В демо-версии нет данных для этого запроса' });
  };
})();

const PF_SUPPLIERS = [
  { name: 'Запчасть-Экспресс', rating: 4.9, k: 1.14, days: [0, 0], note: 'склад в городе' },
  { name: 'ДетальОпт', rating: 4.8, k: 1.0, days: [1, 2], note: 'доставка до сервиса' },

];

const PF_STATE = { sort: 'price', kind: 'all', fast: false };

function pfNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е'); }
function pfHash(str) {
  let h = 2166136261;
  for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function pfRand(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pfDigits(rnd, n) { let s = ''; for (let i = 0; i < n; i++) s += Math.floor(rnd() * 10); return s; }
function pfPlural(n, one, few, many) {
  const m10 = n % 10;
  const m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const pfDays = (d) => (d === 0 ? 'сегодня' : d === 1 ? 'завтра' : `${d} дн.`);
const pfRound10 = (x) => Math.round(x / 10) * 10;
const pfCarTitle = (car) => [car.make, car.model, car.year].filter(Boolean).join(' ');
const pfLooksLikeArticle = (q) => /^[A-Za-z0-9][A-Za-z0-9\s.\-/]{3,}$/.test(q.trim()) && (q.match(/\d/g) || []).length >= 3;
const pfMarkup = () => Math.max(0, toNum(SETTINGS.parts_markup ?? 30));
const pfRetail = (price) => pfRound10(price * (1 + pfMarkup() / 100));
const pfDemoCatalog = () => String(SETTINGS.parts_demo_catalog) === '1';

/** Какие детали подходят под запрос: «стук спереди» → амортизатор, рычаг, стойка стабилизатора. */
function pfDetectTypes(query) {
  const q = ` ${pfNorm(query)} `;
  const scored = PF_TYPES.map((t) => {
    let score = 0;
    if (q.includes(pfNorm(t.name))) score += 10;
    for (const k of t.keys) if (q.includes(k)) score += k.length > 4 ? 2 : 1;
    // «перед» и «зад» только уточняют деталь, найденную по основному слову.
    if (score) for (const k of t.side || []) if (q.includes(k)) score += 1;
    return { t, score };
  }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
  if (!scored.length) return { main: null, related: [] };
  return { main: scored[0].t, related: scored.slice(1, 5).map((x) => x.t) };
}

/** Демонстрационный каталог: варианты детали и предложения поставщиков (детерминированно по машине и детали). */
function pfDemoParts(car, type) {
  const makeKey = car.make || 'Авто';
  const k = PF_CLASS[makeKey] ?? 1;
  const year = Number(car.year) || 2019;
  const ageK = Math.max(0.75, 1 - Math.max(0, 2024 - year) * 0.02);
  const seed = `${makeKey}|${car.model}|${year}|${type.id}`;
  const fit = `${[car.make, car.model].filter(Boolean).join(' ') || 'ваш автомобиль'} ${year - 3}–${year + 4}`;
  const brandList = [[car.make || 'Оригинал', 1, 'original'], ...type.brands];
  return brandList.map(([brand, share, kind = 'analog']) => {
    const rnd = pfRand(pfHash(`${seed}|${brand}`));
    const article = kind === 'original'
      ? `${pfDigits(rnd, 2)} ${pfDigits(rnd, 2)} ${pfDigits(rnd, 1)} ${pfDigits(rnd, 3)} ${pfDigits(rnd, 3)}`
      : `${brand.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase()}${pfDigits(rnd, 5)}`;
    const base = type.base * k * ageK * share;
    const count = 2 + Math.floor(rnd() * 3);
    const suppliers = [...PF_SUPPLIERS].sort(() => rnd() - 0.5).slice(0, count);
    const offers = suppliers.map((s) => {
      const days = s.days[0] + Math.floor(rnd() * (s.days[1] - s.days[0] + 1));
      return {
        supplier: s.name, rating: s.rating, note: s.note, days,
        qty: days === 0 ? 1 + Math.floor(rnd() * 4) : 2 + Math.floor(rnd() * 15),
        price: pfRound10(base * s.k * (0.94 + rnd() * 0.12)),
      };
    });
    return { brand, article, kind, fit, name: type.name, offers };
  });
}

function pfLinks(text, article) {
  const q = encodeURIComponent(text);
  const links = [];
  if (article) {
    const a = encodeURIComponent(article.replace(/\s+/g, ''));
    links.push(['Exist', `https://www.exist.ru/Price/?pcode=${a}`], ['ZZap', `https://www.zzap.ru/public/search.aspx#rawdata=${a}`]);
  }
  links.push(
    ['Авито', `https://www.avito.ru/rossiya/zapchasti_i_aksessuary?q=${q}`],
    ['Дром', `https://baza.drom.ru/sell_spare_parts/?query=${q}`],
    ['Яндекс Маркет', `https://market.yandex.ru/search?text=${q}`],
    ['Ozon', `https://www.ozon.ru/search/?text=${q}`],
  );
  return links;
}

/**
 * Подборщик. В заказ-наряде передаётся onAdd(lines) и машина заказа;
 * на отдельной странице выбранное добавляется в открытый заказ-наряд или создаёт новый.
 */
async function partsFinder(host, { car = null, clientId = null, carId = null, query = '', onAdd = null, orderId = null } = {}) {
  const st = {
    car: { make: car?.make || '', model: car?.model || '', year: car?.year || '', vin: car?.vin || '' },
    client: null, clientId, carId, query, type: null, related: [], parts: [], stock: [], loading: false,
  };
  if (clientId && !car) {
    try {
      const c = await api(`/clients/${clientId}`);
      st.client = { id: c.id, name: c.name, cars: c.cars };
      const chosen = c.cars.find((x) => x.id === carId) || c.cars[0];
      if (chosen) {
        Object.assign(st.car, { make: chosen.make, model: chosen.model, year: chosen.year || '', vin: chosen.vin });
        st.carId = chosen.id;
      }
    } catch { /* клиент не найден — подбор вручную */ }
  }
  const inOrder = !!onAdd;
  host.innerHTML = `<div class="pf">
    <div class="pf-top">
      <section class="card pf-car">
        <div class="card-head"><h2>Автомобиль</h2>${inOrder ? `<span class="muted small">из заказ-наряда №${orderId}</span>` : ''}</div>
        ${inOrder ? '' : `<div class="pf-client"></div>`}
        <div class="form-grid pf-car-grid">
          <label class="field"><span>Марка</span><input data-car="make" list="pf-makes" placeholder="BMW" autocomplete="off"></label>
          <label class="field"><span>Модель</span><input data-car="model" list="pf-models" placeholder="5 серии" autocomplete="off"></label>
          <label class="field"><span>Год</span><input data-car="year" inputmode="numeric" maxlength="4" placeholder="2019"></label>
          <label class="field"><span>VIN <span class="muted">(необязательно)</span></span><input data-car="vin" maxlength="17" style="text-transform:uppercase" autocomplete="off"></label>
        </div>
        <datalist id="pf-makes">${Object.keys(PF_MAKES).map((m) => `<option value="${esc(m)}">`).join('')}</datalist>
        <datalist id="pf-models"></datalist>
      </section>
      <section class="card pf-search">
        <h2 style="margin-bottom:10px">Что нужно заменить?</h2>
        <div class="pf-q"><input class="pf-input" enterkeyhint="search" autocomplete="off" placeholder="Например: рулевая рейка, стук спереди, ремень ГРМ или артикул">
          <button type="button" class="btn primary pf-go">${icon('search')}<span>Найти</span></button></div>
        <div class="pf-chips">${PF_POPULAR.map((id) => { const t = PF_TYPES.find((x) => x.id === id); return `<button type="button" class="chip" data-type="${t.id}">${esc(t.name)}</button>`; }).join('')}</div>
      </section>
    </div>
    <div class="pf-results"></div>
  </div>`;

  const res = $('.pf-results', host);
  const input = $('.pf-input', host);
  const carInputs = $$('[data-car]', host);
  const syncModels = () => { $('#pf-models', host).innerHTML = (PF_MAKES[st.car.make] || []).map((m) => `<option value="${esc(m)}">`).join(''); };
  const fillCar = () => { carInputs.forEach((i) => { i.value = st.car[i.dataset.car] ?? ''; }); syncModels(); };
  fillCar();
  input.value = st.query;

  // Машина клиента: поиск по телефону, имени или госномеру.
  function drawClient() {
    const box = $('.pf-client', host);
    if (!box) return;
    if (st.client) {
      const cars = st.client.cars || [];
      box.innerHTML = `<span class="pf-pill">${icon('users')} ${esc(st.client.name)}<button type="button" class="icon-btn" data-unpick title="Убрать клиента">${icon('x')}</button></span>
        ${cars.length > 1 ? cars.map((c) => `<button type="button" class="chip ${c.id === st.carId ? 'active' : ''}" data-pick-car="${c.id}">${esc(carLine(c))}</button>`).join('') : ''}`;
    } else {
      box.innerHTML = `<div class="search-wrap pf-client-search"><span class="search-ic">${icon('search')}</span>
        <input placeholder="Машина клиента: телефон, имя или госномер" autocomplete="off"></div>`;
      autocomplete($('input', box), {
        source: async (q) => (await api('/search', { query: { q } })).clients,
        render: clientItem,
        minLen: 2,
        onPick: (c) => {
          if (!c) return;
          st.client = { id: c.id, name: c.name, cars: c.cars };
          st.clientId = c.id;
          const first = c.cars?.[0];
          if (first) { st.carId = first.id; Object.assign(st.car, { make: first.make, model: first.model, year: first.year || '', vin: first.vin }); }
          fillCar();
          drawClient();
          if (st.type || st.query) search();
        },
      });
    }
  }
  drawClient();
  on(host, 'click', '[data-unpick]', () => {
    Object.assign(st, { client: null, clientId: null, carId: null, car: { make: '', model: '', year: '', vin: '' } });
    fillCar();
    drawClient();
  });
  on(host, 'click', '[data-pick-car]', (e, el) => {
    const c = st.client.cars.find((x) => x.id === +el.dataset.pickCar);
    st.carId = c.id;
    Object.assign(st.car, { make: c.make, model: c.model, year: c.year || '', vin: c.vin });
    fillCar();
    drawClient();
    if (st.type || st.query) search();
  });
  carInputs.forEach((i) => i.addEventListener('input', () => {
    st.car[i.dataset.car] = i.value.trim();
    if (i.dataset.car === 'make') syncModels();
    if (st.carId && i.dataset.car !== 'vin') {
      // Машину поменяли вручную — VIN прежней машины ей уже не подходит.
      st.car.vin = '';
      $('[data-car=vin]', host).value = '';
    }
    st.carId = null;
  }));

  // Не <form>: подборщик живёт и внутри окна заказ-наряда, а вложенные формы браузер отбрасывает.
  const runSearch = () => { st.query = input.value.trim(); st.type = null; search(); };
  $('.pf-go', host).addEventListener('click', runSearch);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runSearch(); } });
  on(host, 'click', '[data-type]', (e, el) => {
    const t = PF_TYPES.find((x) => x.id === el.dataset.type);
    st.type = t;
    st.query = t.name;
    input.value = t.name;
    search();
  });

  async function search() {
    $$('.pf-chips .chip', host).forEach((c) => c.classList.toggle('active', c.dataset.type === st.type?.id));
    const q = st.query;
    if (!q && !st.type) { res.innerHTML = ''; return; }
    if (!st.type) {
      const found = pfDetectTypes(q);
      st.type = found.main;
      st.related = found.related;
    } else st.related = [];
    st.article = !st.type && pfLooksLikeArticle(q) ? q.trim() : null;
    res.innerHTML = `<div class="card pf-loading"><div class="pf-spinner"></div><div><b>Ищем у поставщиков…</b><div class="muted small">${esc(pfCarTitle(st.car) || 'автомобиль не указан')} · ${esc(st.type?.name || q)}</div></div></div>`;
    // Свой склад: ищем по первому слову детали и оставляем только то, что распознаётся как та же деталь.
    const stockQ = st.type ? pfNorm(st.type.name).split(' ')[0].slice(0, 6) : q;
    const [stock] = await Promise.all([
      api('/parts', { query: { q: stockQ, limit: 20 } }).catch(() => []),
      new Promise((r) => setTimeout(r, pfDemoCatalog() ? 550 : 150)),
    ]);
    st.stock = stock.filter((p) => (p.available ?? p.qty) > 0 && (!st.type || pfDetectTypes(p.name).main?.id === st.type.id)).slice(0, 5);
    // Реальные предложения из загруженных прайсов поставщиков (ТЗ 14.2); демо-каталог — только в демо-версии.
    const r = await api('/supplier-offers', { query: { q: st.article || q || st.type?.name || '', make: st.car?.make || '', model: st.car?.model || '', vin: st.car?.vin || '' } }).catch(() => ({ groups: [] }));
    st.parts = r.groups.map((g) => ({
      brand: g.brand, article: g.article, kind: 'analog', fit: g.applicability || '', name: g.name || st.type?.name || q,
      offers: g.offers.map((o) => ({ supplier: o.supplier, rating: null, days: o.days ?? 0, qty: o.qty ?? '—', price: o.price, url: o.url,
        note: `прайс от ${fmtDate(o.price_date)}` })),
    }));
    st.integrations = r.integrations || [];
    if (pfDemoCatalog() && st.type) st.parts.push(...pfDemoParts(st.car, st.type));
    draw();
  }

  function draw() {
    const carTitle = pfCarTitle(st.car);
    const label = st.type?.name || st.query;
    const linkText = [st.type?.name || st.query, st.car.make, st.car.model, st.car.year].filter(Boolean).join(' ');
    const links = pfLinks(linkText, st.article);
    const linksHtml = `<section class="card pf-links-card"><div class="card-head"><h2>Проверить цену на сайтах</h2><span class="muted small">откроется в новой вкладке</span></div>
      <div class="pf-links">${links.map(([n, u]) => `<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n)} ↗</a>`).join('')}</div>
      <p class="hint" style="margin-bottom:0">Ищем «${esc(linkText)}»${st.article ? ` и артикул ${esc(st.article)}` : ''}.</p></section>`;
    const relatedHtml = st.related.length ? `<div class="pf-related"><span class="muted small">Возможно, вы ищете:</span>${st.related.map((t) => `<button type="button" class="chip" data-type="${t.id}">${esc(t.name)}</button>`).join('')}</div>` : '';
    const stockHtml = st.stock.length ? `<section class="card pf-stock"><div class="card-head"><h2>У вас на складе</h2><span class="badge green">можно ставить сегодня</span></div>
      ${st.stock.map((p, i) => `<div class="pf-offer"><div class="pf-sup"><div class="t">${esc(p.name)}</div><div class="s">${esc([p.brand, p.sku].filter(Boolean).join(' · '))}${p.location ? ` · место ${esc(p.location)}` : ''}</div></div>
        <div class="pf-meta"><span class="pf-days today">сегодня</span><span class="muted small">доступно ${fmtNum(p.available ?? p.qty)} ${esc(p.unit)}</span></div>
        <div class="pf-price"><div class="v">${money(p.price)}</div><div class="s">закупка ${money(p.buy_price)}</div></div>
        <button type="button" class="btn sm primary" data-stock="${i}">Взять</button></div>`).join('')}</section>` : '';

    if (!st.type && !st.article && !st.stock.length && !st.parts.length) {
      res.innerHTML = `<div class="card pf-empty"><h2>Не поняли, какая деталь нужна</h2>
        <p class="muted">Попробуйте написать по-другому или выберите из популярных выше. Можно ввести артикул детали.</p>${relatedHtml}</div>${linksHtml}`;
      return;
    }
    if (!st.parts.length) {
      res.innerHTML = `${relatedHtml}${stockHtml}
        <section class="card pf-connect"><h2>Цены поставщиков</h2>
          <p class="muted">Здесь будут предложения ваших поставщиков по «${esc(label)}»${carTitle ? ` для ${esc(carTitle)}` : ''}: цены, сроки и наличие, отсортированные от дешёвых к дорогим.
          Для этого подключаются API поставщиков, с которыми вы работаете (Армтек, Росско, Автопитер, магазины на платформе ABCP и другие).</p>
          <p class="muted">Заказали по телефону или на сайте? Запишите заказ — CRM напомнит, когда деталь должна приехать.</p>
          <button type="button" class="btn" data-manual-order>${icon('plus')} Записать заказ у поставщика</button></section>${linksHtml}`;
      return;
    }

    const parts = st.parts
      .filter((p) => PF_STATE.kind === 'all' || (PF_STATE.kind === 'original' ? p.kind === 'original' : p.kind !== 'original'))
      .map((p) => {
        const offers = p.offers.filter((o) => !PF_STATE.fast || o.days <= 2)
          .sort((a, b) => (PF_STATE.sort === 'price' ? a.price - b.price || a.days - b.days : a.days - b.days || a.price - b.price));
        return { ...p, offers, min: offers.length ? Math.min(...offers.map((o) => o.price)) : Infinity, minDays: offers.length ? Math.min(...offers.map((o) => o.days)) : Infinity };
      })
      .filter((p) => p.offers.length)
      .sort((a, b) => (PF_STATE.sort === 'price' ? a.min - b.min : a.minDays - b.minDays || a.min - b.min));
    const all = parts.flatMap((p) => p.offers.map((o) => ({ p, o })));
    const cheapest = all.reduce((m, x) => (!m || x.o.price < m.o.price ? x : m), null);
    const fastest = all.reduce((m, x) => (!m || x.o.days < m.o.days || (x.o.days === m.o.days && x.o.price < m.o.price) ? x : m), null);
    const original = st.parts.find((p) => p.kind === 'original');
    const origMin = original ? Math.min(...original.offers.map((o) => o.price)) : null;
    const kindBadge = (k) => (k === 'original' ? '<span class="badge blue">Оригинал</span>' : k === 'restored' ? '<span class="badge orange">Восстановленная</span>' : '<span class="badge">Аналог</span>');
    const keyOf = (p, o) => `${p.article}|${o.supplier}`;
    const bestCard = (title, cls, x) => (x ? `<div class="pf-best ${cls}"><div class="lbl">${title}</div>
      <div class="val">${money(x.o.price)}</div><div class="small">${esc(x.p.brand)} · ${esc(x.o.supplier)} · ${pfDays(x.o.days)}</div>
      <button type="button" class="btn sm" data-offer="${esc(keyOf(x.p, x.o))}">Заказать</button></div>` : '');

    res.innerHTML = `
      <section class="card pf-summary">
        <div class="pf-head"><div class="pf-group muted small">${esc(st.type?.group || 'по артикулу')}</div><h2 class="pf-title">${esc(st.type?.name || st.query)}</h2>
          <div class="muted">${esc(carTitle || (pfDemoCatalog() ? 'Автомобиль не указан — цены для средней иномарки' : 'Автомобиль не указан'))}</div>
          <div class="muted small" style="margin-top:6px">${st.parts.length} ${pfPlural(st.parts.length, 'вариант', 'варианта', 'вариантов')} детали · ${st.parts.reduce((s, p) => s + p.offers.length, 0)} ${pfPlural(st.parts.reduce((s, p) => s + p.offers.length, 0), 'предложение', 'предложения', 'предложений')}${origMin && cheapest ? ` · аналог дешевле оригинала до ${Math.round((1 - cheapest.o.price / origMin) * 100)}%` : ''}</div></div>
        ${bestCard('Дешевле всего', 'cheap', cheapest)}
        ${bestCard('Быстрее всего', 'fast', fastest)}
      </section>
      ${relatedHtml}
      ${stockHtml}
      <div class="pf-toolbar">
        <div class="pf-seg" role="group" aria-label="Сортировка">
          <button type="button" class="${PF_STATE.sort === 'price' ? 'active' : ''}" data-sort="price">Дешевле</button>
          <button type="button" class="${PF_STATE.sort === 'days' ? 'active' : ''}" data-sort="days">Быстрее</button></div>
        <div class="pf-seg" role="group" aria-label="Тип детали">
          <button type="button" class="${PF_STATE.kind === 'all' ? 'active' : ''}" data-kind="all">Все</button>
          <button type="button" class="${PF_STATE.kind === 'original' ? 'active' : ''}" data-kind="original">Оригинал</button>
          <button type="button" class="${PF_STATE.kind === 'analog' ? 'active' : ''}" data-kind="analog">Аналоги</button></div>
        <label class="check"><input type="checkbox" data-fast ${PF_STATE.fast ? 'checked' : ''}> Привезут за 1–2 дня</label>
        <span class="muted small pf-markup">Цена клиенту — с наценкой ${fmtNum(pfMarkup())}%</span>
      </div>
      ${parts.length ? parts.map((p) => `<section class="card pf-part">
        <div class="pf-part-head">
          <div><div class="pf-part-title">${kindBadge(p.kind)} <span>${esc(p.brand)}</span> <span class="pf-article">${esc(p.article)}</span></div>
            <div class="muted small">${esc(p.name)} · подходит: ${esc(p.fit)}</div></div>
          <div class="pf-from"><div class="muted small">от</div><div class="v">${money(p.min)}</div></div>
        </div>
        ${p.offers.map((o) => `<div class="pf-offer ${cheapest && o === cheapest.o ? 'cheapest' : ''}">
          <div class="pf-sup"><div class="t">${esc(o.supplier)} ${o.rating != null ? `<span class="pf-rating">★ ${o.rating.toFixed(1)}</span>` : ''}</div><div class="s">${esc(o.note)}${o.url ? ` · <a href="${esc(o.url)}" target="_blank" rel="noopener">на сайте</a>` : ''}</div></div>
          <div class="pf-meta"><span class="pf-days ${o.days <= 1 ? 'today' : ''}">${pfDays(o.days)}</span><span class="muted small">в наличии ${esc(o.qty)} шт</span></div>
          <div class="pf-price"><div class="v">${money(o.price)}</div><div class="s">клиенту ${money(pfRetail(o.price))}</div></div>
          <button type="button" class="btn sm ${cheapest && o === cheapest.o ? 'primary' : ''}" data-offer="${esc(keyOf(p, o))}">Заказать</button>
        </div>`).join('')}
      </section>`).join('') : '<div class="card empty">Нет предложений с такими фильтрами</div>'}
      ${linksHtml}
      ${pfDemoCatalog() ? `<p class="hint pf-demo-note">${icon('tag')} Демо-версия: артикулы, цены, сроки и поставщики примерные.</p>`
        : `<p class="hint">Предложения — из прайс-листов поставщиков (раздел «Поставщики»). API: ${(st.integrations || []).filter((i) => i.code !== 'pricelists').map((i) => `${esc(i.name)} — ${esc(i.status)}`).join(', ') || '—'}.</p>`}`;
    st.offerIndex = new Map(all.map((x) => [keyOf(x.p, x.o), x]));
  }

  on(host, 'click', '[data-sort]', (e, el) => { PF_STATE.sort = el.dataset.sort; draw(); });
  on(host, 'click', '[data-kind]', (e, el) => { PF_STATE.kind = el.dataset.kind; draw(); });
  on(host, 'change', '[data-fast]', (e, el) => { PF_STATE.fast = el.checked; draw(); });
  on(host, 'click', '[data-offer]', (e, el) => {
    const x = st.offerIndex.get(el.dataset.offer);
    if (!x) return;
    pfAddDialog({
      title: `${st.type?.name || x.p.name} ${x.p.brand}${x.p.kind === 'restored' ? ' (восстановленная)' : ''}`,
      sku: x.p.article, buy: x.o.price, retail: pfRetail(x.o.price), partId: null,
      source: `${x.o.supplier} · ${pfDays(x.o.days)}`, type: st.type, st, onAdd, orderId,
      brand: x.p.brand, supplier: x.o.supplier, days: x.o.days, canOrder: true,
    });
  });
  on(host, 'click', '[data-manual-order]', () => {
    const name = [st.type?.name || st.query, st.car.make, st.car.model].filter(Boolean).join(' ');
    purchaseDialog(null, { name, order_id: orderId || null }, () => {});
  });
  on(host, 'click', '[data-stock]', (e, el) => {
    const p = st.stock[+el.dataset.stock];
    pfAddDialog({
      title: p.name, sku: p.sku, buy: p.buy_price, retail: p.price, partId: p.id, unit: p.unit,
      source: 'Свой склад · сегодня', type: st.type, st, onAdd, orderId,
    });
  });

  if (st.query) search();
  else {
    // Курсор — в поле «Что нужно заменить?», если пользователь ещё никуда не ввёл текст
    // (в окне заказ-наряда фокус сначала встаёт на марку — переносим его).
    setTimeout(() => {
      const a = document.activeElement;
      if (!a || a === document.body || (onAdd && a.dataset.car === 'make')) input.focus();
    }, 60);
  }
}

/**
 * Окно заказа детали: количество, цена клиенту, куда (заказ-наряд или склад),
 * заказ у поставщика, работа по замене из прайса и статус «Ждёт запчасти».
 */
async function pfAddDialog({ title, brand = '', sku, buy, retail, partId, unit, source, type, st, onAdd, orderId, supplier = '', days = 0, canOrder = false }) {
  const services = type?.work ? await api('/services', { query: { q: type.work, limit: 3 } }).catch(() => []) : [];
  const service = services.find((s) => pfNorm(s.name).startsWith('замен')) || services[0] || null;
  const expected = addDays(isoDate(), days);
  const when = days === 0 ? 'сегодня' : days === 1 ? 'завтра' : fmtDate(expected);
  let orders = [];
  if (!onAdd) {
    const r = await api('/orders', { query: { status: 'active' } });
    orders = r.items;
    if (st.carId) orders.sort((a, b) => (b.car_id === st.carId) - (a.car_id === st.carId));
  }
  const targets = [
    ...orders.map((o) => [o.id, `Заказ-наряд №${o.id} · ${carLine(o) || '—'} · ${o.client_name}`]),
    ...(st.clientId ? [['new', `Новый заказ-наряд для ${st.client?.name || 'клиента'}`]] : []),
    ...(canOrder ? [['stock', 'На склад, без заказ-наряда']] : []),
  ];
  if (!onAdd && !targets.length) {
    toast('Нет открытых заказ-нарядов. Выберите машину клиента, чтобы создать новый.', 'error');
    return;
  }
  const preferred = orders.find((o) => o.car_id && o.car_id === st.carId)?.id ?? (st.clientId ? 'new' : targets[0][0]);
  const m = openModal({
    title: canOrder ? 'Заказ детали' : 'Взять со склада',
    submit: canOrder ? 'Заказать' : 'Добавить в заказ-наряд',
    body: `<div class="pf-add-head"><div class="t">${esc(title)}</div><div class="muted small">${esc(sku || '')}${sku ? ' · ' : ''}${esc(source)} · закупка ${money(buy)}</div></div>
      <div class="form-grid">
        ${onAdd ? '' : fSelect('Куда', 'order', targets, preferred, { cls: 'wide' })}
        ${fNum('Количество', 'qty', 1)}
        ${fNum('Цена клиенту за шт, ₽', 'price', retail)}
        <div class="wide pf-add-checks">
          ${canOrder ? fCheck(`Заказать у «${supplier}» — приедет ${when}`, 'do_order', true) : ''}
          ${service ? fCheck(`Добавить работу «${service.name}» — ${money(service.price)}`, 'with_work', true) : ''}
          ${canOrder && days > 0 ? fCheck('Перевести заказ-наряд в «Ждёт запчасти»', 'set_waiting', true) : ''}
        </div>
        ${canOrder && DEMO ? '<p class="hint wide" style="margin:0">В демо заказ поставщику не отправляется, а появляется в разделе «Закупки».</p>' : ''}
      </div>`,
    onSubmit: async (d) => {
      const qty = toNum(d.qty) || 1;
      const doOrder = canOrder && d.do_order;
      const target = onAdd ? 'current' : d.order;
      if (target === 'stock' && !doOrder) throw new Error('На склад деталь попадёт только через заказ у поставщика — отметьте «Заказать».');
      const part = { part_id: partId, name: title, sku: sku || '', qty, price: toNum(d.price), buy_price: buy, unit: unit || 'шт', avail: null };
      const work = d.with_work && service && target !== 'stock' ? { service_id: service.id, name: service.name, qty: 1, price: service.price, employee_id: '' } : null;
      const purchase = doOrder ? { supplier, name: title, brand, article: sku || '', qty, price: buy, days } : null;
      const waiting = !!(doOrder && d.set_waiting);

      if (onAdd) {
        if (purchase) await api('/purchases', { method: 'POST', body: { ...purchase, order_id: orderId } });
        await onAdd({ part, work, waiting, ordered: !!purchase });
        return;
      }
      if (target === 'stock') {
        await api('/purchases', { method: 'POST', body: purchase });
        toast(`Заказано у «${supplier}», приедет ${when}. По кнопке «Получено» деталь попадёт на склад.`);
        go('#/purchases');
        return;
      }
      let id = target;
      if (id === 'new') {
        const r = await api('/orders', { method: 'POST', body: { client_id: st.clientId, car_id: st.carId || undefined, complaint: `Замена: ${type?.name || title}` } });
        id = r.id;
      }
      if (purchase) await api('/purchases', { method: 'POST', body: { ...purchase, order_id: id, set_waiting: waiting } });
      const o = await api(`/orders/${id}`);
      await api(`/orders/${id}`, { method: 'PUT', body: {
        works: [...o.works.map((w) => ({ service_id: w.service_id, name: w.name, qty: w.qty, price: w.price, employee_id: w.employee_id })), ...(work ? [work] : [])],
        parts: [...o.parts.map((p) => ({ part_id: p.part_id, name: p.name, sku: p.sku, qty: p.qty, price: p.price, buy_price: p.buy_price })), part],
      } });
      toast(purchase ? `Заказано у «${supplier}» и добавлено в заказ-наряд №${id}` : `Добавлено в заказ-наряд №${id}`);
      go(`#/orders/${id}`);
    },
  });
  // Подпись кнопки и доступность галочек следуют за выбором.
  const form = m.form;
  const sync = () => {
    const doOrder = form.elements.do_order?.checked;
    const toStock = form.elements.order?.value === 'stock';
    $('button[type=submit]', m.el).textContent = doOrder ? 'Заказать' : canOrder ? 'Добавить без заказа' : 'Добавить в заказ-наряд';
    if (form.elements.set_waiting) form.elements.set_waiting.disabled = !doOrder || toStock;
    if (form.elements.with_work) form.elements.with_work.disabled = toStock;
    if (form.elements.price) form.elements.price.closest('.field').hidden = toStock;
  };
  form.addEventListener('change', sync);
  sync();
}

</script>
<script>
'use strict';
/* Закупки: заказы запчастей у поставщиков. Создаются из подбора запчастей или вручную,
   по кнопке «Получено» деталь отмечается в заказ-наряде или приходуется на склад.
   Подключается до app.js и пользуется его помощниками только внутри функций. */

const PURCHASE_STATUS = { draft: ['Заявка', ''], approved: ['Согласована', 'orange'], ordered: ['Заказано', 'blue'], received: ['Получено', 'green'], returned: ['Возвращено', 'red'], cancelled: ['Отменено', 'red'] };
const purchaseBadge = (s) => { const [t, c] = PURCHASE_STATUS[s] || [s, '']; return `<span class="badge ${c}">${esc(t)}</span>`; };

/** «приедет завтра», «опаздывает на 2 дн.», «получено 16.11.2026». */
function arrivalText(p) {
  if (p.status === 'received') return `получено ${fmtDate(p.received_at)}`;
  if (p.status === 'cancelled') return 'заказ отменён';
  if (p.status === 'returned') return 'возвращено поставщику';
  if (p.status === 'draft' || p.status === 'approved') return p.source === 'min_stock' ? 'по минимальному остатку' : 'ещё не заказано';
  if (!p.expected_date) return 'срок не указан';
  const t = isoDate();
  if (p.expected_date < t) {
    const late = Math.round((new Date(t) - new Date(p.expected_date)) / 864e5);
    return `опаздывает на ${late} дн. · ждали ${fmtDate(p.expected_date)}`;
  }
  if (p.expected_date === t) return 'приедет сегодня';
  if (p.expected_date === addDays(t, 1)) return 'приедет завтра';
  return `приедет ${fmtDate(p.expected_date)}`;
}
const arrivalClass = (p) => (p.status === 'ordered' && p.expected_date && p.expected_date < isoDate() ? 'neg' : p.status === 'ordered' && p.expected_date === isoDate() ? 'ok-text' : '');

/** Отметить получение. Возвращает ответ сервера; сообщает, что изменилось. */
async function receivePurchase(p) {
  const r = await api(`/purchases/${p.id}/receive`, { method: 'POST' });
  if (p.order_id) {
    toast(r.order_resumed ? `Все запчасти на месте — заказ-наряд №${p.order_id} снова «В работе»` : `Получено для заказ-наряда №${p.order_id}`);
  } else toast(`Оприходовано на склад: ${p.name}, ${fmtNum(p.qty)} шт`);
  return r;
}

/** Ручная запись заказа у поставщика (заказали по телефону или на сайте). */
async function purchaseDialog(p = null, preset = {}, onSaved = () => {}) {
  const x = { qty: 1, ...preset, ...(p || {}) };
  const [orders, suppliers] = await Promise.all([
    api('/orders', { query: { status: 'active' } }).then((r) => r.items),
    api('/purchases').then((r) => [...new Set(r.items.map((i) => i.supplier))]),
  ]);
  if (x.order_id && !orders.some((o) => o.id === x.order_id)) orders.unshift({ id: x.order_id, client_name: x.client_name || '', make: x.make, model: x.model, plate: x.plate });
  const buttons = p && ['draft', 'approved', 'ordered'].includes(p.status) ? [{ label: 'Отменить', cls: 'danger', onClick: async () => {
    if (!await askConfirm(`Отменить заказ «${p.name}» у ${p.supplier}?`, { ok: 'Отменить заказ' })) return false;
    await api(`/purchases/${p.id}`, { method: 'PUT', body: { status: 'cancelled' } });
    toast('Заказ отменён');
    onSaved();
  } }] : [];
  openModal({
    title: p ? 'Заказ у поставщика' : 'Записать заказ у поставщика',
    buttons,
    body: `<div class="form-grid">
      ${fInput('Поставщик', 'supplier', x.supplier, { req: !['draft', 'approved'].includes(x.status) && !preset.draft, attrs: 'list="pur-suppliers"', ph: 'Например: Армтек' })}
      ${fInput('Ожидаем', 'expected_date', x.expected_date || addDays(isoDate(), 1), { type: 'date' })}
      ${fInput('Деталь', 'name', x.name, { req: true, cls: 'wide', ph: 'Рулевая рейка BMW 5 серии' })}
      ${fInput('Бренд', 'brand', x.brand)}${fInput('Артикул', 'article', x.article)}
      ${fNum('Количество', 'qty', x.qty, { req: true })}${fNum('Цена закупки за шт, ₽', 'price', x.price ?? '')}
      ${fSelect('Для чего', 'order_id', [['', 'На склад'], ...orders.map((o) => [o.id, `Заказ-наряд №${o.id} · ${carLine(o) || '—'} · ${o.client_name}`])], x.order_id ?? '', { cls: 'wide' })}
      ${fText('Комментарий', 'note', x.note, { rows: 2, ph: 'Номер заказа у поставщика, кто заказал' })}
      <datalist id="pur-suppliers">${[...new Set([...suppliers, 'Армтек', 'Росско', 'Автопитер', 'Exist', 'Emex'])].map((s) => `<option value="${esc(s)}">`).join('')}</datalist></div>`,
    submit: p ? 'Сохранить' : 'Записать заказ',
    onSubmit: async (d) => {
      const body = { ...d, order_id: d.order_id || null, ...(preset.draft ? { status: 'draft' } : {}) };
      await api(p ? `/purchases/${p.id}` : '/purchases', { method: p ? 'PUT' : 'POST', body });
      toast(p ? 'Сохранено' : 'Заказ записан');
      onSaved();
    },
  });
}

async function viewPurchases(v, params) {
  const f = { status: params.get('status') || 'ordered' };
  const TABS = [['draft', 'Заявки'], ['approved', 'Согласованы'], ['ordered', 'Ждём'], ['received', 'Получено'], ['returned', 'Возвраты'], ['cancelled', 'Отменено'], ['all', 'Все']];
  v.innerHTML = `
    <div class="page-head"><div><h1>Закупки</h1><div class="muted">Заказы запчастей у поставщиков: что ждём, что опаздывает, что уже приехало</div></div>
      <div class="actions"><a class="btn" href="#/parts">${icon('tag')} Подобрать запчасть</a>
      <button class="btn" data-act="auto" title="Заявки на позиции ниже минимального остатка">По минимальным остаткам</button>
      <button class="btn" data-act="draft">${icon('plus')} Заявка</button>
      <button class="btn primary" data-act="new">${icon('plus')} Записать заказ</button></div></div>
    <div class="kpis pur-kpis"></div>
    <div class="tabs"></div>
    <section class="card"><div class="table-wrap res"><div class="loading">Загрузка…</div></div></section>`;
  let items = [];
  async function load() {
    replaceHash(`#/purchases${f.status !== 'ordered' ? '?status=' + f.status : ''}`);
    const [r, open] = await Promise.all([
      api('/purchases', { query: { status: f.status === 'all' ? '' : f.status } }),
      api('/purchases', { query: { status: 'ordered' } }),
    ]);
    items = r.items;
    const t = isoDate();
    const late = open.items.filter((p) => p.expected_date && p.expected_date < t);
    const today = open.items.filter((p) => p.expected_date === t);
    const sum = open.items.reduce((s, p) => s + p.qty * p.price, 0);
    $('.pur-kpis', v).innerHTML = `
      <div class="kpi"><div class="label">Ждём от поставщиков</div><div class="value">${open.items.length}</div><div class="sub">${pfPlural(open.items.length, 'позиция', 'позиции', 'позиций')} на ${money(sum)}</div></div>
      <div class="kpi"><div class="label">Приедут сегодня</div><div class="value">${today.length}</div><div class="sub">${today.length ? esc([...new Set(today.map((p) => p.supplier))].join(', ')) : 'нет'}</div></div>
      <div class="kpi ${late.length ? 'alert' : ''}"><div class="label">Опаздывают</div><div class="value">${late.length}</div><div class="sub">${late.length ? 'позвоните поставщику' : 'всё вовремя'}</div></div>`;
    const total = Object.values(r.counts).reduce((s, n) => s + n, 0);
    $('.tabs', v).innerHTML = TABS.map(([k, label]) => `<button class="tab ${f.status === k ? 'active' : ''}" data-tab="${k}">${label}<span class="cnt">${k === 'all' ? total : r.counts[k] || 0}</span></button>`).join('');
    $('.res', v).innerHTML = items.length ? `<table class="tbl stack st-pur"><thead><tr><th>Деталь</th><th>Поставщик</th><th class="right">Сумма</th><th>Срок</th><th>Для чего</th><th></th></tr></thead><tbody>
      ${items.map((p, i) => `<tr data-i="${i}">
