/* Центр коммуникаций (ТЗ 20): лента переписки, очередь «отправить вручную», согласование сметы,
   настройки уведомлений. Подключается до app.js и пользуется его помощниками только внутри функций. */

const MSG_STATUS = { queued: ['в очереди', ''], sent: ['отправлено', 'green'], delivered: ['доставлено', 'green'], read: ['прочитано', 'green'], failed: ['ошибка', 'red'], manual: ['отправить вручную', 'orange'], received: ['входящее', 'blue'] };
const CH_NAME = { telegram: 'Telegram', whatsapp: 'WhatsApp', max: 'MAX', vk: 'VK', sms: 'SMS', email: 'E-mail', manual: 'вручную' };
const APPROVAL_STATUS = { pending: ['ждёт решения', 'orange'], approved: ['согласовано', 'green'], rejected: ['отказ', 'red'], question: ['вопрос клиента', 'blue'], expired: ['срок истёк', ''], replaced: ['заменена', ''] };

const msgRow = (m, withClient = false) => `<div class="msg ${m.direction}"><div class="msg-meta">${fmtDT(m.created_at)} · ${esc(CH_NAME[m.channel])}${m.scenario ? ' · ' + esc(m.scenario) : ''}${m.user_name ? ' · ' + esc(m.user_name) : ''}
  ${withClient && m.client_name ? ` · <a href="#/clients/${m.client_id}">${esc(m.client_name)}</a> ${phoneLink(m.client_phone)}` : ''}${m.order_id ? ` · <a href="#/orders/${m.order_id}">№${m.order_id}</a>` : ''}
  <span class="badge ${MSG_STATUS[m.status][1]}">${MSG_STATUS[m.status][0]}</span></div>
  <div class="msg-text">${esc(m.text)}</div>${m.error ? `<div class="hint">${esc(m.error)}</div>` : ''}
  ${['manual', 'failed'].includes(m.status) && can('messages.send') ? `<div class="msg-act"><button class="btn sm" data-copy="${m.id}">Скопировать текст</button> <button class="btn sm" data-sent="${m.id}">Отправлено вручную</button> ${m.status === 'failed' ? `<button class="btn sm" data-retry="${m.id}">Повторить</button>` : ''}</div>` : ''}</div>`;

function bindMsgActions(root, list, onDone) {
  on(root, 'click', '[data-copy]', async (e, el) => { const m = list.find((x) => x.id === +el.dataset.copy); try { await navigator.clipboard.writeText(m.text); toast('Текст скопирован'); } catch { toast('Скопируйте текст вручную'); } });
  on(root, 'click', '[data-sent]', async (e, el) => {
    const how = await askReason('Как отправили?', { required: false, ph: 'звонок, WhatsApp с рабочего телефона…' });
    if (how === null) return;
    await api(`/messages/${el.dataset.sent}/manual-sent`, { method: 'POST', body: { how } });
    onDone();
  });
  on(root, 'click', '[data-retry]', async (e, el) => { await api(`/messages/${el.dataset.retry}/retry`, { method: 'POST' }); onDone(); });
}

/** Переписка в карточке клиента или наряда. */
async function messagesBox(host, { clientId, orderId = null, carId = null }) {
  const list = await api('/messages', { query: orderId ? { order_id: orderId } : { client_id: clientId } });
  host.innerHTML = `${can('messages.send') ? `<form class="msg-form"><textarea name="text" rows="2" placeholder="Сообщение клиенту"></textarea>
      <div class="msg-form-row"><select name="kind" style="width:auto"><option value="service">Сервисное</option><option value="marketing">Рекламное (нужно согласие)</option></select>
      <button class="btn primary">Отправить</button>${!orderId && can('clients.edit') ? '<button type="button" class="btn ghost" data-tg>Ссылка на Telegram-бота</button>' : ''}</div></form>` : ''}
    <div class="msg-list">${list.map((m) => msgRow(m)).join('') || '<div class="empty-sm">Переписки нет</div>'}</div>`;
  const reload = () => messagesBox(host, { clientId, orderId, carId });
  $('.msg-form', host)?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = formToObj(e.target);
    const m = await api('/messages', { method: 'POST', body: { ...d, client_id: clientId, order_id: orderId, car_id: carId } });
    toast(m.status === 'manual' ? 'Канал не подключён — отправьте текст вручную' : m.status === 'failed' ? `Ошибка: ${m.error}` : 'Отправлено');
    reload();
  });
  $('[data-tg]', host)?.addEventListener('click', async () => {
    const r = await api(`/clients/${clientId}/telegram-link`, { method: 'POST' });
    openModal({ title: 'Подключение Telegram', cancel: 'Закрыть', submit: 'Готово', body: r.configured && r.url
      ? `<p>Отправьте клиенту ссылку — он нажмёт «Старт», и уведомления будут приходить в Telegram:</p><p><input value="${esc(r.url)}" readonly onclick="this.select()"></p>`
      : '<p>Бот Telegram не настроен на сервере (Настройки → Интеграции).</p>', onSubmit: () => {} });
  });
  bindMsgActions(host, list, reload);
}

    <section class="card"><div class="msg-list">${list.map((m) => msgRow(m, true)).join('') || `<div class="empty-sm">${tab === 'queue' ? 'Всё отправлено' : 'Сообщений нет'}</div>`}</div></section>`;
  bindMsgActions(v, list, () => router());

/** Согласование сметы по ссылке — в карточке наряда. */
async function approvalsBox(host, orderId, status) {
  const list = await api(`/orders/${orderId}/approvals`);
  host.innerHTML = `<div class="card-head"><h2>Согласование с клиентом</h2>${can('orders.edit') ? '<div class="head-actions"><button type="button" class="btn sm" data-ap="link">Ссылка</button><button type="button" class="btn sm primary" data-ap="send">Отправить клиенту</button></div>' : ''}</div>
    ${status !== 'approval' ? '<p class="hint" style="margin-top:0">После согласования клиентом наряд в статусе «Ожидает согласования» перейдёт в «Согласован» автоматически.</p>' : ''}
    ${list.map((a) => `<div class="log-item"><span class="badge ${APPROVAL_STATUS[a.status][1]}">${APPROVAL_STATUS[a.status][0]}</span> ${money(a.total)} <span class="muted small">от ${fmtDT(a.created_at)}${a.decided_at ? ', решение ' + fmtDT(a.decided_at) : `, до ${fmtDT(a.expires_at)}`}</span>${a.client_comment ? `<div class="small">«${esc(a.client_comment)}»</div>` : ''}</div>`).join('') || '<div class="empty-sm">Смета клиенту не отправлялась</div>'}
    <div class="ap-out"></div>`;
  on(host, 'click', '[data-ap]', async (e, el) => {

    $('.ap-out', host).innerHTML = `<input value="${esc(location.origin + r.path)}" readonly onclick="this.select()" style="margin-top:8px">`;

  res.innerHTML = `<section class="card"><h2>Каналы</h2><table class="tbl"><tbody>${chs.map((c) => `<tr><td class="title">${esc(c.name)}</td><td><span class="badge ${c.configured ? 'green' : ''}">${esc(c.status)}</span></td><td class="small muted">${esc(c.note)}</td></tr>`).join('')}</tbody></table>
    <p class="hint">Если у клиента нет подключённого канала, сообщение попадает в «Сообщения → Нужно отправить».</p></section>

      ${s.days != null || s.trigger === 'daily' ? fNum('За сколько дней', 'days', s.days ?? '') : ''}

    onSubmit: async (d) => {

      await api(`/scenarios/${s.code}`, { method: 'PUT', body: { template: d.template, days: d.days, enabled: d.enabled, channels } });
      toast('Сохранено');
      scenariosSettings(res);
    } });

}

<script>
'use strict';
/* Посты и видеонаблюдение (ТЗ 19): карточки постов, просмотр камер по WebRTC через CRM, оверлей.
   Подключается до app.js и пользуется его помощниками только внутри функций. */

const CAM_STATUS = { online: ['в сети', 'green'], offline: ['нет сигнала', 'red'], unknown: ['не проверена', ''], not_configured: ['видеосервер не настроен', ''] };

/** Живое видео: SDP-обмен идёт через CRM (права и журнал), медиа — напрямую от go2rtc. */
async function startVideo(videoEl, camId) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.ontrack = (e) => { if (!videoEl.srcObject) videoEl.srcObject = e.streams[0] || new MediaStream([e.track]); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  const res = await fetch(`/api/cameras/${camId}/webrtc`, { method: 'POST', headers: { 'Content-Type': 'application/sdp', 'X-CRM': '1' }, body: offer.sdp });
  if (!res.ok) { pc.close(); throw new Error((await res.json().catch(() => ({}))).error || 'Видео недоступно'); }
  await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
  return pc;
}

function videoModal(cam, card) {
  const o = card?.order;
  const overlay = `<div class="vid-ov"><b>${esc(card?.post?.name || cam.post_name || '')}</b>${o ? ` · ${esc(o.plate || '')} · ${esc([o.make, o.model].filter(Boolean).join(' '))} · №${o.id} · ${esc(ORDER_STATUS[o.status]?.[0] || '')}` : ''}</div>`;
  let pc = null;
  const m = openModal({ title: cam.name, size: 'xl', cancel: 'Закрыть', submit: 'Закрыть', onSubmit: () => {}, onClose: () => pc?.close(),
    body: `<div class="vid-box"><video autoplay muted playsinline controlslist="nodownload" disablepictureinpicture></video>${overlay}<div class="vid-msg">Подключение…</div></div>
      <p class="hint">Просмотр записывается в журнал доступа. Скачивание недоступно. Оверлей — часть интерфейса, запись не меняется.</p>` });
  const video = $('video', m.body);
  startVideo(video, cam.id).then((p) => { pc = p; $('.vid-msg', m.body).remove(); }).catch((e) => {
    $('.vid-msg', m.body).innerHTML = `${esc(e.message)}<br><img src="/api/cameras/${cam.id}/frame?t=${Date.now()}" alt="" class="vid-frame" onerror="this.remove()">`;
  });
  const oldClose = m.close;
  m.close = (...a) => { pc?.close(); return oldClose(...a); };
}

    <div class="post-grid">${board.map((b, i) => {
      const o = b.order; const a = b.appointment;
      return `<section class="card post-card state-${b.state === 'свободен' ? 'free' : b.state === 'занят' ? 'busy' : 'block'}">
        <div class="card-head"><h2>${esc(b.post.name)}</h2><span class="badge ${b.state === 'свободен' ? 'green' : b.state === 'занят' ? 'blue' : 'orange'}">${esc(b.state)}</span></div>
        ${o ? `<div class="facts">${fact('Автомобиль', [o.make, o.model].filter(Boolean).join(' '))}${fact('Госномер', plateHtml(o.plate), true)}
          ${fact('Заказ-наряд', `<a href="#/orders/${o.id}">№${o.id}</a> ${badge(o.status)}`, true)}${fact('Мастер', o.master)}${fact('Начало работ', fmtDT(b.started_at))}</div>`

        ${can('video.view') ? b.cameras.map((c) => `<div class="cam-row"><button class="btn sm" data-cam="${i}:${c.id}">▶ ${esc(c.name)}</button> <span class="badge ${CAM_STATUS[c.last_status][1]}">${CAM_STATUS[c.last_status][0]}</span></div>`).join('') || '<p class="hint">Камера не привязана</p>' : ''}

async function camerasSettings(res) {
  const [st, posts, log] = await Promise.all([api('/video/status'), api('/posts'), api('/video/access-log').catch(() => [])]);
  res.innerHTML = `<section class="card"><div class="card-head"><h2>Камеры</h2><button class="btn sm" data-act="new">+ Камера</button></div>
    <p class="hint" style="margin-top:0">Видеосервер: ${esc(st.server)} (GO2RTC_URL на сервере). Архив записей: ${esc(st.archive)}. Проверьте каждую камеру: модели по-разному отдают поток. Срок хранения записей по политике: ${esc(st.retention_days || '—')} дн.</p>
    <table class="tbl"><tbody>${st.cameras.map((c, i) => `<tr><td class="title">${esc(c.name)}<div class="hint">поток ${esc(c.stream)} · источник ${esc(c.source)}</div></td><td>${esc(c.post_name || 'без поста')}</td>
      <td><span class="badge ${CAM_STATUS[c.last_status][1]}">${CAM_STATUS[c.last_status][0]}</span></td><td><button class="icon-btn" data-i="${i}">${icon('edit')}</button></td></tr>`).join('') || '<tr><td class="empty-sm">Камер нет</td></tr>'}</tbody></table></section>
    <section class="card"><h2>Журнал просмотра видео</h2>${log.length ? `<table class="tbl"><tbody>${log.slice(0, 50).map((l) => `<tr><td class="nowrap">${fmtDT(l.at)}</td><td>${esc(l.user_name || '')}</td><td>${esc(l.camera || '')}</td><td>${l.action === 'view' ? 'просмотр' : 'кадр'}</td><td class="small muted">${esc(l.ip)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty-sm">Просмотров нет</div>'}</section>`;
  const dlg = (c) => openModal({ title: c ? c.name : 'Новая камера', body: `<div class="form-grid">${fInput('Название', 'name', c?.name, { req: true })}
    ${c ? '' : fInput('Имя потока (латиница)', 'stream', '', { req: true, ph: 'post1' })}${fSelect('Пост', 'post_id', [['', '—'], ...posts.map((p) => [p.id, p.name])], c?.post_id || '')}
    ${fInput(c ? 'Новый адрес RTSP (пусто — не менять)' : 'Адрес RTSP', 'rtsp_url', '', { cls: 'wide', ph: 'rtsp://логин:пароль@192.168.1.10:554/stream1', attrs: 'autocomplete="off"' })}
    ${c ? `<div class="wide">${fCheck('Включена', 'active', c.active)}</div>` : ''}${fText('Заметки', 'notes', c?.notes, { rows: 2 })}</div>
    <p class="hint">Адрес с паролем хранится только на сервере и в интерфейс не возвращается.</p>`,
  onSubmit: async (d) => { const r = await api(c ? `/cameras/${c.id}` : '/cameras', { method: c ? 'PUT' : 'POST', body: d }); toast(r.warning || 'Сохранено'); camerasSettings(res); } });
  $('[data-act=new]', res).onclick = () => dlg(null);
  on(res, 'click', '[data-i]', (e, el) => dlg(st.cameras[+el.dataset.i]));
}

</script>
<script>
'use strict';
/* PWA для планшета (ТЗ 26): установка, работа оболочки без связи, индикатор соединения,
   уведомления в приложении, подпись пальцем. Подключается до app.js; функции вызываются из initShell. */

function initPwa() {
  if (false && location.pathname.startsWith('/crm')) {
    navigator.serviceWorker.register('/crm/sw.js', { scope: '/crm/' }).catch(() => { /* без офлайн-оболочки */ });
  }
  // Индикатор соединения: без связи изменения не отправляются (финансовые и складские — тоже).
  const bar = document.createElement('div');
  bar.className = 'offline-bar';
  bar.hidden = navigator.onLine;
  bar.textContent = 'Нет связи с сервером. Просмотр открытых экранов возможен, изменения не сохранятся — дождитесь подключения.';
  document.body.prepend(bar);
  window.addEventListener('online', () => { bar.hidden = true; toast('Связь восстановлена'); });
  window.addEventListener('offline', () => { bar.hidden = false; });
  initNotifications();
}

/* Уведомления в приложении: новые заявки, сообщения к отправке, входящие от клиентов. */
let NOTIFY_SINCE = '';
function initNotifications() {
  const btn = document.createElement('button');
  btn.className = 'icon-btn notif-btn';
  btn.title = 'Уведомления';
  btn.innerHTML = `${icon('alert')}<span class="notif-cnt" hidden></span>`;
  $('.top-actions')?.prepend(btn);
  btn.onclick = async () => {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    const s = await api('/notifications/summary');
    const m = openModal({ title: 'Уведомления', cancel: 'Закрыть', submit: 'Закрыть', onSubmit: () => {},
      body: `<div class="list">${s.leads_new ? `<a class="list-item" href="#/leads" data-close>Новые заявки с сайта: <b>${s.leads_new}</b></a>` : ''}
        ${s.to_send ? `<a class="list-item" href="#/messages" data-close>Сообщения отправить вручную: <b>${s.to_send}</b></a>` : ''}
        ${!s.leads_new && !s.to_send ? '<div class="empty-sm">Всё обработано</div>' : ''}</div>` });
    on(m.body, 'click', '[data-close]', () => m.close());
  };
  const poll = async () => {
    if (!ME || document.hidden || !navigator.onLine) return;
    try {
      const s = await api('/notifications/summary', { query: { since: NOTIFY_SINCE } });
      const n = s.leads_new + s.to_send;
      const cnt = $('.notif-cnt', btn);
      cnt.hidden = !n;
      cnt.textContent = n > 99 ? '99+' : n;
      if (NOTIFY_SINCE && s.incoming.length) {
        s.incoming.forEach((m) => {
          toast(`${m.client_name || 'Клиент'}: ${m.text.slice(0, 80)}`);
          if ('Notification' in window && Notification.permission === 'granted') new Notification(m.client_name || 'Сообщение клиента', { body: m.text.slice(0, 140), icon: '/static/icons/icon-192.png' });
        });
      }
      NOTIFY_SINCE = s.now;
    } catch { /* сеть вернётся */ }
  };
  setTimeout(poll, 1500);
  setInterval(poll, 30000);
}

/** Подпись пальцем или стилусом на холсте. Возвращает { el, isEmpty(), toBlob() }. */
function signaturePad(host) {
  host.innerHTML = '<canvas class="sig-pad" width="600" height="200"></canvas><button type="button" class="btn sm ghost" data-sig-clear>Очистить</button>';
  const cv = $('canvas', host);
  const ctx = cv.getContext('2d');
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#111';
  let drawing = false;
  let empty = true;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', (e) => { drawing = true; empty = false; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
  cv.addEventListener('pointermove', (e) => { if (drawing) { ctx.lineTo(...pos(e)); ctx.stroke(); } });
  cv.addEventListener('pointerup', () => { drawing = false; });
  $('[data-sig-clear]', host).onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); empty = true; };
  return { isEmpty: () => empty, toBlob: () => new Promise((r) => cv.toBlob(r, 'image/png')) };
}

/** Документы сущности (наряд, автомобиль, клиент…) с версиями. */
async function documentsBox(host, entity, entityId) {
  const r = await api('/documents', { query: { entity, entity_id: entityId } });
  host.innerHTML = `${can('documents.edit') ? `<div class="photo-add"><select class="d-cat" style="width:auto">${opts(Object.entries(r.categories), entity === 'order' ? 'act' : 'other')}</select>
      <input class="d-title" placeholder="Название"><label class="btn primary"><input type="file" hidden class="d-file">Загрузить</label></div>` : ''}
    ${r.items.map((d) => `<div class="list-item"><div class="main"><b>${esc(d.title)}</b> <span class="muted small">${esc(r.categories[d.category])} · версия ${d.version}${d.retention_until ? ` · хранить до ${fmtDate(d.retention_until)}` : ''}</span></div>
      <a class="btn sm" href="/api/documents/${d.id}/versions/${d.version}/file" target="_blank" rel="noopener">Открыть</a>
      ${can('documents.edit') ? `<label class="btn sm ghost"><input type="file" hidden data-ver="${d.id}">Новая версия</label>` : ''}</div>`).join('') || '<div class="empty-sm">Документов нет</div>'}`;
  const upload = async (fields, file) => {
    const fd = new FormData();
    Object.entries(fields).forEach(([k, x]) => x != null && fd.append(k, x));
    fd.append('file', file);
    const res = await fetch('/api/documents', { method: 'POST', headers: { 'X-CRM': '1' }, body: fd });
    toast(res.ok ? 'Документ сохранён' : (await res.json().catch(() => ({}))).error || 'Ошибка загрузки');
    documentsBox(host, entity, entityId);
  };
  $('.d-file', host)?.addEventListener('change', (e) => upload({ category: $('.d-cat', host).value, title: $('.d-title', host).value, entity, entity_id: entityId }, e.target.files[0]));
  on(host, 'change', '[data-ver]', (e, el) => upload({ document_id: el.dataset.ver }, el.files[0]));
}

<script>
'use strict';

/* ======================= утилиты ======================= */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const NF = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const fmtNum = (n) => NF.format(+n || 0);
const money = (n) => NF.format(Math.round((+n || 0) * 100) / 100) + ' ₽';
const toNum = (v) => { const n = parseFloat(String(v ?? '').replace(/[\s ]/g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const round2 = (n) => Math.round(n * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const fmtDate = (s) => (s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : '');
const fmtDT = (s) => (s ? `${fmtDate(s)} ${s.slice(11, 16)}` : '');
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const longDate = (iso) => { const d = new Date(iso + 'T00:00:00'); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${WEEKDAYS[d.getDay()]}`; };
const toMin = (hhmm) => { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fromMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const carName = (c) => [c?.make, c?.model].filter(Boolean).join(' ');
const carLine = (c) => [carName(c), c?.plate].filter(Boolean).join(' · ');
// Российский номер «А123ВС777» рисуется как номерной знак: серия и номер, справа регион и RUS.
const PLATE_RX = /^([АВЕКМНОРСТУХ])(\d{3})([АВЕКМНОРСТУХ]{2})(\d{2,3})$/;
function plateHtml(value, cls = '') {
  const v = String(value || '').toUpperCase().replace(/\s/g, '');
  if (!v) return '';
  const m = v.match(PLATE_RX);
  if (!m) return `<span class="plate plate-free ${cls}"><span class="plate-main">${esc(v)}</span></span>`;
  return `<span class="plate ${cls}" title="${esc(v)}"><span class="plate-main">${m[1]}<b>${m[2]}</b>${m[3]}</span><span class="plate-reg">${m[4]}<i>RUS</i></span></span>`;
}
const carHtml = (c) => `${plateHtml(c?.plate)} <span>${esc(carName(c) || '—')}</span>`;
function monogram(name) {
  const words = String(name || '').replace(/[«»"']/g, '').split(/\s+/).filter(Boolean);
  if (!words.length) return 'АС';
  if (/^[A-ZА-ЯЁ]{2,3}$/.test(words[0])) return words[0];
  return words.slice(0, 2).map((w) => w[0]).join('').toUpperCase();
}
const initials = (name) => String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
const phoneLink = (p) => (p ? `<a href="tel:${esc(String(p).replace(/[^\d+]/g, ''))}">${esc(p)}</a>` : '');
const greeting = () => { const h = new Date().getHours(); return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; };

const ORDER_STATUS = {
  new: ['Новая заявка', ''],
  confirmed: ['Запись подтверждена', ''],
  accepted: ['Автомобиль принят', 'blue'],
  diagnostics: ['Диагностика', 'blue'],
  approval: ['Ждёт согласования', 'orange'],
  approved: ['Согласован', 'blue'],
  in_progress: ['В работе', 'blue'],
  waiting_parts: ['Ждёт запчасти', 'orange'],
  paused: ['Приостановлен', 'orange'],
  quality: ['Контроль качества', 'blue'],
  ready: ['Готов к выдаче', 'green'],
  done: ['Выдан', 'teal'],
  cancelled: ['Отменён', 'red'],
};
const APPT_STATUS = { planned: 'Предварительная', confirmed: 'Подтверждена', arrived: 'Приехал', no_show: 'Не приехал', cancelled: 'Отменена' };
const APPT_KIND = { visit: 'Визит клиента', break: 'Технический перерыв', maintenance: 'Обслуживание оборудования', block: 'Блокировка поста' };
const REC_PRIORITY = { urgent: ['Срочно', 'red'], planned: ['Планово', 'orange'], recommended: ['Рекомендовано', 'blue'], observe: ['Наблюдать на ТО', ''] };
const REC_STATUS = { new: 'Новая', offered: 'Предложена клиенту', approved: 'Согласована', rejected: 'Отклонена', done: 'Выполнена', postponed: 'Перенесена' };
const QC_ITEMS = { works: 'Выполненные работы проверены', parts: 'Установленные запчасти проверены', errors: 'Ошибки блоков управления', fluids: 'Уровни технических жидкостей', damage: 'Нет посторонних повреждений' };
/** Окно с полем причины; возвращает текст или null, если отменили. */
function askReason(title, { required = true, ph = '' } = {}) {
  return new Promise((resolve) => {
    let done = false;
    openModal({
      title,
      submit: 'Подтвердить',
      body: fText(required ? 'Причина *' : 'Комментарий', 'reason', '', { rows: 3, ph }),
      onSubmit: (d) => {
        if (required && !d.reason) throw new Error('Укажите причину');
        done = true;
        resolve(d.reason || '');
      },
      onClose: () => { if (!done) resolve(null); },
    });
  });
}
const PAY = { cash: 'Наличные', card: 'Карта', transfer: 'Перевод', invoice: 'Безнал (по счёту)' };
const badge = (st) => { const [t, c] = ORDER_STATUS[st] || [st, '']; return `<span class="badge ${c}">${esc(t)}</span>`; };

const ICONS = {
  tire: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  car: '<path d="M5 17h14M3 13l2-6h14l2 6v4H3z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',

const can = (p) => !!ME?.permissions && (ME.permissions.includes('*') || ME.permissions.includes(p));

async function api(path, { method = 'GET', body, query } = {}) {
  let url = '/api' + path;
  if (query) {
    const p = new URLSearchParams();
    for (const [k, v] of Object.entries(query)) if (v !== undefined && v !== null && v !== '' && v !== false) p.set(k, v);
    const s = p.toString();
    if (s) url += '?' + s;
  }
  const opts = { method, headers: { 'X-CRM': '1' } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try { res = await fetch(url, opts); } catch { throw new Error('Нет связи с сервером'); }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error(data?.error || `Ошибка ${res.status}`);
    err.status = res.status;
    err.data = data || {};
    if (res.status === 401 && !path.startsWith('/auth/')) { err.silent = true; ME = null; showLogin(); }
    throw err;
  }
  return data;
}

function cached(key, path) {
  if (!CACHE[key]) CACHE[key] = api(path).catch((e) => { delete CACHE[key]; throw e; });
  return CACHE[key];
}

let MEM_HASH = '#/';
const getHash = () => (MEMORY_NAV ? MEM_HASH : location.hash);
function replaceHash(hash) {
  if (MEMORY_NAV) MEM_HASH = hash;
  else history.replaceState(null, '', hash);
  CUR_HASH = getHash();
}
function go(hash) {
  if (getHash() === hash) router();
  else if (MEMORY_NAV) { MEM_HASH = hash; router(); }
  else location.hash = hash;
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.classList.add('hide'), type === 'error' ? 4500 : 2500);
  setTimeout(() => el.remove(), type === 'error' ? 5000 : 3000);
}

window.addEventListener('unhandledrejection', (e) => {
  const err = e.reason;
  if (err?.silent) return;

});

function on(root, type, selector, handler) {
  root.addEventListener(type, (e) => {
    const el = e.target.closest(selector);
    if (el && root.contains(el)) handler(e, el);
  });
}

const opts = (options, value) => options.map(([v, t]) => `<option value="${esc(v)}" ${String(v ?? '') === String(value ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('');
const fInput = (label, name, value = '', o = {}) => `<label class="field ${o.cls || ''}"><span>${esc(label)}${o.req ? ' *' : ''}</span><input name="${name}" type="${o.type || 'text'}" value="${esc(value ?? '')}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.req ? 'required' : ''} ${o.attrs || ''}></label>`;
const fNum = (label, name, value = '', o = {}) => fInput(label, name, value ?? '', { ...o, attrs: `inputmode="decimal" ${o.attrs || ''}` });
const fText = (label, name, value = '', o = {}) => `<label class="field ${o.cls ?? 'wide'}"><span>${esc(label)}</span><textarea name="${name}" rows="${o.rows || 3}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}>${esc(value ?? '')}</textarea></label>`;
const fSelect = (label, name, options, value, o = {}) => `<label class="field ${o.cls || ''}"><span>${esc(label)}</span><select name="${name}">${opts(options, value)}</select></label>`;
const fCheck = (label, name, checked) => `<label class="check"><input type="checkbox" name="${name}" ${checked ? 'checked' : ''}> ${esc(label)}</label>`;

function formToObj(form) {
  const out = {};
  for (const el of form.elements) {
    if (!el.name || el.disabled) continue;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'radio') { if (!el.checked) continue; v = el.value; } else v = el.value.trim();
    const path = el.name.split('.');
    let o = out;
    while (path.length > 1) { const k = path.shift(); o = o[k] = o[k] || {}; }
    o[path[0]] = v;
  }
  return out;
}

/** Окно подтверждения вместо confirm(): возвращает Promise<boolean>. */
function askConfirm(message, { ok = 'Да', title = 'Подтвердите действие' } = {}) {
  return new Promise((resolve) => {
    let answered = false;
    openModal({
      title,
      body: `<p style="margin:0;white-space:pre-line">${esc(message)}</p>`,
      submit: ok,
      onSubmit: () => { answered = true; resolve(true); },
      onClose: () => { if (!answered) resolve(false); },
    });
  });
}

function openModal({ title, body = '', submit = 'Сохранить', onSubmit, onClose, buttons = [], wide = false, size = '', cancel = 'Отмена' }) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<form class="modal ${size || (wide ? 'wide' : '')}" novalidate autocomplete="off">
    <div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close title="Закрыть">${icon('x')}</button></div>
    <div class="modal-body">${body}<div class="form-error" hidden></div></div>
    <div class="modal-foot"></div></form>`;
  const form = $('form', ov);
  const foot = $('.modal-foot', ov);
  const errBox = $('.form-error', ov);
  const m = {
    el: ov, form, body: $('.modal-body', ov), close,
    error(msg) { errBox.textContent = msg || ''; errBox.hidden = !msg; },
  };
  async function run(fn) {
    m.error('');
    const btns = $$('button', foot);
    btns.forEach((b) => { b.disabled = true; });
    try {
      const r = await fn();
      if (r !== false) close();
    } catch (e) {
      if (!e.silent) m.error(e.message);
    } finally {
      btns.forEach((b) => { b.disabled = false; });
    }
  }
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `btn ${b.cls || ''}`;
    btn.innerHTML = b.label;
    btn.onclick = () => run(() => b.onClick(m));
    foot.append(btn);
  }
  if (buttons.length) foot.insertAdjacentHTML('beforeend', '<span class="spacer"></span>');
  if (cancel) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = cancel;
    btn.onclick = close;
    foot.append(btn);
  }
  if (onSubmit) foot.insertAdjacentHTML('beforeend', `<button type="submit" class="btn primary">${esc(submit)}</button>`);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!onSubmit) return;
    const missing = $$('[required]', form).find((el) => !el.disabled && !el.value.trim());
    if (missing) { m.error('Заполните обязательные поля'); missing.focus(); return; }
    run(() => onSubmit(formToObj(form), m));
  });
  function onKey(e) {
    if (e.key === 'Escape' && $$('.modal-overlay').pop() === ov) close();
  }
  function close() {
    if (!ov.isConnected) return;
    ov.remove();
    document.removeEventListener('keydown', onKey);
    onClose?.();
  }
  document.addEventListener('keydown', onKey);
  $('[data-close]', ov).onclick = close;
  document.body.append(ov);
  setTimeout(() => ($('input:not([type=hidden]):not([disabled]), select, textarea', m.body) || $('button[type=submit]', foot))?.focus(), 30);
  return m;
}

/** Выпадающие подсказки под полем ввода. source(q) -> Promise<items>. */
function autocomplete(input, { source, render, onPick, footer, minLen = 1, blockEnter = false }) {
  const wrap = input.parentElement;
  if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';
  const box = document.createElement('div');
  box.className = 'ac-box';
  box.hidden = true;
  wrap.append(box);
  let all = [];
  let idx = -1;
  let seq = 0;
  const hide = () => { box.hidden = true; box.innerHTML = ''; all = []; idx = -1; };
  const highlight = () => {
    $$('.ac-item', box).forEach((el, i) => el.classList.toggle('active', i === idx));
    $('.ac-item.active', box)?.scrollIntoView({ block: 'nearest' });
  };
  const draw = (items, q) => {
    all = [...items];
    const f = footer?.(q);
    if (f) all.push({ __footer: true, label: f });
    idx = all.length ? 0 : -1;
    box.innerHTML = all.length
      ? all.map((it, i) => `<div class="ac-item ${it.__footer ? 'footer' : ''} ${i === idx ? 'active' : ''}" data-i="${i}">${it.__footer ? esc(it.label) : render(it)}</div>`).join('')
      : '<div class="ac-empty">Ничего не найдено</div>';
    box.hidden = false;
  };
  const load = debounce(async () => {
    const q = input.value.trim();
    if (q.length < minLen) { hide(); return; }
    const my = ++seq;
    let items;
    try { items = await source(q); } catch { return; }
    if (my !== seq || document.activeElement !== input) return;
    draw(items, q);
  }, 180);
  const pick = (i) => {
    const it = all[i];
    if (!it) return;
    const q = input.value.trim();
    hide();
    onPick(it.__footer ? null : it, q);
  };
  input.addEventListener('input', load);
  input.addEventListener('keydown', (e) => {
    if (box.hidden) {
      if (e.key === 'Enter' && blockEnter) e.preventDefault();
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, all.length - 1); highlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); highlight(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (idx >= 0) pick(idx); }
    else if (e.key === 'Escape') { e.stopPropagation(); hide(); }
  });
  box.addEventListener('mousedown', (e) => {
    const el = e.target.closest('.ac-item');
    if (el) { e.preventDefault(); pick(+el.dataset.i); }
  });
  input.addEventListener('blur', () => setTimeout(hide, 150));
  return { hide };
}

function authForm(a, path, check) {
  const form = $('form', a);
  const err = $('.form-error', form);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const d = formToObj(form);
    try {
      const problem = check?.(d);
      if (problem) throw new Error(problem);
      await api(path, { method: 'POST', body: d });
      boot();
    } catch (ex) {
      if (ex.data?.code === '2fa_required' && !$('[name=code]', form)) {
        err.insertAdjacentHTML('beforebegin', fInput('Код из приложения-аутентификатора', 'code', '', { req: true, attrs: 'inputmode="numeric" autocomplete="one-time-code" maxlength="6"' }));
        $('[name=code]', form).focus();
      }
      err.textContent = ex.message; err.hidden = false;
    }
  };
  $('input', form).focus();
}

  applyCompany();

async function router() {
  if (!ME) return;
  if (LEAVE_GUARD && getHash() !== CUR_HASH && LEAVE_GUARD()) {
    if (!await askConfirm('Есть несохранённые изменения. Уйти без сохранения?')) {
      replaceHash(CUR_HASH || '#/');
      return;
    }
  }
  LEAVE_GUARD = null;
  SAVE_HANDLER = null;
  CUR_HASH = getHash();
  const raw = getHash().slice(1) || '/';
  const [path, qs] = raw.split('?');
  const params = new URLSearchParams(qs || '');
  document.body.classList.remove('menu-open');
  const printing = path.startsWith('/print/');
  document.body.classList.toggle('printing', printing);
  $('#print-root').hidden = !printing;
  if (!printing) $('#print-root').replaceChildren();
  const host = printing ? $('#print-root') : $('#main');
  const view = document.createElement('div');
  host.replaceChildren(view);
  view.innerHTML = '<div class="loading">Загрузка…</div>';
  window.scrollTo(0, 0);
  $$('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.nav === '/' ? path === '/' : path.startsWith(a.dataset.nav)));
  for (const [rx, fn] of ROUTES) {
    const m = path.match(rx);
    if (!m) continue;
    try {
      await fn(view, params, ...m.slice(1).map(Number));
    } catch (e) {
      if (!e.silent) view.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
    return;
  }
  view.innerHTML = '<div class="empty">Страница не найдена</div>';
}

/** Поле выбора клиента: поиск существующего или ввод нового, плюс выбор автомобиля. */
function clientPicker(host, { clientId = null, carId = null } = {}) {
  const st = { mode: 'search', client: null, cars: [], carId: carId ? String(carId) : null, newName: '', newPhone: '' };

  function select(c, preferCar) {
    st.mode = 'picked';
    st.client = c;
    st.cars = c.cars || [];
    st.carId = preferCar ? String(preferCar) : (st.cars.length ? String(st.cars[0].id) : 'new');
    draw();
  }
  function newClient(q) {
    st.mode = 'new';
    const digits = (q || '').replace(/\D/g, '');
    st.newPhone = digits.length >= 5 ? q : '';
    st.newName = digits.length >= 5 ? '' : q || '';
    draw();
    $(st.newName ? 'input[name="client.phone"]' : 'input[name="client.name"]', host)?.focus();
  }
  function draw() {
    if (st.mode === 'search') {
      host.innerHTML = `<div class="picker"><label class="field"><span>Клиент *</span>
        <input class="pk-search" placeholder="Начните вводить телефон, имя или госномер…" autocomplete="off"></label>
        <div class="hint" style="margin-top:6px">Новый клиент? <button type="button" class="link-btn" data-new>Заполнить данные</button></div></div>`;
      const inp = $('.pk-search', host);
      autocomplete(inp, {
        source: async (q) => (await api('/search', { query: { q } })).clients,
        render: clientItem,
        onPick: (c, q) => (c ? select(c) : newClient(q)),
        footer: (q) => `+ Новый клиент «${q}»`,
        minLen: 2,
        blockEnter: true,
      });
      $('[data-new]', host).onclick = () => newClient(inp.value.trim());
      setTimeout(() => inp.focus(), 40);
    } else if (st.mode === 'new') {
      host.innerHTML = `<div class="picker"><div class="section-label" style="margin-top:0">Новый клиент</div>
        <div class="form-grid">${fInput('Имя или организация', 'client.name', st.newName, { req: true })}
        ${fInput('Телефон', 'client.phone', st.newPhone, { type: 'tel', ph: '+7 900 000-00-00' })}</div>
        <div class="section-label">Автомобиль</div>${carFields()}
        <div class="hint" style="margin-top:8px"><button type="button" class="link-btn" data-back>← Найти существующего клиента</button></div></div>`;
      $('[data-back]', host).onclick = () => { st.mode = 'search'; draw(); };
    } else {
      const c = st.client;
      const carOpts = [...st.cars.map((x) => [x.id, carLine(x) || `Автомобиль #${x.id}`]), ['new', '+ Добавить автомобиль'], ['', '— Без автомобиля —']];
      host.innerHTML = `<div class="picker">
        <div class="picked"><div><div class="t">${esc(c.name)}</div><div class="muted small">${esc(c.phone || 'телефон не указан')}</div></div>
        <button type="button" class="btn sm" data-change>Сменить</button></div>
        <input type="hidden" name="client_id" value="${c.id}">
        ${fSelect('Автомобиль', 'car_id', carOpts, st.carId)}
        <div class="pk-newcar" style="margin-top:12px">${carFields()}</div></div>`;
      const sel = $('select[name=car_id]', host);
      const sync = () => {
        st.carId = sel.value;
        const box = $('.pk-newcar', host);
        box.hidden = st.carId !== 'new';
        $$('input', box).forEach((i) => { i.disabled = box.hidden; });
      };
      sel.onchange = sync;
      sync();
      $('[data-change]', host).onclick = () => { st.mode = 'search'; draw(); };
    }
  }
  const ready = (async () => {
    if (clientId) {
      const c = await api(`/clients/${clientId}`);
      select(c, carId);
    } else draw();
  })();
  return { ready };
}

/** Приводит данные из clientPicker к формату API. */
function normPick(d) {
  // car_id нет — это новый клиент, машина приходит полями car.*; 'new' — новая машина у существующего.
  if (d.car_id === 'new' || d.car_id === undefined) {
    delete d.car_id;
    return d;
  }
  delete d.car;
  if (d.car_id === '') delete d.car_id;
  return d;
}

function nextSlot() {
  const now = new Date();
  let m = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 30) * 30;
  const start = toMin(SETTINGS.work_start || '09:00');
  const end = toMin(SETTINGS.work_end || '20:00');
  if (m < start || m >= end) m = start;
  return fromMin(m);
}

  if (a.duration && !durations.some(([v]) => v === a.duration)) durations.push([a.duration, `${a.duration} мин`]);

    body: `<div class="form-grid">${fSelect('Вид', 'kind', Object.entries(APPT_KIND), a.kind || 'visit')}</div>

}

    const tag = href ? 'a' : 'div';
    return `<${tag} ${href ? `href="${href}"` : ''} class="kpi ${alert ? 'alert' : ''}"><div class="kpi-top"><span class="kpi-ic">${icon(ic)}</span><span class="label">${esc(label)}</span></div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</${tag}>`;
  };
  // Посты сейчас: какая машина на подъёмнике и когда он освободится.
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const live = d.appointments.map((a, i) => ({ a, i, s: toMin(a.start.slice(11, 16)) })).filter((x) => ['planned', 'arrived'].includes(x.a.status));
  const bay = (p) => {
    const mine = live.filter((x) => x.a.post_id === p.id).sort((x, y) => x.s - y.s);
    const cur = mine.find((x) => x.s <= nowMin && nowMin < x.s + x.a.duration);
    const next = mine.find((x) => x.s > nowMin);
    if (cur) {
      const pct = Math.min(100, Math.round(((nowMin - cur.s) / cur.a.duration) * 100));
      return `<button type="button" class="bay busy" data-appt="${cur.i}">
        <div class="bay-top"><span class="bay-name">${esc(p.name)}</span><span class="bay-state">занят</span></div>

  const active = d.active_orders.length ? `<div class="table-wrap"><table class="tbl"><tbody>${d.active_orders.slice(0, 12).map((o) => `
